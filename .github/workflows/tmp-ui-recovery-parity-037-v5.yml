name: UI recovery parity 0.37 v5

on:
  push:
    branches:
      - tmp/ui-recovery-parity-037-v5

permissions:
  contents: read

jobs:
  recovery-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - name: Run focused UI recovery coverage
        run: >-
          pytest -q
          tests/test_account_menu_037.py
          tests/e2e/test_account_menu_037.py
          tests/test_navigation_polish_037.py
          tests/e2e/test_navigation_polish_037.py
          tests/test_settings_redesign_037.py
          tests/e2e/test_settings_redesign_037.py
          tests/test_item_edit_sections.py
          tests/test_item_detail_refresh_037.py
          tests/e2e/test_item_detail_refresh_037.py
          tests/test_media_families_037.py
          tests/e2e/test_home_media_families_037.py
          tests/test_music_browse_artwork_037.py
          tests/test_browse_toolbar_037.py
          tests/e2e/test_browse_toolbar_037.py
          tests/test_browse_parity.py
          tests/e2e/test_browse.py::test_browse_media_type_filter
          tests/e2e/test_browse.py::test_browse_filters_restored_on_return
          tests/e2e/test_browse.py::test_browse_clear_all_filters_drops_restore
          tests/e2e/test_browse.py::test_browse_language_filter_narrows_and_composes
      - run: make check-alpine

  unit-and-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: make test
      - run: make checks-fast

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: make test-e2e

  generated-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: make css
      - run: git diff --exit-code --stat README.md static/css/app.css static/sw.js
