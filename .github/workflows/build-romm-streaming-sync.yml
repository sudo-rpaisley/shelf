name: Finish RomM streaming sync

on:
  push:
    branches: [tmp/romm-streaming-builder-final]
    paths: [.github/workflows/build-romm-streaming-sync.yml]

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/romm-streaming-sync
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Merge current main safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Conflicts:"
            printf '%s\n' "$conflicts"
            unexpected="$(printf '%s\n' "$conflicts" | grep -v '^README.md$' || true)"
            if [ -n "$unexpected" ]; then
              echo "::error::Unexpected source conflicts:"
              printf '%s\n' "$unexpected"
              exit 1
            fi
            git checkout --ours README.md
            git add README.md
          fi

      - name: Simplify cover URL handling
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/services/romm.py')
          text = p.read_text()
          text = text.replace(
              'def _import_rom_batch(\n    db,\n    roms: list[dict],',
              'def _import_rom_batch(\n    db,\n    romm_url: str,\n    roms: list[dict],',
              1,
          )
          text = text.replace('        cover_url = _cover_url("", rom)\n', '        cover_url = _cover_url(romm_url, rom)\n', 1)
          text = text.replace(
              '                            db,\n                            batch,\n                            shelf_platform,',
              '                            db,\n                            romm_url,\n                            batch,\n                            shelf_platform,',
              1,
          )
          old = '''                    for cover_url, item_id in cover_jobs:\n                        resolved_cover = urljoin(\n                            romm_url.rstrip("/") + "/",\n                            cover_url,\n                        )\n                        cover_batch.append(\n                            (client, romm_url, token, resolved_cover, item_id)\n                        )\n'''
          new = '''                    for cover_url, item_id in cover_jobs:\n                        cover_batch.append(\n                            (client, romm_url, token, cover_url, item_id)\n                        )\n'''
          if old not in text:
              raise SystemExit('cover URL block not found')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY

      - name: Regenerate derived badge
        run: make badges

      - name: Run focused checks
        run: |
          python -m pytest tests/test_romm_sync.py tests/test_romm_progress_ui.py tests/test_romm_public_url.py -q --tb=short
          make checks-fast

      - name: Commit and push combined tree
        shell: bash
        run: |
          set -euo pipefail
          git add app/services/romm.py README.md
          git commit -m "Bring RomM streaming sync onto current main"
          git push origin HEAD:perf/romm-streaming-sync
