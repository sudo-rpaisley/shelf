name: Fix 0.39 legacy copy write funnel v2

on:
  push:
    branches:
      - tmp/integration-039-copy-funnel-fix-v2

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration target
        uses: actions/checkout@v7
        with:
          ref: rebuild/integration-039
          fetch-depth: 0

      - name: Route legacy copy writes through item_copies.insert_copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('app/services/item_copies.py')
          s = p.read_text()

          old_sig = "def insert_copy(db, fields: Mapping[str, Any]) -> int:\n"
          new_sig = (
              "def insert_copy(\n"
              "    db, fields: Mapping[str, Any], *, preserve_id: int | None = None,\n"
              ") -> int:\n"
          )
          if old_sig not in s:
              raise SystemExit('insert_copy signature anchor not found')
          s = s.replace(old_sig, new_sig, 1)

          anchor = '    _validated_names(db, values, _MANAGED, "insert_copy")\n'
          replacement = (
              anchor
              + "    if preserve_id is not None:\n"
              + "        if not isinstance(preserve_id, int) or preserve_id <= 0:\n"
              + "            raise ValueError(\n"
              + '                "insert_copy() preserve_id must be a positive integer"\n'
              + "            )\n"
              + "        # Migration bridges occasionally need to preserve row identity.\n"
              + "        # Keep the managed id outside caller-supplied fields, then add it\n"
              + "        # here inside the single item_copies INSERT funnel.\n"
              + '        values = {"id": preserve_id, **values}\n'
          )
          if anchor not in s:
              raise SystemExit('insert_copy validation anchor not found')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s)

          p = Path('app/services/fork_upgrade.py')
          s = p.read_text()

          import_anchor = (
              "    _create_current_item_copies(db)\n"
              "    _ensure_position_order(db)\n\n"
              "    for row in rows:\n"
          )
          import_replacement = (
              "    _create_current_item_copies(db)\n"
              "    _ensure_position_order(db)\n\n"
              "    from app.services import item_copies\n\n"
              "    for row in rows:\n"
          )
          if import_anchor not in s:
              raise SystemExit('legacy rebuild import anchor not found')
          s = s.replace(import_anchor, import_replacement, 1)

          start_marker = (
              '        db.execute(\n'
              '            """INSERT INTO item_copies (\n'
              '                id, item_id, copy_number, location_id, condition, notes,\n'
          )
          start = s.find(start_marker)
          if start < 0:
              raise SystemExit('legacy copy rebuild SQL start not found')
          end_marker = '\n\n    db.execute("DROP TABLE item_copies_pre037")'
          end = s.find(end_marker, start)
          if end < 0:
              raise SystemExit('legacy copy rebuild SQL end not found')

          new_block = (
              "        item_copies.insert_copy(\n"
              "            db,\n"
              "            {\n"
              '                "item_id": row["item_id"],\n'
              '                "copy_number": row["copy_number"],\n'
              '                "location_id": new_location,\n'
              '                "condition": row.get("condition"),\n'
              '                "notes": row.get("notes"),\n'
              '                "acquired_date": row.get("acquired_date"),\n'
              '                "acquisition_source": row.get("acquisition_source"),\n'
              '                "acquisition_price": row.get("acquisition_price"),\n'
              '                "provenance": row.get("provenance"),\n'
              '                "copy_barcode": row.get("copy_barcode"),\n'
              '                "is_primary": row.get("is_primary", 0),\n'
              '                "created_at": row.get("created_at"),\n'
              '                "updated_at": row.get("updated_at"),\n'
              '                "position_order": row.get("position_order"),\n'
              "            },\n"
              '            preserve_id=int(row["id"]),\n'
              "        )"
          )
          s = s[:start] + new_block + s[end:]

          backfill_start = s.find(
              "    # Reproduce upstream migration 26 for catalogue rows that never passed\n"
          )
          if backfill_start < 0:
              raise SystemExit('legacy primary-copy backfill start not found')
          backfill_end = s.find(
              "    _sync_catalogue_locations_from_primary_copies(db)",
              backfill_start,
          )
          if backfill_end < 0:
              raise SystemExit('legacy primary-copy backfill end not found')

          backfill = (
              "    # Reproduce upstream migration 26 for catalogue rows that never passed\n"
              "    # through the fork's holdings projection, but use the current copy\n"
              "    # write funnel rather than carrying a second raw INSERT path.\n"
              "    from app.services import item_copies\n\n"
              "    missing = db.execute(\n"
              '        """SELECT i.id, i.location_id FROM items i\n'
              "           WHERE i.owned = 1 AND i.location_id IS NOT NULL\n"
              "             AND NOT EXISTS (\n"
              "                 SELECT 1 FROM item_copies c WHERE c.item_id = i.id\n"
              "             )\n"
              '           ORDER BY i.id"""\n'
              "    ).fetchall()\n"
              "    for row in missing:\n"
              "        item_copies.insert_copy(\n"
              "            db,\n"
              "            {\n"
              '                "item_id": int(row["id"]),\n'
              '                "copy_number": 1,\n'
              '                "location_id": row["location_id"],\n'
              '                "is_primary": 1,\n'
              "            },\n"
              "        )\n"
          )
          s = s[:backfill_start] + backfill + s[backfill_end:]
          p.write_text(s)
          PY

          python -m compileall -q app
          git diff --check
          if grep -n "INSERT INTO item_copies" app/services/fork_upgrade.py; then
            echo "fork_upgrade still contains a raw item_copies INSERT" >&2
            exit 1
          fi
          git diff --stat

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Focused copy and upgrade regression tests
        run: |
          pytest -q tests/test_item_write.py tests/test_fork_upgrade_037.py
          make checks-fast

      - name: Commit fix to integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Robert J Paisley"
          git config user.email "56076332+sudo-rpaisley@users.noreply.github.com"
          git add app/services/item_copies.py app/services/fork_upgrade.py
          git commit -m "Fix: route legacy copy upgrades through the copy write funnel"
          git push origin HEAD:rebuild/integration-039
