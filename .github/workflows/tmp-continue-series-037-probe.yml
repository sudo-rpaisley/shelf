name: Temporary Continue Series 0.37 probe

on:
  push:
    branches:
      - tmp/continue-series-037-probe-build

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/library-secondary-reads-037
          fetch-depth: 0

      - name: Load Continue Series payload
        run: |
          git fetch origin tmp/continue-series-037-payload
          git show origin/tmp/continue-series-037-payload:app/routers/continue_home.py > app/routers/continue_home.py
          mkdir -p app/templates/fragments
          git show origin/tmp/continue-series-037-payload:app/templates/fragments/continue.html > app/templates/fragments/continue.html
          git show origin/tmp/continue-series-037-payload:tests/test_continue_series_037.py > tests/test_continue_series_037.py
          git show origin/tmp/continue-series-037-payload:tmp/apply_continue_series_037.py > /tmp/apply_continue_series_037.py
          python /tmp/apply_continue_series_037.py
          git diff --check

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Focused Continue Series regressions
        run: |
          python -m pytest \
            tests/test_continue_series_037.py \
            tests/test_home_dashboard.py \
            tests/test_home_page.py \
            tests/test_back_nav.py \
            tests/test_nav.py \
            tests/test_router_registration.py \
            tests/test_series.py \
            tests/test_personal_state_routes_037.py \
            tests/test_user_state_foundation_037.py \
            tests/test_library_secondary_reads_037.py \
            tests/test_library_item_access_037.py \
            tests/test_schema_ownership.py \
            tests/test_module_sizes.py \
            -q --tb=short

      - name: Fast architecture checks
        run: make checks-fast
