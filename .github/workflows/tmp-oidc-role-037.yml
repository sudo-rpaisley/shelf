name: Temporary OIDC policy core 0.37

on:
  push:
    branches:
      - tmp/oidc-role-037-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upstream/0.37.2-base
          fetch-depth: 0

      - name: Replay focused OIDC policy commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick 356da76ea904c59f29aadefaef75384bf031f4fa
          git diff --check HEAD^

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Focused OIDC policy tests
        run: python -m pytest tests/test_oidc_core.py -q --tb=short

      - name: Refresh test-count badges
        run: make badges

      - name: Full unit regression
        run: make test

      - name: Fast checks
        run: make checks-fast

      - name: Finalize clean 0.37 commit
        run: |
          git add README.md
          git diff --check --cached
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:upstream/oidc-role-mapping-037
