name: Temporary OIDC policy core 0.37

on:
  push:
    branches:
      - tmp/oidc-role-037-build

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upstream/oidc-role-mapping-037
          fetch-depth: 0
      - name: Correct finalized commit message
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --amend -m "OIDC: add role-mapping policy core on Shelf 0.37.2"
          git push --force-with-lease origin HEAD:upstream/oidc-role-mapping-037
