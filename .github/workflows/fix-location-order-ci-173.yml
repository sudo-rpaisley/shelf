name: Fix location ordering CI 173

on:
  push:
    branches:
      - helper/fix-location-order-ci-173

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: helper/fix-location-order-ci-173
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply focused repair
        run: python scripts/_fix_location_order_ci_173.py
      - name: Run unit and convention checks
        run: make test
      - name: Commit repaired product tree
        run: |
          rm scripts/_fix_location_order_ci_173.py
          rm .github/workflows/fix-location-order-ci-173.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix location ordering migration and E2E wait'
          git push origin HEAD:helper/fix-location-order-ci-173
