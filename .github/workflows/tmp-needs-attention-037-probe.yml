name: Temporary Needs Attention 0.37 probe

on:
  push:
    branches:
      - tmp/needs-attention-037-probe-build

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/library-scan-acl-037
          fetch-depth: 0

      - name: Load Needs Attention payload
        run: |
          git fetch origin tmp/needs-attention-037-payload
          git show origin/tmp/needs-attention-037-payload:app/routers/attention.py > app/routers/attention.py
          git show origin/tmp/needs-attention-037-payload:app/templates/attention.html > app/templates/attention.html
          git show origin/tmp/needs-attention-037-payload:tests/test_needs_attention_037.py > tests/test_needs_attention_037.py
          git show origin/tmp/needs-attention-037-payload:tmp/apply_needs_attention_037.py > /tmp/apply_needs_attention_037.py
          python /tmp/apply_needs_attention_037.py
          git diff --check

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Focused Needs Attention regressions
        run: |
          python -m pytest \
            tests/test_needs_attention_037.py \
            tests/test_library_item_access_037.py \
            tests/test_library_home_stats_037.py \
            tests/test_library_scan_acl_037.py \
            tests/test_router_registration.py \
            tests/test_schema_ownership.py \
            tests/test_module_sizes.py \
            -q --tb=short

      - name: Fast architecture checks
        run: |
          make badges
          make checks-fast
