name: Apply multi-series merge-readiness fixes

on:
  push:
    branches:
      - feature/multi-series-item-rows
    paths:
      - .github/workflows/merge-ready-multiseries-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/multi-series-item-rows
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply merge-readiness fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count))

          # Auth users are dicts throughout the current auth layer, but keep the
          # fragment renderer tolerant of attribute-style objects as well.
          replace(
              'app/routers/series_memberships.py',
              '''    context["can_edit"] = bool(
                  request.state.user and request.state.user.role in ("admin", "editor")
              )''',
              '''    user = getattr(request.state, "user", None)
              role = user.get("role") if isinstance(user, dict) else getattr(user, "role", None)
              context["can_edit"] = role in ("admin", "editor")'''
          )

          # Make the global Series surface use the membership table too.  The
          # legacy item fields are still synchronised as the primary membership
          # for compatibility with older integrations and imports.
          p = Path('app/routers/series.py')
          text = p.read_text()

          marker = '''UNASSIGNED_STRIP_CAP = 12


def find_gaps'''
          helper = '''UNASSIGNED_STRIP_CAP = 12


def _sync_item_series_memberships(db) -> None:
              """Reconcile legacy primary series fields into ``item_series``.

              Migrations backfill existing libraries at startup.  This lightweight
              reconciliation also covers tests/imports/older edit paths that may write
              ``items.series_name`` directly after startup while preserving secondary
              memberships.
              """
              db.execute(
                  """CREATE TABLE IF NOT EXISTS item_series (
                      item_id INTEGER NOT NULL REFERENCES items(id) ON DELETE CASCADE,
                      series_name TEXT NOT NULL COLLATE NOCASE,
                      position REAL,
                      is_primary INTEGER NOT NULL DEFAULT 0,
                      created_at TEXT NOT NULL DEFAULT (datetime('now')),
                      PRIMARY KEY (item_id, series_name)
                  )"""
              )
              db.execute(
                  "CREATE INDEX IF NOT EXISTS idx_item_series_name "
                  "ON item_series(series_name COLLATE NOCASE)"
              )
              db.execute(
                  "DELETE FROM item_series WHERE is_primary = 1 AND NOT EXISTS ("
                  "SELECT 1 FROM items i WHERE i.id = item_series.item_id "
                  "AND i.series_name IS NOT NULL AND TRIM(i.series_name) != '' "
                  "AND TRIM(i.series_name) = item_series.series_name COLLATE NOCASE"
                  ")"
              )
              db.execute(
                  "INSERT INTO item_series (item_id, series_name, position, is_primary) "
                  "SELECT id, TRIM(series_name), series_position, 1 FROM items "
                  "WHERE series_name IS NOT NULL AND TRIM(series_name) != '' "
                  "ON CONFLICT(item_id, series_name) DO UPDATE SET "
                  "position = excluded.position, is_primary = 1"
              )


def _promote_primary_membership(db, item_id: int) -> None:
              """Promote the oldest remaining membership and sync legacy fields."""
              replacement = db.execute(
                  "SELECT series_name, position FROM item_series WHERE item_id = ? "
                  "ORDER BY created_at, series_name COLLATE NOCASE LIMIT 1",
                  (item_id,),
              ).fetchone()
              if replacement:
                  db.execute(
                      "UPDATE item_series SET is_primary = CASE "
                      "WHEN series_name = ? COLLATE NOCASE THEN 1 ELSE 0 END "
                      "WHERE item_id = ?",
                      (replacement["series_name"], item_id),
                  )
                  db.execute(
                      "UPDATE items SET series_name = ?, series_position = ?, "
                      "updated_at = datetime('now') WHERE id = ?",
                      (replacement["series_name"], replacement["position"], item_id),
                  )
              else:
                  db.execute(
                      "UPDATE items SET series_name = NULL, series_position = NULL, "
                      "updated_at = datetime('now') WHERE id = ?",
                      (item_id,),
                  )


def find_gaps'''
          if marker not in text:
              raise SystemExit('series helper insertion anchor not found')
          text = text.replace(marker, helper, 1)

          old = '''    with get_db() as db:
                  rows = db.execute(
                      "SELECT id, title, authors, cover_path, series_name, series_position, "
                      "owned, reading_status FROM items WHERE series_name IS NOT NULL "
                      "AND TRIM(series_name) != '' "
                      "ORDER BY series_name COLLATE NOCASE, "
                      "series_position IS NULL, series_position, title COLLATE NOCASE"
                  ).fetchall()'''
          new = '''    with get_db() as db:
                  _sync_item_series_memberships(db)
                  rows = db.execute(
                      "SELECT i.id, i.title, i.authors, i.cover_path, "
                      "s.series_name, s.position AS series_position, "
                      "i.owned, i.reading_status FROM item_series s "
                      "JOIN items i ON i.id = s.item_id "
                      "ORDER BY s.series_name COLLATE NOCASE, "
                      "s.position IS NULL, s.position, i.title COLLATE NOCASE"
                  ).fetchall()'''
          if old not in text:
              raise SystemExit('series page query anchor not found')
          text = text.replace(old, new, 1)

          old = '''        _unassigned_where = (
                  "(series_name IS NULL OR TRIM(series_name) = '') "
                  f"AND media_type IN ({','.join('?' * len(UNASSIGNED_MEDIA_TYPES))})"
              )'''
          new = '''        _unassigned_where = (
                  "NOT EXISTS (SELECT 1 FROM item_series s WHERE s.item_id = items.id) "
                  f"AND media_type IN ({','.join('?' * len(UNASSIGNED_MEDIA_TYPES))})"
              )'''
          if old not in text:
              raise SystemExit('unassigned query anchor not found')
          text = text.replace(old, new, 1)

          old = '''    with get_db() as db:
                  token = get_setting(db, "hardcover_token")
                  if not token:
                      return {"ok": False, "message": "Hardcover integration not configured"}
                  local = db.execute(
                      "SELECT title, owned, hardcover_book_id FROM items "
                      "WHERE series_name = ? COLLATE NOCASE",
                      (name,),
                  ).fetchall()'''
          new = '''    with get_db() as db:
                  _sync_item_series_memberships(db)
                  token = get_setting(db, "hardcover_token")
                  if not token:
                      return {"ok": False, "message": "Hardcover integration not configured"}
                  local = db.execute(
                      "SELECT i.title, i.owned, i.hardcover_book_id FROM item_series s "
                      "JOIN items i ON i.id = s.item_id "
                      "WHERE s.series_name = ? COLLATE NOCASE",
                      (name,),
                  ).fetchall()'''
          if old not in text:
              raise SystemExit('series check local query anchor not found')
          text = text.replace(old, new, 1)

          old = '''    with get_db() as db:
                  count = db.execute(
                      "SELECT COUNT(*) AS c FROM items WHERE series_name = ? COLLATE NOCASE",
                      (name,),
                  ).fetchone()["c"]
                  if not count:
                      return {"ok": False, "message": "Series not found"}

                  _upsert_series_complete(db, name, value)'''
          new = '''    with get_db() as db:
                  _sync_item_series_memberships(db)
                  count = db.execute(
                      "SELECT COUNT(*) AS c FROM item_series "
                      "WHERE series_name = ? COLLATE NOCASE",
                      (name,),
                  ).fetchone()["c"]
                  if not count:
                      return {"ok": False, "message": "Series not found"}

                  _upsert_series_complete(db, name, value)'''
          if old not in text:
              raise SystemExit('series complete count anchor not found')
          text = text.replace(old, new, 1)

          old_start = text.index('    with get_db() as db:\n        count = db.execute(\n            "SELECT COUNT(*) AS c FROM items WHERE series_name = ? COLLATE NOCASE",\n            (name,),\n        ).fetchone()["c"]\n        if not count:\n            return {"ok": False, "message": "Series not found"}\n\n        # Both reads happen before the UPDATE', text.index('async def rename_series'))
          old_end = text.index('        return {"ok": True, "name": new_name, "merged": merged, "count": count}\n', old_start) + len('        return {"ok": True, "name": new_name, "merged": merged, "count": count}\n')
          replacement = '''    with get_db() as db:
                  _sync_item_series_memberships(db)
                  source_rows = db.execute(
                      "SELECT item_id, position, is_primary FROM item_series "
                      "WHERE series_name = ? COLLATE NOCASE "
                      "ORDER BY item_id",
                      (name,),
                  ).fetchall()
                  count = len(source_rows)
                  if not count:
                      return {"ok": False, "message": "Series not found"}

                  merged = bool(db.execute(
                      "SELECT 1 FROM item_series WHERE series_name = ? COLLATE NOCASE LIMIT 1",
                      (new_name,),
                  ).fetchone())
                  src_meta = db.execute(
                      "SELECT description, source, complete, hc_total, hc_missing, hc_checked_at "
                      "FROM series_meta WHERE name = ? COLLATE NOCASE",
                      (name,),
                  ).fetchone()
                  dst_meta = db.execute(
                      "SELECT description, complete, hc_total, hc_missing, hc_checked_at "
                      "FROM series_meta WHERE name = ? COLLATE NOCASE",
                      (new_name,),
                  ).fetchone()

                  for source in source_rows:
                      target = db.execute(
                          "SELECT position, is_primary FROM item_series "
                          "WHERE item_id = ? AND series_name = ? COLLATE NOCASE",
                          (source["item_id"], new_name),
                      ).fetchone()
                      if target:
                          position = target["position"] if target["position"] is not None else source["position"]
                          is_primary = int(bool(target["is_primary"] or source["is_primary"]))
                          db.execute(
                              "UPDATE item_series SET position = ?, is_primary = ? "
                              "WHERE item_id = ? AND series_name = ? COLLATE NOCASE",
                              (position, is_primary, source["item_id"], new_name),
                          )
                          db.execute(
                              "DELETE FROM item_series WHERE item_id = ? "
                              "AND series_name = ? COLLATE NOCASE",
                              (source["item_id"], name),
                          )
                      else:
                          position = source["position"]
                          is_primary = int(source["is_primary"])
                          db.execute(
                              "UPDATE item_series SET series_name = ? "
                              "WHERE item_id = ? AND series_name = ? COLLATE NOCASE",
                              (new_name, source["item_id"], name),
                          )

                      if is_primary:
                          db.execute(
                              "UPDATE item_series SET is_primary = CASE "
                              "WHEN series_name = ? COLLATE NOCASE THEN 1 ELSE 0 END "
                              "WHERE item_id = ?",
                              (new_name, source["item_id"]),
                          )
                          db.execute(
                              "UPDATE items SET series_name = ?, series_position = ?, "
                              "updated_at = datetime('now') WHERE id = ?",
                              (new_name, position, source["item_id"]),
                          )

                  src_desc = (src_meta["description"] or "").strip() if src_meta else ""
                  dst_desc = (dst_meta["description"] or "").strip() if dst_meta else ""
                  if src_desc and not dst_desc:
                      _upsert_series_description(db, new_name, src_meta["description"],
                                                 src_meta["source"])

                  if src_meta and src_meta["complete"] is not None and (
                          not dst_meta or dst_meta["complete"] is None):
                      _upsert_series_complete(db, new_name, src_meta["complete"])

                  if src_meta and src_meta["hc_checked_at"] is not None and (
                          not dst_meta or dst_meta["hc_checked_at"] is None):
                      _upsert_series_check_row(db, new_name, src_meta["hc_total"],
                                               src_meta["hc_missing"], src_meta["hc_checked_at"])

                  gc_orphaned_series_meta(db, name)

                  return {"ok": True, "name": new_name, "merged": merged, "count": count}
'''
          text = text[:old_start] + replacement + text[old_end:]

          old_start = text.index('    with get_db() as db:\n        cur = db.execute(\n            "UPDATE items SET series_name = NULL WHERE series_name = ? COLLATE NOCASE",', text.index('async def remove_all_from_series'))
          old_end = text.index('        return {"ok": True, "count": count}\n', old_start) + len('        return {"ok": True, "count": count}\n')
          replacement = '''    with get_db() as db:
                  _sync_item_series_memberships(db)
                  rows = db.execute(
                      "SELECT item_id, is_primary FROM item_series "
                      "WHERE series_name = ? COLLATE NOCASE",
                      (name,),
                  ).fetchall()
                  count = len(rows)
                  if not count:
                      return {"ok": False, "message": "Series not found"}

                  primary_item_ids = [row["item_id"] for row in rows if row["is_primary"]]
                  db.execute(
                      "DELETE FROM item_series WHERE series_name = ? COLLATE NOCASE",
                      (name,),
                  )
                  for item_id in primary_item_ids:
                      _promote_primary_membership(db, item_id)

                  gc_orphaned_series_meta(db, name)
                  return {"ok": True, "count": count}
'''
          text = text[:old_start] + replacement + text[old_end:]
          p.write_text(text)

          # Connected-items terminology tests now assert the actual semantic
          # structure rather than the retired "Also in ..." prose.
          replacements = {
              'tests/test_abs_links.py': [
                  ('assert "Also in Audiobookshelf (Audiobook)" in html', 'assert "Available in" in html\n        assert "Audiobookshelf" in html'),
                  ('assert "Also in Audiobookshelf (Audiobook)" not in html', 'assert "Available in" not in html'),
              ],
              'tests/test_abs_public_url.py': [
                  ('assert "Also in Audiobookshelf (Audiobook)" in html', 'assert "Available in" in html\n    assert "Audiobookshelf" in html'),
              ],
              'tests/test_romm_public_url.py': [
                  ('assert "Also in RomM (Digital Game)" in response.text', 'assert "Available in" in response.text\n    assert "RomM" in response.text'),
              ],
              'tests/test_komga_public_url.py': [
                  ('assert "Also in Komga" in html', 'assert "Available in" in html\n        assert "Komga" in html'),
              ],
          }
          for path, pairs in replacements.items():
              p = Path(path)
              text = p.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'connected-items assertion not found in {path}: {old}')
                  text = text.replace(old, new, 1)
              p.write_text(text)

          p = Path('tests/test_related_media_ui.py')
          text = p.read_text()
          pairs = [
              ('assert "Platforms:" in response.text', 'assert \'data-testid="related-platforms"\' in response.text'),
              ('assert response.text.count("Also in RomM (Digital Game)") == 2', 'assert response.text.count("Available in") == 2\n    assert response.text.count("RomM") >= 2'),
              ('assert response.text.count("Also in Audiobookshelf (Audiobook)") == 2', 'assert response.text.count("Available in") == 2\n    assert response.text.count("Audiobookshelf") >= 2'),
              ('assert "Formats:" in response.text', 'assert \'data-testid="related-formats"\' in response.text'),
              ('assert "Add related media" in response.text', 'assert "Connect an item" in response.text'),
              ('assert "Add related media" not in detail.text', 'assert "Connect an item" not in detail.text'),
          ]
          for old, new in pairs:
              if old not in text:
                  raise SystemExit(f'related UI assertion not found: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)

          # Regression coverage for global Series operations with secondary memberships.
          p = Path('tests/test_item_series_memberships.py')
          text = p.read_text()
          addition = r'''


def test_global_series_page_includes_secondary_memberships(admin_client, db):
              book = _insert_item(
                  db, title="Half-Blood Prince", isbn="9780907001106",
                  media_type="book", series_name="Harry Potter", series_position=6,
              )
              sibling = _insert_item(
                  db, title="Fantastic Beasts", isbn="9780907001113",
                  media_type="book", series_name="Wizarding World", series_position=1,
              )
              db.execute(
                  "INSERT INTO item_series (item_id, series_name, position, is_primary) "
                  "VALUES (?, 'Wizarding World', 8, 0)",
                  (book,),
              )
              db.execute("COMMIT")

              html = admin_client.get("/series").text
              assert "Harry Potter" in html
              assert "Wizarding World" in html
              # The secondary member and the primary member both contribute to the
              # Wizarding World card rather than the old legacy field hiding one.
              assert "Half-Blood Prince" in html
              assert "Fantastic Beasts" in html


          def test_global_series_rename_updates_secondary_and_primary_memberships(admin_client, db):
              primary = _insert_item(
                  db, title="Primary", isbn="9780907001120", media_type="book",
                  series_name="Old Name", series_position=1,
              )
              secondary = _insert_item(
                  db, title="Secondary", isbn="9780907001137", media_type="book",
                  series_name="Other", series_position=1,
              )
              # Cause reconciliation first, then add a true secondary membership.
              admin_client.get("/series")
              db.execute(
                  "INSERT INTO item_series (item_id, series_name, position, is_primary) "
                  "VALUES (?, 'Old Name', 2, 0)",
                  (secondary,),
              )
              db.execute("COMMIT")

              response = admin_client.post(
                  "/api/series/Old%20Name/rename",
                  data={"new_name": "New Name"},
              )
              assert response.status_code == 200
              rows = db.execute(
                  "SELECT item_id, series_name, position, is_primary FROM item_series "
                  "WHERE series_name = 'New Name' COLLATE NOCASE ORDER BY item_id"
              ).fetchall()
              assert {row["item_id"] for row in rows} == {primary, secondary}
              assert not db.execute(
                  "SELECT 1 FROM item_series WHERE series_name = 'Old Name' COLLATE NOCASE"
              ).fetchone()
              legacy = db.execute(
                  "SELECT series_name, series_position FROM items WHERE id = ?", (primary,)
              ).fetchone()
              assert legacy["series_name"] == "New Name"
              assert legacy["series_position"] == 1


          def test_remove_all_promotes_remaining_secondary_membership(admin_client, db):
              item = _insert_item(
                  db, title="Multi Series", isbn="9780907001144", media_type="book",
                  series_name="Primary Series", series_position=3,
              )
              admin_client.get("/series")
              db.execute(
                  "INSERT INTO item_series (item_id, series_name, position, is_primary) "
                  "VALUES (?, 'Secondary Series', 7, 0)",
                  (item,),
              )
              db.execute("COMMIT")

              response = admin_client.post("/api/series/Primary%20Series/remove-all")
              assert response.status_code == 200
              remaining = db.execute(
                  "SELECT series_name, position, is_primary FROM item_series WHERE item_id = ?",
                  (item,),
              ).fetchone()
              assert remaining["series_name"] == "Secondary Series"
              assert remaining["position"] == 7
              assert remaining["is_primary"] == 1
              legacy = db.execute(
                  "SELECT series_name, series_position FROM items WHERE id = ?", (item,)
              ).fetchone()
              assert legacy["series_name"] == "Secondary Series"
              assert legacy["series_position"] == 7
          '''
          if 'test_global_series_page_includes_secondary_memberships' in text:
              raise SystemExit('global multi-series tests already present')
          p.write_text(text + addition)
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routers/series.py app/routers/series_memberships.py \
            tests/test_item_series_memberships.py tests/test_related_media_ui.py \
            tests/test_abs_links.py tests/test_abs_public_url.py \
            tests/test_romm_public_url.py tests/test_komga_public_url.py
          git diff --cached --quiet && exit 0
          git commit -m "Finish multi-series integration and connected-item tests"
          git push origin HEAD:feature/multi-series-item-rows
