name: Preserve upstream media types in Komga port

on:
  push:
    branches: [upstream/komga-integration]
    paths: [.github/workflows/fix-komga-config.yml]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upstream/komga-integration
      - name: Restore Digital Game while keeping Digital Comic
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/config.py')
          text = p.read_text()
          old = '    "video_game": "Video Game",\n}'
          new = '    "video_game": "Video Game",\n    "digital_game": "Digital Game",\n}'
          if old not in text:
              raise SystemExit('MEDIA_TYPES anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/fix-komga-config.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Preserve upstream Digital Game media type'
          git push origin HEAD:upstream/komga-integration
