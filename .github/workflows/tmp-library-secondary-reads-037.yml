name: Temporary library secondary reads 0.37 validation

on:
  push:
    branches:
      - tmp/library-secondary-reads-037-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/library-secondary-reads-037
          fetch-depth: 0

      - name: Load validation payload
        run: |
          git fetch origin tmp/library-secondary-reads-037-build
          git show origin/tmp/library-secondary-reads-037-build:tmp/apply_library_secondary_reads_037.py > /tmp/apply_library_secondary_reads_037.py
          git show origin/tmp/library-secondary-reads-037-build:tests/test_library_secondary_reads_037.py > tests/test_library_secondary_reads_037.py
          python /tmp/apply_library_secondary_reads_037.py
          git diff --check

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Focused secondary-read ACL regressions
        run: |
          python -m pytest \
            tests/test_library_secondary_reads_037.py \
            tests/test_series.py \
            tests/test_music_foundation.py \
            tests/test_music_full_integration.py \
            -q --tb=short

      - name: Full unit regression and checks
        run: |
          make badges
          make test
          make checks-fast

      - name: Publish validated secondary-read ACL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/routers/series.py \
            app/templates/series.html \
            app/routers/music.py \
            tests/test_series.py \
            tests/test_library_secondary_reads_037.py \
            README.md
          git diff --check --cached
          git commit -m "LIBRARIES: scope Series and Music secondary reads" || true
          git push origin HEAD:rebuild/library-secondary-reads-037
