name: Update media groups from main

on:
  push:
    branches: [feature/media-groups]
    paths:
      - '.github/workflows/update-media-groups-base.yml'

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/media-groups
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Merge current main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "README.md" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --theirs README.md
            git add README.md
          fi
          make badges
          rm .github/workflows/update-media-groups-base.yml
          git add -A
          git commit -m 'Merge current main into related media work'
          git push origin HEAD:feature/media-groups
