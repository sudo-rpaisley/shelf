name: Validate account menu final gate

on:
  push:
    branches:
      - tmp/account-menu-final-gate

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: pytest -q tests/test_account_menu_037.py tests/test_oidc_account_management_037.py tests/e2e/test_setup_login.py::test_logout tests/e2e/test_account_menu_037.py
      - run: make check-alpine

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: make test-e2e
