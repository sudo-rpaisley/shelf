name: Temporary run general series patch
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python scripts/tmp_patch_general_series.py
      - run: |
          git config user.name "Robert J Paisley"
          git config user.email "56076332+sudo-rpaisley@users.noreply.github.com"
          git add app static tests
          git diff --cached --quiet || git commit -m "TEMP: apply general series patches"
          git push
