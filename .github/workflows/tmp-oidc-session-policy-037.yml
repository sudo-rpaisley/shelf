name: Temporary OIDC session policy 0.37 validation

on:
  push:
    branches:
      - tmp/oidc-session-policy-037-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/oidc-account-037
          fetch-depth: 0

      - name: Load OIDC session and recovery payload
        run: |
          git fetch origin tmp/oidc-session-policy-037-payload
          git show origin/tmp/oidc-session-policy-037-payload:app/oidc_policy.py > app/oidc_policy.py
          git show origin/tmp/oidc-session-policy-037-payload:tests/test_oidc_session_policy_037.py > tests/test_oidc_session_policy_037.py
          git show origin/tmp/oidc-session-policy-037-payload:tmp/apply_oidc_session_auth_037.py > /tmp/apply_oidc_session_auth_037.py
          python /tmp/apply_oidc_session_auth_037.py
          git diff --check

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Focused OIDC session regressions
        run: |
          python -m pytest \
            tests/test_oidc_session_policy_037.py \
            tests/test_oidc_accounts_037.py \
            tests/test_oidc_core.py \
            tests/test_oidc_auth_flow.py \
            tests/test_oidc_tokens.py \
            tests/test_auth.py \
            tests/test_auth_boundaries.py \
            tests/test_auth_routes.py \
            tests/test_library_permissions_037.py \
            tests/test_schema_ownership.py \
            tests/test_module_sizes.py \
            -q --tb=short

      - name: Full regression and architecture checks
        run: |
          make badges
          make test
          make checks-fast

      - name: Publish validated OIDC session policy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/auth.py \
            app/oidc_policy.py \
            tests/test_oidc_session_policy_037.py \
            README.md
          git diff --check --cached
          git commit -m "OIDC: add fixed sessions and recovery-only local login" || true
          git push origin HEAD:rebuild/oidc-session-policy-037
