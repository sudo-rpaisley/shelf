name: Temporary rebase series overlap

on:
  push:
    branches:
      - work/general-series-046-rebase-helper
    paths:
      - .github/workflows/_temporary_rebase_series_overlap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/general-series-046-rebase-helper
      - name: Patch exact 0.46 overlapping files
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          # app/routers/items.py — preserve every 0.46 Trash/live-read change,
          # replacing only the Browse search implementation and adding its service import.
          path = Path("app/routers/items.py")
          text = path.read_text()
          old_import = "from app.services import browse_counts\nfrom app.services import lists\n"
          if text.count(old_import) != 1:
              raise SystemExit("unexpected items.py import marker")
          text = text.replace(
              old_import,
              "from app.services import browse_counts\nfrom app.services import lists\nfrom app.services import series_browse\n",
              1,
          )
          start_marker = '@router.get("/search")\nasync def search_items('
          end_marker = '\n\n@router.post("/items/bulk-update")'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("expected /api/search route markers not found")
          replacement = textwrap.dedent('''\
          @router.get("/search")
          async def search_items(
              request: Request,
              page: int = 1,
              per_page: int = DEFAULT_PAGE_SIZE,
              _=Depends(require_role("viewer")),
          ):
              """Search/filter Browse units and return the HTMX result fragment.

              Filter semantics and dropdown counts remain item-based, exactly as
              `/browse`'s first paint.  Presentation is series-aware: matching
              items are collapsed into provider-neutral series units before
              pagination, using the same service as `/browse`, so first paint and
              live filtering cannot diverge.
              """
              templates = request.app.state.templates

              values = browse_filters.values_from(request.query_params)
              values["q"] = values["q"][:200]
              sort = values["sort"]
              view = values["view"]
              where, params = browse_filters.build_where(values)

              page = max(page, 1)
              page_size = max(1, min(per_page, 200))
              offset = (page - 1) * page_size

              with get_db() as db:
                  from app.routers.checkouts import get_overdue_days
                  items, browse_total = series_browse.fetch_units(
                      db,
                      where=where,
                      params=params,
                      sort=sort,
                      limit=page_size,
                      offset=offset,
                      overdue_days=get_overdue_days(db),
                  )

                  # Dropdown counts remain raw-item counts.  They answer how many
                  # items a filter would match; browse_total answers how many
                  # collapsed units are actually displayed and paginated.
                  total_filtered = db.execute(
                      f"SELECT COUNT(*) as c FROM items_live i {where}", params
                  ).fetchone()["c"]
                  counts = (
                      browse_counts.filter_counts(db, values, total_filtered)
                      if page <= 1 else None
                  )

              has_more = (offset + page_size) < browse_total
              load_more_url = "/api/search?" + browse_filters.querystring(
                  values, extra=[f"page={page + 1}"]
              )

              if page <= 1:
                  template = "fragments/item_grid.html"
              elif view == "list":
                  template = "fragments/item_rows_page.html"
              else:
                  template = "fragments/item_cards_page.html"

              from datetime import datetime, timedelta
              ctx = {
                  "items": items,
                  "media_types": MEDIA_TYPES,
                  "has_more": has_more,
                  "load_more_url": load_more_url,
                  "page": page,
                  "browse_total": browse_total,
                  "total": browse_total,
                  "has_filters": browse_filters.has_active_filters(values),
                  "seven_days_ago": (datetime.now(tz=None) - timedelta(days=7)).strftime("%Y-%m-%d"),
              }
              if counts:
                  ctx.update(counts)
                  ctx["render_oob_counts"] = True

              return templates.TemplateResponse(request, template, ctx)
          ''')
          text = text[:start] + replacement.rstrip() + text[end:]
          path.write_text(text)

          # static/js/browse.js — preserve 0.46 Trash wording and add only
          # grouped-series selection semantics.
          path = Path("static/js/browse.js")
          text = path.read_text()
          toggle_marker = """        toggleItem(id) {\n            var idx = this.selectedIds.indexOf(id);\n            if (idx >= 0) this.selectedIds.splice(idx, 1);\n            else this.selectedIds.push(id);\n        },\n\n"""
          if text.count(toggle_marker) != 1:
              raise SystemExit("unexpected browse.js toggle marker")
          grouped = """        // A grouped series still acts on ordinary item ids. Expanding its\n        // member set here keeps every existing bulk endpoint unchanged.\n        memberIds(value) {\n            return String(value || '').split(',')\n                .map(function(id) { return Number.parseInt(id, 10); })\n                .filter(function(id) { return Number.isInteger(id) && id > 0; });\n        },\n\n        seriesSelected(value) {\n            var ids = this.memberIds(value);\n            var self = this;\n            return ids.length > 0 && ids.every(function(id) {\n                return self.selectedIds.indexOf(id) >= 0;\n            });\n        },\n\n        toggleMembers(value) {\n            var ids = this.memberIds(value);\n            var allSelected = this.seriesSelected(value);\n            var self = this;\n            ids.forEach(function(id) {\n                var idx = self.selectedIds.indexOf(id);\n                if (allSelected) {\n                    if (idx >= 0) self.selectedIds.splice(idx, 1);\n                } else if (idx < 0) {\n                    self.selectedIds.push(id);\n                }\n            });\n        },\n\n        openSeriesOrToggle(value, url, event) {\n            if (this.selectMode) { this.toggleMembers(value); return; }\n            if (event && (event.ctrlKey || event.metaKey)) window.open(url, '_blank');\n            else window.location = url;\n        },\n\n"""
          text = text.replace(toggle_marker, grouped + toggle_marker, 1)
          old_select = """        selectAll() {\n            var self = this;\n            document.querySelectorAll('[data-item-id]').forEach(function(el) {\n                var id = parseInt(el.dataset.itemId);\n                if (self.selectedIds.indexOf(id) < 0) self.selectedIds.push(id);\n            });\n        },\n"""
          new_select = """        selectAll() {\n            var self = this;\n            document.querySelectorAll('[data-item-id]').forEach(function(el) {\n                var id = Number.parseInt(el.dataset.itemId, 10);\n                if (Number.isInteger(id) && id > 0 && self.selectedIds.indexOf(id) < 0) {\n                    self.selectedIds.push(id);\n                }\n            });\n            document.querySelectorAll('[data-series-member-ids]').forEach(function(el) {\n                self.memberIds(el.dataset.seriesMemberIds).forEach(function(id) {\n                    if (self.selectedIds.indexOf(id) < 0) self.selectedIds.push(id);\n                });\n            });\n        },\n"""
          if text.count(old_select) != 1:
              raise SystemExit("unexpected browse.js selectAll marker")
          text = text.replace(old_select, new_select, 1)
          path.write_text(text)
      - name: Commit guarded overlap patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routers/items.py static/js/browse.js
          git diff --cached --check
          git commit -m "Reapply series Browse overlap on exact 0.46"
          git push origin HEAD:work/general-series-046-rebase-helper
