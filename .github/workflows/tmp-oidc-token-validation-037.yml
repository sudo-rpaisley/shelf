name: Temporary OIDC token validation 0.37

on:
  push:
    branches:
      - tmp/oidc-token-validation-037-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upstream/oidc-token-validation-037
          fetch-depth: 0

      - name: Replay token-validation layer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick ac98bd0d2226305171c724d1b7ffa99ff6e8e7b0
          git diff --check HEAD^

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Focused OIDC token tests
        run: python -m pytest tests/test_oidc_core.py tests/test_oidc_flow.py tests/test_oidc_tokens.py -q --tb=short

      - name: Full regression and checks
        run: |
          make badges
          make test
          make checks-fast

      - name: Publish clean layer
        run: |
          git add README.md
          git diff --check --cached
          git commit --amend -m "OIDC: validate token exchange and ID tokens on Shelf 0.37.2"
          git push --force-with-lease origin HEAD:upstream/oidc-token-validation-037
