name: Collections assignment 0.37 v3

on:
  push:
    branches:
      - tmp/collections-assignment-037-v3-gate

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q tests/test_collections_037.py tests/test_collections_assignment_037.py tests/test_browse_filters.py tests/test_item_merge.py tests/test_nav.py tests/test_navigation_polish_037.py
      - run: make check-alpine

  unit-and-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: make test
      - run: make checks-fast

  generated-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: npm ci
      - run: make css
      - run: make badges
      - run: git diff --exit-code --stat README.md static/css/app.css static/sw.js

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: make test-e2e
