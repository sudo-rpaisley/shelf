name: Clean Komga upstream integration

on:
  push:
    branches: [upstream/komga-integration]
    paths: [.github/workflows/clean-komga-upstream.yml]

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upstream/komga-integration
          fetch-depth: 0
      - name: Remove unrelated ABS changes and adapt to current upstream
        shell: bash
        run: |
          set -euo pipefail
          base=556386f8952be82741f01ebad3488466fae4f4b7
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp static/js/components-settings.js /tmp/branch-components-settings.js

          # Keep existing Audiobookshelf behaviour untouched in this Komga PR.
          git checkout "$base" -- \
            app/routers/sync.py \
            tests/e2e/test_settings_abs_sync_guard.py \
            app/templates/fragments/settings/integrations.html \
            static/js/components-settings.js

          python - <<'PY'
          from pathlib import Path

          # Current upstream's central book family was introduced after the
          # original Komga work. Digital Comic belongs in that family too.
          p = Path('app/config.py')
          text = p.read_text()
          old = 'BOOK_MEDIA_TYPES = frozenset({"book", "kids_book", "audiobook", "ebook", "comic"})'
          new = 'BOOK_MEDIA_TYPES = frozenset({"book", "kids_book", "audiobook", "ebook", "comic", "digital_comic"})'
          if old not in text:
              raise SystemExit('BOOK_MEDIA_TYPES anchor not found')
          p.write_text(text.replace(old, new, 1))

          # The focused series route decorates the existing series router, so
          # import it when the router package initializes.
          Path('app/routers/__init__.py').write_text('''"""Router package initialisation.\n\nImport the focused series-detail extension so it attaches its read-only route\nto the existing series router before app.main mounts that router.\n"""\n\nfrom app.routers import series as series  # noqa: F401,E402\nfrom app.routers import series_detail as series_detail  # noqa: F401,E402\n''')

          # Restore upstream's Audiobookshelf card verbatim, then place Komga as
          # a separate integration immediately before Hardcover.
          p = Path('app/templates/fragments/settings/integrations.html')
          text = p.read_text()
          marker = '    <!-- Hardcover -->'
          if marker not in text:
              raise SystemExit('Hardcover integration anchor not found')
          text = text.replace(marker, '    {% include "fragments/settings/komga.html" %}\n\n' + marker, 1)
          p.write_text(text)

          # Restore upstream's Settings JS, then add only the generic background
          # job helpers and the two Komga Alpine components. ABS stays on SSE.
          branch = Path('/tmp/branch-components-settings.js').read_text()
          helper_start = branch.index('// Long integration syncs belong')
          helper_end = branch.index("document.addEventListener('alpine:init'", helper_start)
          helpers = branch[helper_start:helper_end]
          komga_start = branch.index('    // settings.html — Komga sync card')
          komga_end = branch.index('    // settings.html — Hardcover card', komga_start)
          komga = branch[komga_start:komga_end]

          p = Path('static/js/components-settings.js')
          text = p.read_text()
          alpine_marker = "document.addEventListener('alpine:init'"
          if alpine_marker not in text:
              raise SystemExit('Alpine init anchor not found')
          text = text.replace(alpine_marker, helpers + alpine_marker, 1)
          hc_marker = '    // settings.html — Hardcover card'
          if hc_marker not in text:
              raise SystemExit('Hardcover JS anchor not found')
          text = text.replace(hc_marker, komga + hc_marker, 1)
          p.write_text(text)
          PY

          git rm -f .github/workflows/clean-komga-upstream.yml
          git add -A
          git diff --cached --check
          git commit -m "Adapt Komga integration to current upstream"
          git push origin HEAD:upstream/komga-integration
