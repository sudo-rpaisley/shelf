name: Build Home and Stats library scope

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/library-home-stats-039-prep
          fetch-depth: 0
      - name: Preserve builder and reset to published Browse scope
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/tmp_build_library_home_stats_039.py /tmp/build_home_stats.py
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git reset --hard origin/upstream/library-browse-scope-039
          echo "PARENT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git config user.name "Robert J Paisley"
          git config user.email "56076332+sudo-rpaisley@users.noreply.github.com"
      - name: Build Home and Stats scope
        run: |
          python /tmp/build_home_stats.py
          git diff --check
          python -m compileall -q app
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Regenerate test badge
        run: make badges
      - name: Focused aggregate-read checks
        run: |
          pytest -q \
            tests/test_library_permissions.py \
            tests/test_library_browse_access.py \
            tests/test_library_home_stats_039.py \
            tests/test_home_dashboard.py \
            tests/test_stats.py
          make check-alpine
      - name: Full unit and static checks
        run: |
          make test
          make checks-fast
      - name: Full Chromium E2E
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          playwright install --with-deps chromium
          make test-e2e
      - name: Publish one-commit dependent PR branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git reset --soft "$PARENT_SHA"
          git commit -m "LIBRARIES: scope Home and Stats aggregates"
          git fetch origin refs/heads/upstream/library-home-stats-039:refs/remotes/origin/upstream/library-home-stats-039 || true
          if git show-ref --verify --quiet refs/remotes/origin/upstream/library-home-stats-039; then
            expected=$(git rev-parse refs/remotes/origin/upstream/library-home-stats-039)
            git push origin HEAD:upstream/library-home-stats-039 \
              --force-with-lease=refs/heads/upstream/library-home-stats-039:$expected
          else
            git push origin HEAD:upstream/library-home-stats-039
          fi
