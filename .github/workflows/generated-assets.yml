name: Generate UI assets once

on:
  push:
    branches:
      - feature/multi-series-item-rows
    paths:
      - .github/workflows/generated-assets.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/multi-series-item-rows
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: make css
      - name: Commit generated assets
        run: |
          if git diff --quiet -- static/css/app.css static/sw.js; then
            echo "Generated assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/css/app.css static/sw.js
          git commit -m "Build generated UI assets"
          git push origin HEAD:feature/multi-series-item-rows
