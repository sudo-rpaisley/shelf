name: Temporary direct library item access 0.37

on:
  push:
    branches:
      - tmp/library-item-access-037-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/library-item-access-037
          fetch-depth: 0

      - name: Fetch and apply direct-access port
        run: |
          git show origin/tmp/library-item-access-037-build:.github/tmp_patch_library_item_access_037.py > /tmp/patch.py
          python /tmp/patch.py
          python -m py_compile \
            app/routers/pages.py \
            app/routers/personal_state.py \
            app/routers/related_media.py \
            app/services/media_groups.py \
            tests/test_library_item_access_037.py
          git diff --check

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Focused direct-access regressions
        run: |
          python -m pytest \
            tests/test_library_item_access_037.py \
            tests/test_library_browse_access_037.py \
            tests/test_personal_state_routes_037.py \
            tests/test_related_media_ui.py \
            tests/test_media_groups.py \
            tests/test_schema_ownership.py \
            tests/test_router_registration.py \
            -q --tb=short

      - name: Full regression and checks
        run: |
          make badges
          make test
          make checks-fast

      - name: Publish validated direct-access slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            app/routers/pages.py \
            app/routers/personal_state.py \
            app/routers/related_media.py \
            app/services/media_groups.py \
            tests/test_personal_state_routes_037.py \
            tests/test_library_item_access_037.py
          git diff --check --cached
          git commit -m "LIBRARIES: scope direct item reads"
          git push origin HEAD:rebuild/library-item-access-037
