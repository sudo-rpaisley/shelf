name: Temporary revert unrelated bulk copy

on:
  push:
    branches:
      - work/general-series-experience-046
    paths:
      - .github/workflows/_temporary_revert_bulk_copy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/general-series-experience-046
      - name: Restore upstream bulk-delete wording
        shell: python
        run: |
          from pathlib import Path
          path = Path("static/js/browse.js")
          text = path.read_text()
          pairs = [
              ("if (!confirm('Move ' + this.selectedIds.length + ' items to Trash?')) return;",
               "if (!confirm('Delete ' + this.selectedIds.length + ' items?')) return;"),
              ("showToast('Moved ' + this.selectedIds.length + ' items to Trash', 'success');",
               "showToast('Deleted ' + this.selectedIds.length + ' items', 'success');"),
          ]
          for old, new in pairs:
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one copy marker: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Commit guarded patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/js/browse.js
          git diff --cached --check
          git commit -m "Keep existing bulk-delete copy unchanged"
          git push origin HEAD:work/general-series-experience-046
