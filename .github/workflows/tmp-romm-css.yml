name: Temporary RomM CSS build

on:
  push:
    branches:
      - tmp/romm-css-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: make css
      - uses: actions/upload-artifact@v4
        with:
          name: romm-generated-assets
          path: |
            static/css/app.css
            static/sw.js
