name: Build Komga integration

on:
  push:
    branches: [feature/komga-sync]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/komga-sync
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply Komga integration wiring
        run: python scripts/komga_patch.py
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          npm ci
      - name: Refresh generated files
        run: |
          make badges
          make css
      - name: Remove temporary build files and commit
        run: |
          git rm .github/workflows/komga-build.yml scripts/komga_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire Komga sync integration"
          git push origin HEAD:feature/komga-sync
