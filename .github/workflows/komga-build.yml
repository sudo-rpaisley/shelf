name: Build Komga integration

on:
  push:
    branches: [feature/komga-sync]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/komga-sync
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply Komga integration wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Database migrations. New installs run the same append-only migrations,
          # so these columns deliberately are not duplicated in the base SCHEMA.
          patch(
              "app/database.py",
              '        WHERE language IS NULL AND isbn IS NOT NULL"""),\n)\n\nMIGRATION_TABLES',
              '        WHERE language IS NULL AND isbn IS NOT NULL"""),\n'
              '    (24, "Add komga_id column", "ALTER TABLE items ADD COLUMN komga_id TEXT DEFAULT NULL"),\n'
              '    (25, "Add komga_library_id column", "ALTER TABLE items ADD COLUMN komga_library_id TEXT DEFAULT NULL"),\n'
              '    (26, "Add komga_series_id column", "ALTER TABLE items ADD COLUMN komga_series_id TEXT DEFAULT NULL"),\n'
              '    (27, "Index Komga item IDs", "CREATE INDEX IF NOT EXISTS idx_items_komga_id ON items(komga_id)"),\n'
              ')\n\nMIGRATION_TABLES',
          )

          patch(
              "app/config.py",
              '    "abs_url": "ABS_URL",\n    "abs_token": "ABS_TOKEN",\n',
              '    "abs_url": "ABS_URL",\n    "abs_token": "ABS_TOKEN",\n'
              '    "komga_url": "KOMGA_URL",\n    "komga_api_key": "KOMGA_API_KEY",\n',
          )

          patch(
              "app/crypto.py",
              '        "abs_token",\n',
              '        "abs_token",\n        "komga_api_key",\n',
          )

          patch(
              "app/routers/settings.py",
              '    "abs_url",\n    "abs_token",\n',
              '    "abs_url",\n    "abs_token",\n    "komga_url",\n    "komga_api_key",\n',
          )
          patch(
              "app/routers/settings.py",
              '            if key == "abs_url":\n                value = value.rstrip("/")\n',
              '            if key in ("abs_url", "komga_url"):\n                value = value.rstrip("/")\n',
          )

          # Settings context: Komga URL can be supplied by environment just like ABS.
          patch(
              "app/routers/pages.py",
              '    abs_url_present = bool(settings.get("abs_url")) or "abs_url" in env_overrides\n',
              '    abs_url_present = bool(settings.get("abs_url")) or "abs_url" in env_overrides\n'
              '    komga_url_present = bool(settings.get("komga_url")) or "komga_url" in env_overrides\n',
          )
          patch(
              "app/routers/pages.py",
              '         "secrets_present": secrets_present, "abs_url_present": abs_url_present,\n',
              '         "secrets_present": secrets_present, "abs_url_present": abs_url_present,\n'
              '         "komga_url_present": komga_url_present,\n',
          )

          # Item detail: expose direct and linked Komga browser URLs.
          patch(
              "app/routers/pages.py",
              '            "SELECT i.id, i.title, i.media_type, i.abs_id FROM item_links il "\n',
              '            "SELECT i.id, i.title, i.media_type, i.abs_id, i.komga_id FROM item_links il "\n',
          )
          patch(
              "app/routers/pages.py",
              '            ]\n\n        # Hardcover token check\n',
              '            ]\n\n'
              '        # Komga browser URLs use the public root when configured,\n'
              '        # while all server-side API traffic continues to use komga_url.\n'
              '        komga_url = None\n'
              '        linked_komga_items = []\n'
              '        komga_url_val = get_setting(db, "komga_url")\n'
              '        if komga_url_val:\n'
              '            from app.services.komga import get_browser_url\n'
              '            if item["komga_id"]:\n'
              '                komga_url = get_browser_url(komga_url_val, item["komga_id"])\n'
              '            linked_komga_items = [\n'
              '                {"id": li["id"], "media_type": li["media_type"],\n'
              '                 "komga_url": get_browser_url(komga_url_val, li["komga_id"])}\n'
              '                for li in linked_items if li["komga_id"]\n'
              '            ]\n\n'
              '        # Hardcover token check\n',
          )
          patch(
              "app/routers/pages.py",
              '            "linked_abs_items": linked_abs_items,\n            "abs_url": abs_url,\n',
              '            "linked_abs_items": linked_abs_items,\n            "abs_url": abs_url,\n'
              '            "linked_komga_items": linked_komga_items,\n            "komga_url": komga_url,\n',
          )

          # Register Komga router and scheduled sync task.
          patch(
              "app/main.py",
              'from app.routers import pages, items, items_covers, items_csv, items_catalog, locations, platforms, settings, sync, checkouts, valuation, hardcover, store, series, share, tags, intake, archive\n',
              'from app.routers import pages, items, items_covers, items_csv, items_catalog, locations, platforms, settings, sync, komga, checkouts, valuation, hardcover, store, series, share, tags, intake, archive\n',
          )
          patch(
              "app/main.py",
              '\n\nasync def _periodic_hardcover_sync():\n',
              '''\n\nasync def _periodic_komga_sync():
              """Background task: run Komga sync on schedule if configured."""
              from app.services import komga as komga_service
              from app.database import get_setting

              intervals = {"daily": 86400, "weekly": 604800}

              while True:
                  await asyncio.sleep(300)
                  try:
                      with get_db() as db:
                          row = db.execute(
                              "SELECT value FROM settings WHERE key = 'komga_sync_interval'"
                          ).fetchone()
                          interval = row["value"] if row else "off"
                          if interval == "off":
                              continue

                          last = db.execute(
                              "SELECT value FROM settings WHERE key = 'komga_last_sync'"
                          ).fetchone()
                          now = time.time()
                          if last and last["value"]:
                              elapsed = now - float(last["value"])
                              if elapsed < intervals.get(interval, 86400):
                                  continue

                          komga_url_val = get_setting(db, "komga_url")
                          komga_api_key = get_setting(db, "komga_api_key")

                      if komga_url_val and komga_api_key:
                          result = await komga_service.sync(komga_url_val, komga_api_key)
                          if result.get("error"):
                              logger.warning("Periodic Komga sync failed: %s", result["error"])
                              continue
                          with get_db() as db:
                              db.execute(
                                  "INSERT INTO settings (key, value) VALUES ('komga_last_sync', ?) "
                                  "ON CONFLICT(key) DO UPDATE SET value = ?",
                                  (str(now), str(now)),
                              )
                          logger.info("Periodic Komga sync completed")
                  except Exception:
                      logger.exception("Periodic Komga sync failed")


async def _periodic_hardcover_sync():
''',
          )
          patch(
              "app/main.py",
              '    task = asyncio.create_task(_periodic_abs_sync())\n    hc_task = asyncio.create_task(_periodic_hardcover_sync())\n',
              '    task = asyncio.create_task(_periodic_abs_sync())\n'
              '    komga_task = asyncio.create_task(_periodic_komga_sync())\n'
              '    hc_task = asyncio.create_task(_periodic_hardcover_sync())\n',
          )
          patch(
              "app/main.py",
              '    task.cancel()\n    hc_task.cancel()\n',
              '    task.cancel()\n    komga_task.cancel()\n    hc_task.cancel()\n',
          )
          patch(
              "app/main.py",
              'app.include_router(sync.router)\n',
              'app.include_router(sync.router)\napp.include_router(komga.router)\n',
          )

          patch(
              "app/templates/settings.html",
              '    {% include "fragments/settings/abs_public_url.html" %}\n',
              '    {% include "fragments/settings/abs_public_url.html" %}\n\n'
              '    {% include "fragments/settings/komga_public_url.html" %}\n',
          )
          patch(
              "app/templates/fragments/settings/integrations.html",
              '    <!-- Hardcover -->\n',
              '    {% include "fragments/settings/komga.html" %}\n\n    <!-- Hardcover -->\n',
          )

          # Item-detail buttons.
          patch(
              "app/templates/item_detail.html",
              '                <!-- Hardcover Sync -->\n',
              '''                <!-- Komga -->
                {% if komga_url %}
                <div class="mb-4">
                    <a href="{{ komga_url }}" target="_blank" rel="noopener"
                       class="inline-flex items-center gap-1 px-3 py-1.5 bg-shelf-accent/20 text-shelf-accent2 rounded-lg text-sm hover:bg-shelf-accent/30 transition-colors">
                        &#128214; Open in Komga
                    </a>
                </div>
                {% endif %}

                <!-- Hardcover Sync -->
''',
          )
          patch(
              "app/templates/item_detail.html",
              '                <!-- Linked Items (other formats) -->\n',
              '''                <!-- Also in Komga (linked copy) -->
                {% if not komga_url and linked_komga_items %}
                <div class="mb-4">
                    {% for lk in linked_komga_items %}
                    <a href="{{ lk.komga_url }}" target="_blank" rel="noopener"
                       class="inline-flex items-center gap-1 px-3 py-1.5 bg-shelf-accent/20 text-shelf-accent2 rounded-lg text-sm hover:bg-shelf-accent/30 transition-colors mr-2">
                        &#128214; Also in Komga ({{ media_types.get(lk.media_type, lk.media_type) }})
                    </a>
                    {% endfor %}
                </div>
                {% endif %}

                <!-- Linked Items (other formats) -->
''',
          )

          # CSP-safe Alpine components for Komga Settings UI.
          patch(
              "static/js/components-settings.js",
              '    // settings.html — Hardcover card (test / import / export)\n',
              '''    // settings.html — Komga sync card
    Alpine.data('komgaSync', function () {
        return {
            syncing: false, result: false, status: false, testing: false, showHelp: false,
            komgaUrl: '', komgaApiKey: '', komgaSaved: false, komgaUrlPresent: false,
            syncCurrent: 0, syncTotal: 0, syncLastTitle: '', syncLog: [], showSyncLog: false,
            init() {
                this.komgaUrl = this.$el.dataset.komgaUrl || '';
                this.komgaUrlPresent = this.$el.dataset.komgaUrlPresent === '1';
                this.komgaSaved = this.$el.dataset.komgaSaved === '1';
            },
            get testReady() { return Boolean((this.komgaUrl || this.komgaUrlPresent) && (this.komgaApiKey || this.komgaSaved)); },
            get syncReady() { return Boolean(this.komgaUrlPresent && this.komgaSaved); },
            get syncLabel() {
                if (this.syncReady) return 'Sync Now';
                if (this.komgaUrl || this.komgaApiKey) return 'Save your settings to sync';
                return 'Enter URL and API key to sync';
            },
            get syncPct() { return (this.syncTotal ? Math.round(this.syncCurrent / this.syncTotal * 100) : 0) + '%'; },
            get syncProgress() { return this.syncCurrent + ' / ' + this.syncTotal; },
            get syncWidth() { return 'width:' + (this.syncTotal ? (this.syncCurrent / this.syncTotal * 100) : 0) + '%'; },
            get syncLogLabel() { return this.showSyncLog ? 'Hide details' : 'Show details (' + this.syncLog.length + ' items)'; },
            statusClass(status) {
                if (status === 'added') return 'text-shelf-success';
                if (status === 'updated') return 'text-shelf-accent2';
                return 'text-shelf-muted';
            },
            testKomga() {
                if (!this.testReady) return;
                this.testing = true; this.status = false;
                fetch('/api/sync/komga/test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': window.csrfToken() },
                    body: JSON.stringify({ url: this.komgaUrl, api_key: this.komgaApiKey })
                }).then(r => r.json())
                  .then(d => { this.status = d; this.testing = false; })
                  .catch(() => { this.status = { ok: false, message: 'Connection failed' }; this.testing = false; });
            },
            startSync() {
                if (!this.syncReady) return;
                this.syncing = true; this.result = false; this.syncCurrent = 0; this.syncTotal = 0;
                this.syncLastTitle = ''; this.syncLog = []; this.showSyncLog = false;
                var self = this;
                var es = new EventSource('/api/sync/komga/stream');
                es.onmessage = function (e) {
                    var d = JSON.parse(e.data);
                    if (d.type === 'progress') {
                        self.syncCurrent = d.current; self.syncTotal = d.total; self.syncLastTitle = d.title;
                        self.syncLog.push({i: d.current, t: d.title, s: d.status, statusClass: self.statusClass(d.status)});
                    } else if (d.type === 'done') {
                        self.result = d; self.syncing = false; es.close();
                    } else if (d.type === 'error') {
                        self.result = {error: d.message}; self.syncing = false; es.close();
                    }
                };
                es.onerror = function () { self.result = {error: 'Connection lost'}; self.syncing = false; es.close(); };
            }
        };
    });

    // settings.html — Komga library selection
    Alpine.data('komgaLibraries', function () {
        return {
            libs: false, libsLoading: false, libsError: false, libsSaving: false,
            cleaning: false, cleanResult: false,
            excludedIds() { return this.libs.filter(l => !l.included).map(l => l.id); },
            get hasExcluded() { return Boolean(this.libs && this.excludedIds().length); },
            get cleanResultLabel() {
                if (!this.cleanResult) return '';
                return 'Removed ' + this.cleanResult.deleted + ' synced items; detached ' + this.cleanResult.detached + ' existing Shelf items.';
            },
            toggleLib(id) {
                var lib = this.libs.find(l => l.id === id);
                if (lib) lib.included = !lib.included;
            },
            loadLibs() {
                this.libsLoading = true; this.libsError = false;
                fetch('/api/sync/komga/libraries')
                    .then(r => r.json())
                    .then(d => { if (d.ok) this.libs = d.libraries; else this.libsError = d.message; this.libsLoading = false; })
                    .catch(() => { this.libsError = 'Failed to load libraries'; this.libsLoading = false; });
            },
            saveLibs() {
                this.libsSaving = true;
                fetch('/api/sync/komga/libraries', {
                    method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRF-Token': window.csrfToken()},
                    body: JSON.stringify({excluded: this.excludedIds()})
                }).then(r => r.json())
                  .then(d => { this.libsSaving = false; if (d.ok) showToast('Library selection saved'); else showToast(d.message || 'Save failed', 'error'); })
                  .catch(() => { this.libsSaving = false; showToast('Save failed', 'error'); });
            },
            cleanup() {
                if (!confirm('Remove Komga-synced Shelf items from unchecked libraries? Komga itself is not touched. Existing Shelf comics adopted by ISBN are kept and only detached from Komga.')) return;
                this.cleaning = true; this.cleanResult = false;
                fetch('/api/sync/komga/libraries', {
                    method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRF-Token': window.csrfToken()},
                    body: JSON.stringify({excluded: this.excludedIds()})
                }).then(() => fetch('/api/sync/komga/libraries/cleanup', {method: 'POST', headers: {'X-CSRF-Token': window.csrfToken()}}))
                  .then(r => r.json())
                  .then(d => { this.cleaning = false; this.cleanResult = d; if (d.ok) showToast('Komga cleanup complete'); })
                  .catch(() => { this.cleaning = false; showToast('Cleanup failed', 'error'); });
            }
        };
    });

    // settings.html — Hardcover card (test / import / export)
''',
          )
          PY
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          npm ci
      - name: Refresh generated files
        run: |
          make badges
          make css
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/komga-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire Komga sync integration"
          git push origin HEAD:feature/komga-sync
