name: Temporary Library Browse scope 0.37

on:
  push:
    branches:
      - tmp/library-access-scope-037-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/library-access-scope-037
          fetch-depth: 0

      - name: Make legacy test fixtures model Main Library access
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/conftest.py')
          text = path.read_text()

          old_user = '''def _create_user(username, password, display_name, role):
    """Create a user using its own committed connection."""
    from app.auth import hash_password
    from app.database import get_db
    with get_db() as conn:
        conn.execute(
            "INSERT INTO users (username, password, display_name, role) VALUES (?, ?, ?, ?)",
            (username, hash_password(password), display_name, role),
        )
        row = conn.execute(
            "SELECT id, username, role, display_name FROM users WHERE username = ?",
            (username,),
        ).fetchone()
        return dict(row)
'''
          new_user = '''def _create_user(username, password, display_name, role):
    """Create a test user with legacy Main Library access by default.

    The general suite predates first-class libraries and models an upgraded
    single-library installation. Dedicated permission tests create raw users
    when they need to exercise the no-membership case.
    """
    from app.auth import hash_password
    from app.database import get_db
    from app.services import libraries

    with get_db() as conn:
        conn.execute(
            "INSERT INTO users (username, password, display_name, role) VALUES (?, ?, ?, ?)",
            (username, hash_password(password), display_name, role),
        )
        row = conn.execute(
            "SELECT id, username, role, display_name FROM users WHERE username = ?",
            (username,),
        ).fetchone()
        data = dict(row)
        if role in ("viewer", "editor"):
            libraries.set_membership(
                conn,
                libraries.DEFAULT_LIBRARY_ID,
                data["id"],
                role,
            )
        return data
'''
          if old_user not in text:
              raise SystemExit('user fixture anchor not found')
          text = text.replace(old_user, new_user, 1)

          old_item = '''def _insert_item(db, title="Test Book", isbn="9780000000026", media_type="book", **kwargs):
    """Insert a test item and return its ID."""
    fields = {"title": title, "isbn": isbn, "media_type": media_type, "source": "test"}
    fields.update(kwargs)
    cols = ", ".join(fields.keys())
    placeholders = ", ".join("?" for _ in fields)
    cursor = db.execute(f"INSERT INTO items ({cols}) VALUES ({placeholders})", list(fields.values()))
    return cursor.lastrowid
'''
          new_item = '''def _insert_item(
    db,
    title="Test Book",
    isbn="9780000000026",
    media_type="book",
    _library_id=1,
    **kwargs,
):
    """Insert a test item and return its ID.

    General tests model an upgraded single-library installation, so fixture
    items join Main Library by default. Pass ``_library_id=None`` when a
    permission test intentionally needs an unmapped item. Historical migration
    tests stay neutral when the library tables do not exist yet.
    """
    fields = {"title": title, "isbn": isbn, "media_type": media_type, "source": "test"}
    fields.update(kwargs)
    cols = ", ".join(fields.keys())
    placeholders = ", ".join("?" for _ in fields)
    cursor = db.execute(f"INSERT INTO items ({cols}) VALUES ({placeholders})", list(fields.values()))
    item_id = cursor.lastrowid

    if _library_id is not None:
        try:
            library_exists = db.execute(
                "SELECT 1 FROM libraries WHERE id = ?",
                (int(_library_id),),
            ).fetchone()
        except sqlite3.OperationalError:
            library_exists = None
        if library_exists:
            from app.services import libraries
            libraries.assign_item(db, item_id, int(_library_id))

    return item_id
'''
          if old_item not in text:
              raise SystemExit('item fixture anchor not found')
          path.write_text(text.replace(old_item, new_item, 1))
          PY
          python -m py_compile app/services/libraries.py app/services/user_state_browse.py app/routers/personal_browse.py tests/conftest.py
          git diff --check

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Focused access regressions
        run: |
          python -m pytest \
            tests/test_library_permissions_037.py \
            tests/test_library_browse_access_037.py \
            tests/test_personal_browse_037.py \
            tests/test_browse_parity.py \
            tests/test_fork_upgrade_037.py \
            tests/test_fork_upgrade_startup_037.py \
            tests/test_schema_ownership.py \
            tests/test_router_registration.py \
            -q --tb=short

      - name: Full regression and checks
        run: |
          make badges
          make test
          make checks-fast

      - name: Publish validated Browse scope
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/conftest.py README.md
          git diff --check --cached
          git commit -m "LIBRARIES: make legacy fixtures Main Library aware" || true
          git push origin HEAD:rebuild/library-access-scope-037
