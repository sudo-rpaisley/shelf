                  <button type="submit" class="px-4 py-2 bg-shelf-accent text-white rounded-lg text-sm hover:bg-shelf-accent2 transition-colors">Save</button>
              </form>

              <form hx-post="/api/discogs/test" hx-target="#discogs-test-result" hx-swap="innerHTML" class="mt-4 pt-4 border-t border-shelf-border space-y-2">
                  <label for="discogs-test-token" class="block text-sm font-medium text-shelf-muted">Test connection</label>
                  <div class="flex gap-2">
                      <input id="discogs-test-token" name="token" type="password" autocomplete="off" placeholder="Optional unsaved token"
                             class="min-w-0 flex-1 bg-shelf-bg border border-shelf-border rounded-lg px-3 py-2 text-shelf-text outline-none">
                      <button type="submit" class="px-4 py-2 bg-shelf-hover border border-shelf-border rounded-lg text-sm">Test</button>
