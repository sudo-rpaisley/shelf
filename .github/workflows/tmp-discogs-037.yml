name: Temporary Discogs 0.37 port

on:
  push:
    branches:
      - tmp/discogs-037-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upstream/discogs-037
          fetch-depth: 0

      - name: Port Discogs onto current upstream
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin upstream/discogs-036

          # The Discogs HTTP client is provider-boundary code and ports cleanly.
          git show origin/upstream/discogs-036:app/services/discogs.py > app/services/discogs.py

          cat > app/services/discogs_catalog.py <<'PY'
          """Persistence for optional Discogs pressing enrichment.

          MusicBrainz remains the canonical release identity. Discogs stores one
          explicitly selected pressing and replaceable collector metadata in tables
          owned centrally by ``app.database.MIGRATION_TABLES``.
          """

          from __future__ import annotations

          import json
          from datetime import datetime, timezone


          def _now() -> str:
              return datetime.now(timezone.utc).replace(microsecond=0).isoformat()


          def save_enrichment(db, item_id: int, release: dict) -> None:
              try:
                  release_id = int(release.get("discogs_release_id"))
              except (TypeError, ValueError):
                  raise ValueError("a Discogs release ID is required") from None
              if release_id <= 0:
                  raise ValueError("a Discogs release ID is required")

              if not db.execute(
                  "SELECT 1 FROM music_releases WHERE item_id = ?", (item_id,)
              ).fetchone():
                  raise ValueError("MusicBrainz release must be attached first")

              db.execute(
                  """INSERT INTO music_discogs (
                         item_id, discogs_release_id, discogs_master_id, label,
                         catalog_number, format_summary, genres_json, styles_json,
                         notes, discogs_url, updated_at
                     ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
                     ON CONFLICT(item_id) DO UPDATE SET
                         discogs_release_id = excluded.discogs_release_id,
                         discogs_master_id = excluded.discogs_master_id,
                         label = excluded.label,
                         catalog_number = excluded.catalog_number,
                         format_summary = excluded.format_summary,
                         genres_json = excluded.genres_json,
                         styles_json = excluded.styles_json,
                         notes = excluded.notes,
                         discogs_url = excluded.discogs_url,
                         updated_at = excluded.updated_at""",
                  (
                      item_id,
                      release_id,
                      release.get("discogs_master_id"),
                      release.get("label"),
                      release.get("catalog_number"),
                      release.get("format_summary"),
                      json.dumps(release.get("genres") or [], ensure_ascii=False),
                      json.dumps(release.get("styles") or [], ensure_ascii=False),
                      release.get("notes"),
                      release.get("discogs_url"),
                      _now(),
                  ),
              )
              db.execute(
                  "DELETE FROM music_discogs_identifiers WHERE item_id = ?", (item_id,)
              )
              for identifier in release.get("identifiers") or []:
                  if not isinstance(identifier, dict):
                      continue
                  kind = str(identifier.get("identifier_type") or "").strip()
                  value = str(identifier.get("value") or "").strip()
                  if not kind or not value:
                      continue
                  db.execute(
                      """INSERT OR IGNORE INTO music_discogs_identifiers
                         (item_id, identifier_type, value, description)
                         VALUES (?, ?, ?, ?)""",
                      (
                          item_id,
                          kind,
                          value,
                          str(identifier.get("description") or "").strip() or None,
                      ),
                  )


          def get_enrichment(db, item_id: int) -> dict | None:
              row = db.execute(
                  "SELECT * FROM music_discogs WHERE item_id = ?", (item_id,)
              ).fetchone()
              if not row:
                  return None
              result = dict(row)
              for source, target in (("genres_json", "genres"), ("styles_json", "styles")):
                  try:
                      result[target] = json.loads(result.get(source) or "[]")
                  except (TypeError, ValueError, json.JSONDecodeError):
                      result[target] = []
              result["identifiers"] = [
                  dict(row)
                  for row in db.execute(
                      "SELECT identifier_type, value, description "
                      "FROM music_discogs_identifiers WHERE item_id = ? "
                      "ORDER BY identifier_type COLLATE NOCASE, value COLLATE NOCASE",
                      (item_id,),
                  ).fetchall()
              ]
              return result


          def clear_enrichment(db, item_id: int) -> bool:
              cursor = db.execute(
                  "DELETE FROM music_discogs WHERE item_id = ?", (item_id,)
              )
              db.execute(
                  "DELETE FROM music_discogs_identifiers WHERE item_id = ?", (item_id,)
              )
              return cursor.rowcount > 0
          PY

          cat > app/routers/discogs.py <<'PY'
          """Optional Discogs exact-pressing enrichment for Music."""

          from __future__ import annotations

          import httpx
          from fastapi import APIRouter, Depends, Form, Query, Request
          from fastapi.responses import HTMLResponse, RedirectResponse

          from app.auth import require_role
          from app.config import HTTP_TIMEOUT, MUSIC_MEDIA_TYPES
          from app.database import get_db, get_setting
          from app.services import discogs, discogs_catalog, music_catalog

          router = APIRouter()


          def _stored_token(db) -> str:
              return (get_setting(db, "discogs_token") or "").strip()


          def _music_context(db, item_id: int):
              item = db.execute("SELECT * FROM items WHERE id = ?", (item_id,)).fetchone()
              if not item or item["media_type"] not in MUSIC_MEDIA_TYPES:
                  return None, None
              return item, music_catalog.get_release(db, item_id)


          def _provider_message(result) -> str:
              return {
                  "no_credential": "Configure a Discogs token first.",
                  "rate_limited": "Discogs is rate-limiting requests. Try again shortly.",
                  "transport_failed": "Discogs could not be reached.",
                  "rejected": "Discogs rejected the token or request.",
                  "no_match": "No matching Discogs releases were found.",
              }.get(getattr(result, "outcome", ""), "Discogs request failed.")


          @router.post("/api/discogs/test")
          async def test_discogs_connection(
              token: str = Form(""),
              _=Depends(require_role("admin")),
          ):
              candidate = token.strip()
              if not candidate:
                  with get_db() as db:
                      candidate = _stored_token(db)
              async with httpx.AsyncClient(timeout=HTTP_TIMEOUT) as client:
                  result = await discogs.test_connection(candidate, client)
              if result.found:
                  username = (result.payload or {}).get("username") or "Discogs user"
                  return HTMLResponse(f"Connected to Discogs as {username}")
              return HTMLResponse(_provider_message(result), status_code=400)


          @router.get("/api/discogs/items/{item_id}/card")
          async def discogs_card(
              request: Request,
              item_id: int,
              _=Depends(require_role("viewer")),
          ):
              with get_db() as db:
                  item, release = _music_context(db, item_id)
                  enrichment = (
                      discogs_catalog.get_enrichment(db, item_id) if release else None
                  )
                  configured = bool(_stored_token(db))
              if not item or not release:
                  return HTMLResponse("")
              return request.app.state.templates.TemplateResponse(
                  request,
                  "fragments/discogs_card.html",
                  {
                      "item": item,
                      "release": release,
                      "discogs": enrichment,
                      "configured": configured,
                  },
              )


          @router.get("/music/item/{item_id}/discogs")
          async def match_discogs_release(
              request: Request,
              item_id: int,
              q: str = Query("", max_length=200),
              artist: str = Query("", max_length=200),
              barcode: str = Query("", max_length=40),
              catalog_number: str = Query("", max_length=100),
              _=Depends(require_role("editor")),
          ):
              with get_db() as db:
                  item, release = _music_context(db, item_id)
                  token = _stored_token(db)
              if not item or not release:
                  return RedirectResponse(f"/item/{item_id}", status_code=303)
              if not token:
                  return RedirectResponse("/settings", status_code=303)

              q = q.strip()
              artist = artist.strip()
              barcode = barcode.strip()
              catalog_number = catalog_number.strip()
              searched = any((q, artist, barcode, catalog_number))
              results = []
              error = ""
              if searched:
                  async with httpx.AsyncClient(timeout=HTTP_TIMEOUT) as client:
                      result = await discogs.search_releases(
                          q,
                          client,
                          token=token,
                          artist=artist or None,
                          barcode=barcode or None,
                          catalog_number=catalog_number or None,
                      )
                  if result.found:
                      results = result.payload or []
                  else:
                      error = _provider_message(result)

              return request.app.state.templates.TemplateResponse(
                  request,
                  "discogs_match.html",
                  {
                      "item": item,
                      "release": release,
                      "results": results,
                      "error": error,
                      "searched": searched,
                      "q": q or item["title"],
                      "artist": artist or (item["authors"] or ""),
                      "barcode": barcode or (item["upc"] or ""),
                      "catalog_number": catalog_number
                      or (release.get("catalog_number") or ""),
                  },
              )


          @router.post("/api/discogs/items/{item_id}/select")
          async def select_discogs_release(
              item_id: int,
              release_id: int = Form(...),
              _=Depends(require_role("editor")),
          ):
              with get_db() as db:
                  item, release = _music_context(db, item_id)
                  token = _stored_token(db)
              if not item or not release:
                  return HTMLResponse("Music release not found", status_code=404)
              if not token:
                  return RedirectResponse("/settings", status_code=303)

              async with httpx.AsyncClient(timeout=HTTP_TIMEOUT) as client:
                  result = await discogs.lookup_release(release_id, client, token=token)
              if not result.found:
                  return HTMLResponse(_provider_message(result), status_code=502)
              with get_db() as db:
                  discogs_catalog.save_enrichment(db, item_id, result.payload)
              return RedirectResponse(f"/music/item/{item_id}", status_code=303)


          @router.post("/api/discogs/items/{item_id}/refresh")
          async def refresh_discogs_release(
              item_id: int,
              _=Depends(require_role("editor")),
          ):
              with get_db() as db:
                  item, release = _music_context(db, item_id)
                  enrichment = (
                      discogs_catalog.get_enrichment(db, item_id) if release else None
                  )
                  token = _stored_token(db)
              if not item or not release or not enrichment:
                  return HTMLResponse("Discogs pressing not found", status_code=404)
              if not token:
                  return RedirectResponse("/settings", status_code=303)
              async with httpx.AsyncClient(timeout=HTTP_TIMEOUT) as client:
                  result = await discogs.lookup_release(
                      enrichment["discogs_release_id"], client, token=token
                  )
              if not result.found:
                  return HTMLResponse(_provider_message(result), status_code=502)
              with get_db() as db:
                  discogs_catalog.save_enrichment(db, item_id, result.payload)
              return RedirectResponse(f"/music/item/{item_id}", status_code=303)


          @router.post("/api/discogs/items/{item_id}/remove")
          async def remove_discogs_release(
              item_id: int,
              _=Depends(require_role("editor")),
          ):
              with get_db() as db:
                  item, release = _music_context(db, item_id)
                  if not item or not release:
                      return HTMLResponse("Music release not found", status_code=404)
                  if not discogs_catalog.clear_enrichment(db, item_id):
                      return HTMLResponse("Discogs pressing not found", status_code=404)
              return RedirectResponse(f"/music/item/{item_id}", status_code=303)
          PY

          # Reuse the already-reviewed presentation templates, then adapt settings
          # to the current integrated Settings page.
          git show origin/upstream/discogs-036:app/templates/discogs_match.html > app/templates/discogs_match.html
          git show origin/upstream/discogs-036:app/templates/fragments/discogs_card.html > app/templates/fragments/discogs_card.html

          cat > app/templates/fragments/settings/discogs.html <<'HTML'
          <div x-show="tab === 'integrations'" class="bg-shelf-card rounded-xl border border-shelf-border p-6" id="discogs-panel" style="display:none">
              <div class="mb-4">
                  <h2 class="text-lg font-semibold">Discogs</h2>
                  <p class="text-xs text-shelf-muted mt-1">Optional exact-pressing and collector metadata for Music releases. MusicBrainz remains the canonical release identity.</p>
              </div>

              <form action="/api/settings" method="post" class="space-y-3">
                  <div>
                      <label for="discogs_token" class="block text-sm font-medium text-shelf-muted mb-1">Personal access token</label>
                      <input id="discogs_token" name="discogs_token" type="password" autocomplete="new-password"
                             placeholder="{% if secrets_present['discogs_token'] %}Configured — leave blank to keep{% else %}Discogs token{% endif %}"
                             class="w-full bg-shelf-bg border border-shelf-border rounded-lg px-3 py-2 text-shelf-text outline-none">
                      <p class="mt-1 text-xs text-shelf-muted"><code>DISCOGS_TOKEN</code> may be used as an environment override and takes precedence over a saved value.</p>
                  </div>
                  {% if secrets_saved['discogs_token'] %}
                  <label class="flex items-center gap-2 text-xs text-shelf-muted">
                      <input type="checkbox" name="clear_discogs_token" class="rounded border-shelf-border"> Remove saved token
                  </label>
