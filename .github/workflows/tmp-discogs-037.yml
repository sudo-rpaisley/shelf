name: Temporary Discogs 0.37 port

on:
  push:
    branches:
      - tmp/discogs-037-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upstream/discogs-037
          fetch-depth: 0

      - name: Apply staged port
        run: |
          set -euo pipefail
          git fetch origin tmp/discogs-037-build upstream/discogs-036
          mkdir -p app/routers app/services app/templates/fragments/settings docs tests
          git show origin/upstream/discogs-036:app/services/discogs.py > app/services/discogs.py
          git show origin/upstream/discogs-036:app/templates/discogs_match.html > app/templates/discogs_match.html
          git show origin/upstream/discogs-036:app/templates/fragments/discogs_card.html > app/templates/fragments/discogs_card.html
          git show origin/tmp/discogs-037-build:tmp_port/app/routers/discogs.py > app/routers/discogs.py
          git show origin/tmp/discogs-037-build:tmp_port/app/services/discogs_catalog.py > app/services/discogs_catalog.py
          git show origin/tmp/discogs-037-build:tmp_port/app/templates/fragments/settings/discogs.html > app/templates/fragments/settings/discogs.html
          git show origin/tmp/discogs-037-build:tmp_port/docs/discogs.md > docs/discogs.md
          git show origin/tmp/discogs-037-build:tmp_port/tests/test_discogs_037.py > tests/test_discogs_037.py
          git show origin/tmp/discogs-037-build:tmp_port/apply.py > /tmp/apply_discogs.py
          python /tmp/apply_discogs.py

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Focused current-upstream validation
        run: |
          python -m pytest tests/test_discogs_037.py tests/test_schema_ownership.py tests/test_router_registration.py -q --tb=short
          make badges
          make checks-fast

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Rebuild committed frontend assets
        run: make css

      - name: Commit port to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app docs tests README.md static/css/app.css static/sw.js
          git commit -m "DISCOGS: port exact-pressing enrichment to Shelf 0.37"
          git push origin HEAD:upstream/discogs-037
