name: Fix Komga upstream main integration

on:
  push:
    branches: [upstream/komga-integration]
    paths: [.github/workflows/fix-komga-main.yml]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upstream/komga-integration
      - name: Fix duplicated function header
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/main.py')
          text = p.read_text()
          bad = 'async def _periodic_hardcover_sync():async def _periodic_hardcover_sync():'
          if bad not in text:
              raise SystemExit('duplicate header not found')
          p.write_text(text.replace(bad, 'async def _periodic_hardcover_sync():', 1))
          PY
          rm .github/workflows/fix-komga-main.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix Komga periodic sync wiring'
          git push origin HEAD:upstream/komga-integration
