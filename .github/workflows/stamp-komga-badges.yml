name: Refresh Komga upstream badges

on:
  push:
    branches: [upstream/komga-integration]
    paths: [.github/workflows/stamp-komga-badges.yml]

permissions:
  contents: write

jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upstream/komga-integration
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Restore upstream README identity and stamp current test counts
        run: |
          git show 556386f8952be82741f01ebad3488466fae4f4b7:README.md > README.md
          python scripts/stamp_test_badges.py
          rm .github/workflows/stamp-komga-badges.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Refresh test badges for Komga integration'
          git push origin HEAD:upstream/komga-integration
