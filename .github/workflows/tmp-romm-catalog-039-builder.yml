name: Build RomM catalogue on Shelf 0.39

on:
  push:
    branches:
      - tmp/romm-catalog-039-builder

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target 0.39 branch
        uses: actions/checkout@v7
        with:
          ref: rebuild/main-039-with-romm-catalog
          fetch-depth: 0

      - name: Replay RomM catalogue on the current holding model
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/romm-catalog-main:refs/remotes/origin/feature/romm-catalog-main
          git fetch origin upstream/romm-catalog-037:refs/remotes/origin/upstream/romm-catalog-037

          for path in \
            app/routers/romm_catalog.py \
            app/templates/romm_library.html \
            docs/romm-catalog.md
          do
            mkdir -p "$(dirname "$path")"
            git show "origin/feature/romm-catalog-main:$path" > "$path"
          done

          # Start from the newer romm_records-aware catalogue tests rather than
          # the obsolete fork-main items.romm_id persistence shape.
          git show origin/upstream/romm-catalog-037:tests/test_romm_catalog.py > tests/test_romm_catalog_main.py

          cat > app/services/romm_catalog.py <<'PYFILE'
          """Read-only catalogue queries for RomM-backed Shelf items."""

          from __future__ import annotations


          def _access_clause(access_sql: str) -> str:
              clean = str(access_sql or "").strip()
              return clean or "1 = 1"


          def platform_summaries(
              db,
              *,
              access_sql: str = "1 = 1",
              access_params: list | None = None,
          ) -> list[dict]:
              """Return visible RomM platform counts keyed by stable provider id."""
              access = _access_clause(access_sql)
              rows = db.execute(
                  "SELECT rr.platform_id, i.platform AS shelf_platform, "
                  "COALESCE(gp.name, i.platform, rr.platform_id) AS platform_name, "
                  "COUNT(*) AS game_count "
                  "FROM romm_records rr JOIN items i ON i.id = rr.item_id "
                  "LEFT JOIN game_platforms gp ON gp.slug = i.platform "
                  f"WHERE ({access}) "
                  "GROUP BY rr.platform_id, i.platform, gp.name "
                  "ORDER BY platform_name COLLATE NOCASE, rr.platform_id",
                  list(access_params or []),
              ).fetchall()
              return [dict(row) for row in rows]


          def fetch_page(
              db,
              *,
              platform_id: str = "",
              query: str = "",
              limit: int = 60,
              offset: int = 0,
              access_sql: str = "1 = 1",
              access_params: list | None = None,
          ) -> tuple[list[dict], int]:
              """Fetch one stable, ACL-scoped page without weakening provider identity."""
              where = [f"({_access_clause(access_sql)})"]
              params: list[object] = list(access_params or [])
              clean_platform = str(platform_id or "").strip()
              clean_query = str(query or "").strip()[:200]
              if clean_platform:
                  where.append("rr.platform_id = ?")
                  params.append(clean_platform)
              if clean_query:
                  where.append(
                      "(i.title LIKE ? COLLATE NOCASE OR "
                      "COALESCE(i.publisher, '') LIKE ? COLLATE NOCASE)"
                  )
                  needle = f"%{clean_query}%"
                  params.extend([needle, needle])
              clause = " WHERE " + " AND ".join(where)

              total = db.execute(
                  "SELECT COUNT(*) AS c FROM romm_records rr "
                  "JOIN items i ON i.id = rr.item_id" + clause,
                  params,
              ).fetchone()["c"]
              rows = db.execute(
                  "SELECT rr.romm_id, rr.platform_id, i.id AS item_id, i.title, "
                  "i.publisher, i.publish_year, i.platform, i.cover_path, i.description, "
                  "COALESCE(gp.name, i.platform, rr.platform_id) AS platform_name "
                  "FROM romm_records rr JOIN items i ON i.id = rr.item_id "
                  "LEFT JOIN game_platforms gp ON gp.slug = i.platform"
                  + clause
                  + " ORDER BY i.title COLLATE NOCASE, i.publish_year, rr.romm_id "
                  "LIMIT ? OFFSET ?",
                  [*params, max(1, int(limit)), max(0, int(offset))],
              ).fetchall()
              return [dict(row) for row in rows], total
          PYFILE

          cat >> tests/test_romm_catalog_main.py <<'PYFILE'


          def test_catalog_honours_library_visibility_predicate(db):
              visible = romm_records.persist_candidate(
                  db, _candidate("rom-visible", "p-one", "snes", "Visible Game")
              )
              romm_records.persist_candidate(
                  db, _candidate("rom-hidden", "p-one", "snes", "Hidden Game")
              )

              rows, total = romm_catalog.fetch_page(
                  db,
                  access_sql="i.id = ?",
                  access_params=[visible["item_id"]],
              )
              summaries = romm_catalog.platform_summaries(
                  db,
                  access_sql="i.id = ?",
                  access_params=[visible["item_id"]],
              )

              assert total == 1
              assert [row["title"] for row in rows] == ["Visible Game"]
              assert sum(row["game_count"] for row in summaries) == 1
          PYFILE

          cat > tests/e2e/test_romm_catalog_main.py <<'PYFILE'
          """Product smoke test for the fork-main RomM synced library."""

          import sqlite3

          import pytest
          from playwright.sync_api import expect

          pytestmark = pytest.mark.e2e


          def test_romm_library_filters_by_provider_platform(live_server, authed_page):
              db_path = live_server["data_dir"] / "shelf.db"
              conn = sqlite3.connect(str(db_path))
              try:
                  snes_item = conn.execute(
                      "INSERT INTO items (title, media_type, source, owned, platform) "
                      "VALUES ('RomM Catalogue SNES', 'video_game', 'romm', 1, 'snes')"
                  ).lastrowid
                  gba_item = conn.execute(
                      "INSERT INTO items (title, media_type, source, owned, platform) "
                      "VALUES ('RomM Catalogue GBA', 'video_game', 'romm', 1, 'gba')"
                  ).lastrowid
                  conn.execute(
                      "INSERT INTO romm_records (romm_id, item_id, platform_id) VALUES (?, ?, ?)",
                      ("e2e-rom-snes", snes_item, "e2e-platform-snes"),
                  )
                  conn.execute(
                      "INSERT INTO romm_records (romm_id, item_id, platform_id) VALUES (?, ?, ?)",
                      ("e2e-rom-gba", gba_item, "e2e-platform-gba"),
                  )
                  conn.execute(
                      "INSERT OR IGNORE INTO library_items (item_id, library_id) VALUES (?, 1)",
                      (snes_item,),
                  )
                  conn.execute(
                      "INSERT OR IGNORE INTO library_items (item_id, library_id) VALUES (?, 1)",
                      (gba_item,),
                  )
                  conn.commit()
              finally:
                  conn.close()

              authed_page.goto(f"{live_server['url']}/romm/library")
              expect(authed_page.locator("body")).to_contain_text("RomM Library")
              expect(authed_page.locator("body")).to_contain_text("RomM Catalogue SNES")
              expect(authed_page.locator("body")).to_contain_text("RomM Catalogue GBA")

              with authed_page.expect_navigation():
                  authed_page.locator("a[href*='platform=e2e-platform-snes']").click()
              expect(authed_page.locator("body")).to_contain_text("RomM Catalogue SNES")
              expect(authed_page.locator("body")).not_to_contain_text("RomM Catalogue GBA")
          PYFILE

          python - <<'PY'
          from pathlib import Path

          p = Path('app/main.py')
          s = p.read_text()
          old = 'shelf_fill, romm, komga, periodicals'
          new = 'shelf_fill, romm, romm_catalog, komga, periodicals'
          if old not in s:
              raise SystemExit('main.py RomM import anchor not found')
          s = s.replace(old, new, 1)
          old = 'app.include_router(romm.router)\napp.include_router(komga.router)'
          new = 'app.include_router(romm.router)\napp.include_router(romm_catalog.router)\napp.include_router(komga.router)'
          if old not in s:
              raise SystemExit('main.py RomM router anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('app/templates/fragments/settings/romm.html')
          s = p.read_text()
          old = '<button id="romm-sync" type="button" class="px-4 py-2 bg-shelf-hover text-shelf-text rounded-lg text-sm hover:bg-shelf-border transition-colors">Sync Now</button>'
          new = '''<div class="flex flex-wrap gap-2">
                <button id="romm-sync" type="button" class="px-4 py-2 bg-shelf-hover text-shelf-text rounded-lg text-sm hover:bg-shelf-border transition-colors">Sync Now</button>
                <a href="/romm/library" class="inline-flex items-center px-4 py-2 bg-shelf-hover text-shelf-text rounded-lg text-sm hover:bg-shelf-border transition-colors">Browse synced library</a>
            </div>'''
          if old not in s:
              raise SystemExit('RomM settings sync anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          python -m compileall -q app
          git diff --check
          git diff --stat

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Focused unit and route tests
        run: |
          pytest -q tests/test_romm_catalog_main.py tests/test_romm*.py tests/test_library*.py
          make check-alpine

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Focused Chromium smoke
        run: pytest -q tests/e2e/test_romm_catalog_main.py -m e2e

      - name: Publish clean feature commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Robert J Paisley"
          git config user.email "56076332+sudo-rpaisley@users.noreply.github.com"
          git add \
            app/main.py \
            app/routers/romm_catalog.py \
            app/services/romm_catalog.py \
            app/templates/fragments/settings/romm.html \
            app/templates/romm_library.html \
            docs/romm-catalog.md \
            tests/test_romm_catalog_main.py \
            tests/e2e/test_romm_catalog_main.py
          git commit -m "ROMM: restore synced-library catalogue on Shelf 0.39"
          git push origin HEAD:rebuild/main-039-with-romm-catalog
