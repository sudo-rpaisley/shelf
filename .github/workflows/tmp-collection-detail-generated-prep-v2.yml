name: Prepare Collection detail generated outputs v2

on:
  push:
    branches:
      - tmp/collection-detail-generated-prep-v2

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: npm ci
      - run: make css
      - run: make badges
      - name: Commit generated outputs only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Robert J Paisley"
          git config user.email "56076332+sudo-rpaisley@users.noreply.github.com"
          git add README.md static/css/app.css static/sw.js
          if git diff --cached --quiet; then
            echo "Generated outputs already current"
          else
            git commit -m "Build: refresh Collection detail generated outputs"
            git push origin HEAD:tmp/collection-detail-generated-prep-v2
          fi
