name: Build library-scoped public sharing

on:
  push:
    branches:
      - tmp/library-share-scope-039-builder

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/library-share-scope-039-builder
          fetch-depth: 0
      - name: Preserve builder and reset to published Collections foundation
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/tmp_build_library_share_scope_039.py /tmp/build_share_scope.py
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git reset --hard origin/upstream/collections-foundation-039
          echo "PARENT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git config user.name "Robert J Paisley"
          git config user.email "56076332+sudo-rpaisley@users.noreply.github.com"
      - name: Build library-scoped sharing
        run: |
          python /tmp/build_share_scope.py
          python - <<'PY'
          from pathlib import Path
          p = Path("tests/test_share_links.py")
          p.write_text(p.read_text().rstrip() + "\n")
          PY
          git diff --check
          python -m compileall -q app
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: npm ci
      - name: Regenerate committed outputs
        run: |
          make css
          make badges
          python scripts/stamp_sw_version.py
          git diff --check
      - name: Focused sharing and library checks
        run: |
          pytest -q tests/test_share_links.py tests/test_library_permissions.py tests/test_collections.py
          make check-alpine
          make check-csrf
      - name: Full unit and static checks
        run: |
          make test
          make checks-fast
      - name: Full Chromium E2E
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          playwright install --with-deps chromium
          make test-e2e
      - name: Publish one-commit dependent PR branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git reset --soft "$PARENT_SHA"
          git commit -m "LIBRARIES: scope public share links to one library"
          git fetch origin refs/heads/upstream/library-share-scope-039:refs/remotes/origin/upstream/library-share-scope-039 || true
          if git show-ref --verify --quiet refs/remotes/origin/upstream/library-share-scope-039; then
            expected=$(git rev-parse refs/remotes/origin/upstream/library-share-scope-039)
            git push origin HEAD:upstream/library-share-scope-039 \
              --force-with-lease=refs/heads/upstream/library-share-scope-039:$expected
          else
            git push origin HEAD:upstream/library-share-scope-039
          fi
