name: Music catalogue one-shot fixup

on:
  push:
    branches: [feat/music-catalog]

permissions:
  contents: write

jobs:
  fixup:
    if: ${{ !contains(github.event.head_commit.message, '[music-fixup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/music-catalog
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Patch integration regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  print(f"already patched or pattern absent: {path}")
                  return
              p.write_text(text.replace(old, new))

          replace(
              "tests/test_intake.py",
              '"books": [{"title": "Something", "media_type": "vinyl"}],',
              '"books": [{"title": "Something", "media_type": "laserdisc"}],',
          )
          replace(
              "tests/test_item_edit_boundaries.py",
              'data={"media_type": "vinyl"}',
              'data={"media_type": "laserdisc"}',
          )
          replace(
              "tests/test_nav.py",
              "def test_registry_covers_the_nine_tabs():",
              "def test_registry_covers_the_ten_tabs():",
          )
          replace(
              "tests/test_nav.py",
              '        "browse", "scan", "intake", "store", "series", "discover",\n',
              '        "browse", "music", "scan", "intake", "store", "series", "discover",\n',
          )
          replace(
              "tests/test_nav.py",
              '    assert keys == ["browse", "store", "series", "stats"]',
              '    assert keys == ["browse", "music", "store", "series", "stats"]',
          )
          replace(
              "tests/test_music.py",
              '        music_catalog.save_release(db, item_id, _SAMPLE_RELEASE)\n        response = viewer_client.get(f"/item/{item_id}?from=music")',
              '        music_catalog.save_release(db, item_id, _SAMPLE_RELEASE)\n        db.commit()\n        response = viewer_client.get(f"/item/{item_id}?from=music")',
          )
          replace(
              "tests/test_music.py",
              '        music_catalog.save_release(db, item_id, _SAMPLE_RELEASE)\n        response = viewer_client.get(f"/api/music/items/{item_id}/detail")',
              '        music_catalog.save_release(db, item_id, _SAMPLE_RELEASE)\n        db.commit()\n        response = viewer_client.get(f"/api/music/items/{item_id}/detail")',
          )
          replace(
              "tests/test_music_enrich.py",
              '        source="upc",\n    )\n\n    async def fake_search',
              '        source="upc",\n    )\n    db.commit()\n\n    async def fake_search',
          )
          replace(
              "app/main.py",
              'response.headers["X-XSS-Protection"] = "0"',
              'response.headers["X-XSS-Protection"] = "1; mode=block"',
          )
          PY

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          npm ci

      - name: Run focused regressions
        run: |
          python -m pytest -q \
            tests/test_intake.py::TestConfirmEndpoint::test_unknown_media_type_rejected \
            tests/test_item_edit_boundaries.py::test_edit_rejects_unknown_media_type_without_mutation \
            tests/test_nav.py::test_registry_covers_the_ten_tabs \
            tests/test_nav.py::test_anonymous_sees_only_ungated_tabs \
            tests/test_music.py::TestMusicRoutes::test_music_item_detail_does_not_render_reading_status \
            tests/test_music.py::TestMusicRoutes::test_music_detail_fragment_renders_tracks \
            tests/test_music_enrich.py::test_existing_scanned_item_prefills_release_search_from_barcode

      - name: Rebuild generated assets and badges
        run: |
          make css
          make badges

      - name: Commit fixup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py tests README.md static/css/app.css static/sw.js
          if git diff --cached --quiet; then
            echo "No fixup changes to commit"
            exit 0
          fi
          git commit -m "fix: resolve music catalogue CI regressions [music-fixup]"
          git push origin HEAD:feat/music-catalog
