name: Sync main into media groups

on:
  push:
    branches: [sync-main-into-media-groups]
    paths: [.github/workflows/sync-main-media-groups.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          npm ci

      - name: Merge current main safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Conflicts:"
            printf '%s\n' "$conflicts"
            allowed='^(README\.md|app/main\.py|static/css/app\.css|static/sw\.js)$'
            unexpected="$(printf '%s\n' "$conflicts" | grep -Ev "$allowed" || true)"
            if [ -n "$unexpected" ]; then
              echo "::error::Unexpected source conflicts need manual review:"
              printf '%s\n' "$unexpected"
              exit 1
            fi

            # Generated outputs are rebuilt below, so use current main as the
            # temporary conflict resolution rather than preserving stale bytes.
            git checkout --theirs README.md static/css/app.css static/sw.js

            # app/main.py has one semantic overlap: current main added music,
            # while the feature branch added related-media routing. Start from
            # current main and add only the related router registration.
            git checkout --theirs app/main.py
            python - <<'PY'
          from pathlib import Path
          p = Path('app/main.py')
          text = p.read_text()
          old = 'from app.routers import pages, items, items_covers, items_csv, items_catalog, locations, platforms, settings, sync, komga, romm, checkouts, valuation, hardcover, store, series, share, tags, intake, archive, music\n'
          new = 'from app.routers import pages, items, items_covers, items_csv, items_catalog, locations, platforms, settings, sync, komga, romm, related, checkouts, valuation, hardcover, store, series, share, tags, intake, archive, music\n'
          if old not in text:
              raise SystemExit('current main router import changed unexpectedly')
          text = text.replace(old, new, 1)
          old_include = 'app.include_router(romm.router)\napp.include_router(checkouts.router)'
          new_include = 'app.include_router(romm.router)\napp.include_router(related.router)\napp.include_router(checkouts.router)'
          if old_include not in text:
              raise SystemExit('current main router registration changed unexpectedly')
          text = text.replace(old_include, new_include, 1)
          p.write_text(text)
          PY
            git add README.md app/main.py static/css/app.css static/sw.js
          fi

      - name: Regenerate derived files
        run: |
          make badges
          make css

      - name: Run focused media-group and RomM checks
        run: |
          python -m pytest \
            tests/test_media_groups.py \
            tests/test_related_media_ui.py \
            tests/test_romm_sync.py \
            tests/test_romm_progress_ui.py \
            tests/test_romm_public_url.py \
            -q --tb=short
          make checks-fast

      - name: Commit merged tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/sync-main-media-groups.yml
          git add -A
          git commit -m "Merge current main into media groups"
          git push origin HEAD:sync-main-into-media-groups
