name: Apply collection merge-readiness fix

on:
  push:
    branches:
      - ui/collection-toolbar-refresh
    paths:
      - .github/workflows/merge-ready-collection-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/collection-toolbar-refresh
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Stabilise bulk selection controls
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/templates/browse.html')
          text = p.read_text()
          old = '''            <button @click="selectAll()" class="px-2 py-1 rounded text-xs text-shelf-muted hover:text-shelf-accent2 transition-colors">Select All</button>'''
          new = '''            <button @click="selectAll()" data-testid="select-all" class="px-2 py-1 rounded text-xs text-shelf-muted hover:text-shelf-accent2 transition-colors">Select All</button>'''
          if old not in text:
              raise SystemExit('select-all template anchor not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('tests/e2e/test_csrf_and_xss_fixes.py')
          text = p.read_text()
          old = '''    authed_page.get_by_text("Select", exact=True).click()
              authed_page.get_by_text("Select All", exact=True).click()'''
          new = '''    authed_page.locator('[data-testid="select-mode-toggle"]').click()
              select_all = authed_page.locator('[data-testid="select-all"]')
              expect(select_all).to_be_visible()
              select_all.click()'''
          if old not in text:
              raise SystemExit('bulk selection test anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/templates/browse.html tests/e2e/test_csrf_and_xss_fixes.py
          git diff --cached --quiet && exit 0
          git commit -m "Stabilise Collection bulk-selection E2E flow"
          git push origin HEAD:ui/collection-toolbar-refresh
