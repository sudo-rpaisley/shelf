name: Temporary OIDC login 0.37 validation

on:
  push:
    branches:
      - tmp/oidc-login-037-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/oidc-session-policy-037
          fetch-depth: 0

      - name: Load OIDC login/callback payload
        run: |
          git fetch origin tmp/oidc-login-037-payload
          git show origin/tmp/oidc-login-037-payload:app/services/oidc_login.py > app/services/oidc_login.py
          git show origin/tmp/oidc-login-037-payload:app/templates/login.html > app/templates/login.html
          git show origin/tmp/oidc-login-037-payload:tests/test_oidc_login_037.py > tests/test_oidc_login_037.py
          git show origin/tmp/oidc-login-037-payload:tmp/apply_oidc_login_037.py > /tmp/apply_oidc_login_037.py
          python /tmp/apply_oidc_login_037.py
          git diff --check

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Focused OIDC login regressions
        run: |
          python -m pytest \
            tests/test_oidc_login_037.py \
            tests/test_oidc_session_policy_037.py \
            tests/test_oidc_accounts_037.py \
            tests/test_oidc_core.py \
            tests/test_oidc_auth_flow.py \
            tests/test_oidc_tokens.py \
            tests/test_auth.py \
            tests/test_auth_boundaries.py \
            tests/test_auth_routes.py \
            tests/test_library_permissions_037.py \
            tests/test_schema_ownership.py \
            tests/test_module_sizes.py \
            -q --tb=short

      - name: Full regression and architecture checks
        run: |
          make badges
          make test
          make checks-fast

      - name: Publish validated OIDC login integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/config.py \
            app/crypto.py \
            app/main.py \
            app/routers/auth_routes.py \
            app/services/oidc_login.py \
            app/templates/login.html \
            tests/test_oidc_login_037.py \
            README.md
          git diff --check --cached
          git commit -m "OIDC: integrate login and callback on Shelf 0.37" || true
          git push origin HEAD:rebuild/oidc-login-037
