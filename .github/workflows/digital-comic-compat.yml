name: Apply Digital Comic compatibility

on:
  push:
    branches: [feature/komga-sync]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/komga-sync
      - name: Apply compatibility changes
        run: python _tmp_digital_comic_compat.py
      - name: Remove temporary files and commit
        run: |
          rm _tmp_digital_comic_compat.py .github/workflows/digital-comic-compat.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Wire Digital Comic through Shelf media families'
          git push origin HEAD:feature/komga-sync
