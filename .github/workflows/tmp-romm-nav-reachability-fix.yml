name: Fix RomM catalogue nav reachability contract

on:
  push:
    branches:
      - tmp/romm-nav-reachability-fix

permissions:
  contents: write

jobs:
  fix-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/main-039-with-romm-catalog
          fetch-depth: 0
      - name: Document secondary navigation and pin the Settings affordance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/test_nav.py')
          s = p.read_text()
          anchor = '''        "/cover-review": (
            "reached from Settings -> Data -> Maintenance, not the nav: a "
            "maintenance chore does not earn permanent nav real estate "
            "(cover-attention-queue design, section 3). The link's existence is "
            "pinned by test_settings.py's cover-review-link tests, so this "
            "exemption is a claim with a test behind it rather than a hole."
        ),
'''
          replacement = anchor + '''        "/romm": (
            "provider-specific shortcut that redirects to /romm/library; the "
            "catalogue is reached from Settings -> RomM rather than consuming "
            "permanent primary-nav space. The Settings affordance is pinned by "
            "test_romm_catalog_main.py."
        ),
        "/romm/library": (
            "provider-specific secondary catalogue reached from Settings -> RomM, "
            "with its Settings affordance pinned by test_romm_catalog_main.py."
        ),
'''
          if anchor not in s:
              raise SystemExit('nav exemption anchor not found')
          p.write_text(s.replace(anchor, replacement, 1))

          p = Path('tests/test_romm_catalog_main.py')
          s = p.read_text()
          addition = '''\n\ndef test_romm_settings_links_to_synced_library():\n    from pathlib import Path\n\n    html = Path("app/templates/fragments/settings/romm.html").read_text()\n    assert 'href="/romm/library"' in html\n    assert "Browse synced library" in html\n'''
          if 'def test_romm_settings_links_to_synced_library' not in s:
              p.write_text(s.rstrip() + addition + '\n')
          PY
          git diff --check
          git diff --stat
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify failed contract and RomM catalogue tests
        run: |
          pytest -q tests/test_nav.py tests/test_romm_catalog_main.py
          make checks-fast
      - name: Publish fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Robert J Paisley"
          git config user.email "56076332+sudo-rpaisley@users.noreply.github.com"
          git add tests/test_nav.py tests/test_romm_catalog_main.py
          git commit -m "Test: document RomM catalogue secondary navigation"
          git push origin HEAD:rebuild/main-039-with-romm-catalog
