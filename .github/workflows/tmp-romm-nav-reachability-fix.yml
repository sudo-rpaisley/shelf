name: Fix RomM catalogue nav reachability contract

on:
  push:
    branches:
      - tmp/romm-nav-reachability-fix

permissions:
  contents: write

jobs:
  fix-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/main-039-with-romm-catalog
          fetch-depth: 0
      - name: Document secondary navigation and pin the Settings affordance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/test_nav.py')
          s = p.read_text()
          marker = '    }\n\n    nav_paths = {t["path"] for t in NAV_TABS}'
          insert = (
              '        "/romm": (\n'
              '            "provider-specific shortcut that redirects to /romm/library; the "\n'
              '            "catalogue is reached from Settings -> RomM rather than consuming "\n'
              '            "permanent primary-nav space. The Settings affordance is pinned by "\n'
              '            "test_romm_catalog_main.py."\n'
              '        ),\n'
              '        "/romm/library": (\n'
              '            "provider-specific secondary catalogue reached from Settings -> RomM, "\n'
              '            "with its Settings affordance pinned by test_romm_catalog_main.py."\n'
              '        ),\n'
          )
          if marker not in s:
              raise SystemExit('nav EXEMPT end marker not found')
          p.write_text(s.replace(marker, insert + marker, 1))

          p = Path('tests/test_romm_catalog_main.py')
          s = p.read_text()
          if 'def test_romm_settings_links_to_synced_library' not in s:
              s += (
                  '\n\ndef test_romm_settings_links_to_synced_library():\n'
                  '    from pathlib import Path\n\n'
                  '    html = Path("app/templates/fragments/settings/romm.html").read_text()\n'
                  '    assert \'href="/romm/library"\' in html\n'
                  '    assert "Browse synced library" in html\n'
              )
              p.write_text(s)
          PY
          git diff --check
          git diff --stat
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify failed contract and RomM catalogue tests
        run: |
          pytest -q tests/test_nav.py tests/test_romm_catalog_main.py
          make checks-fast
      - name: Publish fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Robert J Paisley"
          git config user.email "56076332+sudo-rpaisley@users.noreply.github.com"
          git add tests/test_nav.py tests/test_romm_catalog_main.py
          git commit -m "Test: document RomM catalogue secondary navigation"
          git push origin HEAD:rebuild/main-039-with-romm-catalog
