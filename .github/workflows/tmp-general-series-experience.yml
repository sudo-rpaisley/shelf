          marker = '''@router.get("/series")
async def series_page'''
          route = '''@router.get("/series/{name:path}", name="series_detail")
async def series_detail(request: Request, name: str, _=Depends(require_role("viewer"))):
    """One provider-neutral series page, keyed by Shelf's NOCASE series name."""
    name = name.strip()
    if not name:
        raise HTTPException(status_code=404, detail="Series not found")

    with get_db() as db:
        rows = db.execute(
            "SELECT i.id, i.title, i.authors, i.cover_path, i.media_type, i.source, "
            "i.series_name, i.series_position, i.owned, i.reading_status, "
            f"{lists.WISHLISTED_SQL} AS wishlisted "
            "FROM items_live i WHERE i.series_name = ? COLLATE NOCASE "
            "ORDER BY i.series_position IS NULL, i.series_position, i.title COLLATE NOCASE, i.id",
            (name,),
        ).fetchall()
        if not rows:
            raise HTTPException(status_code=404, detail="Series not found")

        meta = db.execute(
            "SELECT description, complete, hc_total, hc_missing, hc_checked_at "
            "FROM series_meta WHERE name = ? COLLATE NOCASE",
            (name,),
        ).fetchone()

    spellings = {}
    for row in rows:
        spelling = row["series_name"]
        spellings[spelling] = spellings.get(spelling, 0) + 1
    display_name = min(spellings.items(), key=lambda kv: (-kv[1], kv[0]))[0]
    items = [dict(row) for row in rows]
    positions = [item["series_position"] for item in items]
    series = {
        "name": display_name,
        "items": items,
        "owned_count": sum(1 for item in items if item["owned"]),
        "wishlist_count": sum(1 for item in items if item["wishlisted"]),
        "gaps": find_gaps(positions),
        "sources": sorted({item["source"] for item in items if item["source"]}),
        "description": meta["description"] if meta else None,
        "complete": meta["complete"] if meta else None,
        "hc_total": meta["hc_total"] if meta else None,
        "hc_missing": meta["hc_missing"] if meta else None,
        "hc_checked_at": meta["hc_checked_at"] if meta else None,
    }
    return request.app.state.templates.TemplateResponse(
        request,
        "series_detail.html",
        {"series": series, "media_types": MEDIA_TYPES, "source_labels": SOURCE_LABELS},
    )


@router.get("/series")
async def series_page'''
