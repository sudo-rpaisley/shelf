              '    # narrow the underlying item set. It stays in the URL because a grouped\n'
              '    # Browse URL must reproduce the same cards when shared.\n'
              '    BrowseFilter("group_series", prefix="Series", default="0", chip=False, clear_to=None),\n'
              '    # `view` is the odd one:'
          )

          # First-paint Browse route: leave the existing query untouched unless grouping is requested.
          p = Path('app/routers/pages.py')
