'''
          new = '''        openOrToggle(id, url, event) {
            if (this.selectMode) { this.toggleItem(id); return; }
            if (event && (event.ctrlKey || event.metaKey)) window.open(url, '_blank');
            else window.location = url;
        },

        groupIds(csv) {
            if (!csv) return [];
            return csv.split(',').map(function(value) { return parseInt(value); })
                .filter(function(value) { return Number.isInteger(value); });
        },

        allSelected(csv) {
            var self = this;
            var ids = this.groupIds(csv);
            return ids.length > 0 && ids.every(function(id) { return self.selectedIds.indexOf(id) >= 0; });
        },

        openGroupOrToggle(csv, url, event) {
            if (this.selectMode) { this.toggleGroup(csv); return; }
            if (event && (event.ctrlKey || event.metaKey)) window.open(url, '_blank');
            else window.location = url;
        },

        toggleGroup(csv) {
            var ids = this.groupIds(csv);
            var remove = this.allSelected(csv);
            var self = this;
            ids.forEach(function(id) {
                var idx = self.selectedIds.indexOf(id);
                if (remove) {
                    if (idx >= 0) self.selectedIds.splice(idx, 1);
