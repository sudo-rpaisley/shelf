name: Validate Settings redesign 0.37

on:
  push:
    branches:
      - tmp/settings-redesign-037-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/settings-redesign-037
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Focused Settings regressions
        run: |
          pytest -q tests/test_settings_redesign_037.py tests/test_settings_request_validation.py tests/test_settings_test_request_validation.py tests/test_account_menu_037.py
          make check-alpine
      - name: Focused Settings browser journeys
        run: |
          playwright install --with-deps chromium
          pytest -q -m e2e tests/e2e/test_settings_redesign_037.py tests/e2e/test_account_menu_037.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Rebuild generated assets
        run: |
          npm ci
          make css
          make badges
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/css/app.css static/sw.js README.md
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "UI: rebuild Settings assets and badges"
            git push origin HEAD:rebuild/settings-redesign-037
          fi

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/settings-redesign-037
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: make test
      - run: make checks-fast

  css:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/settings-redesign-037
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: make css
      - run: git diff --exit-code --stat static/css/app.css static/sw.js

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/settings-redesign-037
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: make test-e2e
