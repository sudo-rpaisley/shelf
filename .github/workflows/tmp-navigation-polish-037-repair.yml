name: Repair grouped navigation E2E contracts

on:
  push:
    branches:
      - tmp/navigation-polish-037-repair

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/navigation-polish-037
      - name: Patch grouped-navigation browser contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "tests/e2e/test_lending.py",
              '''        # Viewer navigation exposes read-only product surfaces, not editor/admin tools.\n        for key in ("browse", "store", "series", "discover", "stats"):\n            expect(page.locator(f'[data-nav-tab="{key}"]')).to_be_visible()\n        for key in ("scan", "settings", "logs"):\n            expect(page.locator(f'[data-nav-tab="{key}"]')).to_have_count(0)''',
              '''        # Viewer navigation exposes read-only product surfaces, not editor/admin tools.\n        for key in ("browse", "series", "discover"):\n            expect(page.locator(f'[data-nav-tab="{key}"]')).to_be_visible()\n        page.get_by_test_id("nav-more-button").click()\n        more = page.get_by_test_id("nav-more-panel")\n        expect(more).to_be_visible()\n        for key in ("store", "stats"):\n            expect(more.locator(f'[data-nav-tab="{key}"]')).to_be_visible()\n        page.keyboard.press("Escape")\n        for key in ("scan", "settings", "logs"):\n            expect(page.locator(f'[data-nav-tab="{key}"]')).to_have_count(0)'''
          )

          replace(
              "tests/e2e/test_nav.py",
              '''HIDEABLE_KEYS = ("scan", "intake", "store", "series", "discover", "stats", "logs")''',
              '''HIDEABLE_KEYS = (\n    "my-list", "scan", "intake", "shelf-fill", "store", "series", "music",\n    "periodicals", "discover", "stats", "attention", "logs",\n)'''
          )
          replace(
              "tests/e2e/test_nav.py",
              '''    for key in ("browse", "store", "series", "stats"):\n        expect(nav_page.locator(f'[data-nav-tab="{key}"]')).to_be_visible()\n    for key in ("intake", "discover"):\n        expect(nav_page.locator(f'[data-nav-tab="{key}"]')).to_have_count(0)''',
              '''    for key in ("browse", "series"):\n        expect(nav_page.locator(f'[data-nav-tab="{key}"]')).to_be_visible()\n    nav_page.get_by_test_id("nav-more-button").click()\n    more = nav_page.get_by_test_id("nav-more-panel")\n    expect(more).to_be_visible()\n    for key in ("store", "stats"):\n        expect(more.locator(f'[data-nav-tab="{key}"]')).to_be_visible()\n    nav_page.keyboard.press("Escape")\n    for key in ("intake", "discover"):\n        expect(nav_page.locator(f'[data-nav-tab="{key}"]')).to_have_count(0)'''
          )

          replace(
              "tests/e2e/test_scan.py",
              '''    button = pg.get_by_role("button", name=mode_label, exact=True)''',
              '''    button = pg.get_by_role("main").get_by_role("button", name=mode_label, exact=True)'''
          )

          p = Path("tests/e2e/test_navigation_polish_037.py")
          text = p.read_text()
          text = text.replace(
              '''import pytest\nfrom playwright.sync_api import expect\n''',
              '''import pytest\nfrom playwright.sync_api import expect\n\nfrom tests.e2e.test_nav import _reset_nav_baseline\n''',
              1,
          )
          old = '''def test_add_and_more_menus_expose_current_destinations(live_server, authed_page):\n    authed_page.goto(f"{live_server['url']}/browse")\n    authed_page.wait_for_load_state("networkidle")\n\n    add = authed_page.get_by_test_id("nav-add-panel")'''
          new = '''def test_add_and_more_menus_expose_current_destinations(live_server, authed_page):\n    _reset_nav_baseline(live_server, authed_page)\n    authed_page.goto(f"{live_server['url']}/browse")\n    authed_page.wait_for_load_state("networkidle")\n\n    add = authed_page.get_by_test_id("nav-add-panel")'''
          if old not in text:
              raise SystemExit("navigation baseline anchor not found")
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - name: Re-run navigation-sensitive browser tests
        run: |
          pytest -q -m e2e \
            tests/e2e/test_navigation_polish_037.py \
            tests/e2e/test_nav.py \
            tests/e2e/test_lending.py::test_viewer_sees_read_only_product_ui_without_editor_mutations \
            tests/e2e/test_scan.py::test_a_typed_duplicate_scan_raises_exactly_one_warning_toast
      - name: Commit repairs to real navigation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/test_lending.py tests/e2e/test_nav.py tests/e2e/test_scan.py tests/e2e/test_navigation_polish_037.py
          git commit -m "UI: align E2E contracts with grouped navigation"
          git push origin HEAD:rebuild/navigation-polish-037
