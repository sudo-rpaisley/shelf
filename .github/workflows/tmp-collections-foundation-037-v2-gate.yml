name: Prepare Collections foundation 0.37 v2

on:
  push:
    branches:
      - tmp/collections-foundation-037-v2-gate

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q tests/test_collections_037.py tests/test_schema_ownership.py tests/test_router_registration.py tests/test_nav.py
      - run: make check-alpine

  generated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: npm ci
      - run: make css
      - run: make badges
      - name: Commit generated files when needed
        run: |
          if git diff --quiet -- README.md static/css/app.css static/sw.js; then
            echo "Generated files already current"
            exit 0
          fi
          git config user.name "Robert J Paisley"
          git config user.email "56076332+sudo-rpaisley@users.noreply.github.com"
          git add README.md static/css/app.css static/sw.js
          git commit -m "Build: refresh Collections generated assets"
          git push origin HEAD:tmp/collections-foundation-037-v2-gate
