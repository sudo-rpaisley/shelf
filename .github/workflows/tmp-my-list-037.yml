name: Temporary My List 0.37 rebuild

on:
  push:
    branches:
      - tmp/my-list-037-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/my-list-037
          fetch-depth: 0

      - name: Register My List and navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('app/main.py')
          text = main.read_text()
          old_import = 'related_media, personal_state\n'
          if old_import not in text:
              raise SystemExit('router import anchor not found')
          text = text.replace(old_import, 'related_media, personal_state, my_list\n', 1)
          anchor = 'app.include_router(personal_state.router)'
          if anchor not in text:
              raise SystemExit('router include anchor not found')
          text = text.replace(anchor, anchor + '\napp.include_router(my_list.router)', 1)
          main.write_text(text)

          nav = Path('app/nav.py')
          text = nav.read_text()
          browse = '    {"key": "browse", "label": "Browse", "path": "/browse"},\n'
          if browse not in text:
              raise SystemExit('nav Browse anchor not found')
          text = text.replace(
              browse,
              browse + '    {"key": "my-list", "label": "My List", "path": "/my-list"},\n',
              1,
          )
          back = 'BACK_TARGETS = {\n'
          if back not in text:
              raise SystemExit('back-target anchor not found')
          text = text.replace(
              back,
              back + '    "my_list": ("/my-list", "Back to My List"),\n',
              1,
          )
          nav.write_text(text)
          PY
          git add app/main.py app/nav.py
          git diff --check --cached

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Focused My List validation
        run: |
          python -m pytest tests/test_my_list_037.py tests/test_router_registration.py -q --tb=short
          make badges
          make test
          make checks-fast

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Rebuild frontend assets
        run: make css

      - name: Commit clean dependent rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md app tests static/css/app.css static/sw.js
          git diff --check --cached
          git commit -m "MY LIST: restore per-user cross-media want-to list"
          git push origin HEAD:rebuild/my-list-037
