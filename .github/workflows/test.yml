name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit and integration tests
        run: make test
      - name: Offline lints (secrets, CSRF header, Alpine CSP)
        run: make checks-fast

  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Tailwind
        run: npm ci
      - name: Rebuild the stylesheet and restamp the service worker
        run: make css
      - name: Commit regenerated assets to the #166 branch
        run: |
          cp static/css/app.css /tmp/app.css
          cp static/sw.js /tmp/sw.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin upstream/related-media-ui
          git checkout -B generated-target origin/upstream/related-media-ui
          cp /tmp/app.css static/css/app.css
          cp /tmp/sw.js static/sw.js
          git add static/css/app.css static/sw.js
          if git diff --cached --quiet; then
            echo "Generated assets already current."
          else
            git commit -m "Rebuild frontend assets for Related Media UI"
            git push origin HEAD:upstream/related-media-ui
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Run E2E tests
        run: make test-e2e
