name: Tests

on:
  push:
    branches: [main]
  pull_request:

# All jobs are read-only; generated artifacts are submitted by their author.
permissions:
  contents: read

jobs:
  # Fork policy: CI verifies the submitted tree with a read-only token. Generated
  # CSS/SW/badges are committed by the author, not a second automatic bot push.
  # Retain all test/lint/build gates and pin the supported browser runner image.

  # Unit/integration suite plus the offline lints. These are the cheap gates and
  # they run together because they share one dependency install.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # requirements*.txt are generated from the .in files (make lock). A PR
      # that edits a .in file must carry the relocked .txt; this is what
      # enforces it. Needs the package index, hence not in checks-fast.
      - name: Check the dependency locks are current
        run: make check-lock

      # The self-test mutates one digest in a temp copy and fails unless
      # check-lock goes red. It needs the index, so it lives here and in
      # `make checks`, not in checks-fast.
      - name: Prove the lock check catches a bad hash
        run: make check-lock-selftest

      - name: Run unit and integration tests
        run: make test

      # check-secrets uses `git grep` over tracked files, so it needs the
      # checkout above and nothing else. check-csrf and check-alpine are the two
      # lints that graduated out of GOTCHAS (G5, G32) — they were only ever run
      # by hand before, which is how the class each one guards kept shipping.
      - name: Offline lints (secrets, CSRF header, Alpine CSP)
        run: make checks-fast

  # The committed Tailwind build must match what the templates actually ask for.
  # Nothing caught a forgotten `make css` before: the stale stylesheet is valid
  # CSS, every unit test passes, and the missing rule only shows up as a broken
  # layout in a browser.
  #
  # Rebuild and compare on both events: this fork permits generated output in
  # pull requests and never silently fixes a stale submitted artifact.
  css:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `make css` also stamps SW_VERSION (scripts/stamp_sw_version.py, stdlib
      # only — no pip install needed).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Tailwind
        run: npm ci

      - name: Rebuild the stylesheet and restamp the service worker
        run: make css

      - name: Committed build output must match the rebuild
        run: |
          git diff --exit-code --stat static/css/app.css static/sw.js || {
            echo "::group::Generated asset diff"
            git diff -- static/css/app.css static/sw.js
            echo "::endgroup::"
            echo "::error::Committed build output is stale — run 'make css' and commit the result."
            echo "static/css/app.css is the Tailwind build; static/sw.js carries the"
            echo "SW_VERSION stamped from the precache digest. Both are generated."
            exit 1
          }

  # Playwright suite, in its own job: it is the slowest gate and the only one
  # that sees rendered geometry, so a failure here should be attributable at a
  # glance rather than buried behind a unit-test run.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      # Serve the CSS built from this exact submitted tree on every event.
      # The separate css job also verifies the committed output matches it.
      # Nothing built here is pushed anywhere.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Tailwind
        run: npm ci

      - name: Rebuild the stylesheet the tests will be served
        run: make css

      # Spins up its own uvicorn per session — no dev server needed.
      - name: Run E2E tests
        run: make test-e2e
