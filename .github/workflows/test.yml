name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit and integration tests
        run: make test
      - name: Offline lints (secrets, CSRF header, Alpine CSP)
        run: make checks-fast

  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Tailwind
        run: npm ci
      - name: Rebuild the stylesheet and restamp the service worker
        run: make css
      - name: Upload generated assets
        uses: actions/upload-artifact@v4
        with:
          name: generated-assets
          path: |
            static/css/app.css
            static/sw.js
      - name: Committed build output must match the rebuild
        run: |
          git diff --exit-code --stat static/css/app.css static/sw.js || {
            echo "::error::Committed build output is stale — run 'make css' and commit the result."
            echo "static/css/app.css is the Tailwind build; static/sw.js carries the"
            echo "SW_VERSION stamped from the precache digest. Both are generated."
            exit 1
          }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Run E2E tests
        run: make test-e2e
