name: Generate Settings UI assets

on:
  pull_request:

permissions:
  contents: write

jobs:
  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upstream/settings-sidebar-043

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Tailwind
        run: npm ci

      - name: Rebuild generated assets
        run: make css

      - name: Commit generated assets to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/css/app.css static/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild Settings UI assets"
            git push origin HEAD:upstream/settings-sidebar-043
          fi
