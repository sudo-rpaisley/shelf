name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Unit/integration suite plus the offline lints. These are the cheap gates and
  # they run together because they share one dependency install.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit and integration tests
        run: make test

      # check-secrets uses `git grep` over tracked files, so it needs the
      # checkout above and nothing else. check-csrf and check-alpine are the two
      # lints that graduated out of GOTCHAS (G5, G32) — they were only ever run
      # by hand before, which is how the class each one guards kept shipping.
      - name: Offline lints (secrets, CSRF header, Alpine CSP)
        run: make checks-fast

  # The committed Tailwind build must match what the templates actually ask for.
  # Nothing caught a forgotten `make css` before: the stale stylesheet is valid
  # CSS, every unit test passes, and the missing rule only shows up as a broken
  # layout in a browser.
  css:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Temporary branch-maintenance checkout: use the PR head directly so the
      # exact generated assets can be committed back to this same branch.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `make css` also stamps SW_VERSION (scripts/stamp_sw_version.py, stdlib
      # only — no pip install needed).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Tailwind
        run: npm ci

      - name: Rebuild the stylesheet and restamp the service worker
        run: make css

      # Temporary one-shot branch maintenance. GITHUB_TOKEN-authored pushes do
      # not recursively trigger this workflow. Restore the normal read-only CSS
      # gate after the generated files have landed.
      - name: Commit generated build output
        run: |
          if ! git diff --quiet -- static/css/app.css static/sw.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add static/css/app.css static/sw.js
            git commit -m "Regenerate CSS and service worker for OIDC settings"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Generated build output is clean
        run: git diff --exit-code -- static/css/app.css static/sw.js

  # Playwright suite, in its own job: it is the slowest gate and the only one
  # that sees rendered geometry, so a failure here should be attributable at a
  # glance rather than buried behind a unit-test run.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      # Spins up its own uvicorn per session — no dev server needed.
      - name: Run E2E tests
        run: make test-e2e
