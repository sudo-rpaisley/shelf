      - name: Run automatic-series regression tests
        run: python -m pytest tests/test_automatic_series_metadata.py tests/test_connection_rebuild.py tests/test_item_series_memberships.py -q --tb=short
      - name: Refresh test-count badges
        run: make badges
      - name: Commit automatic series support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ tests/test_automatic_series_metadata.py README.md
          if git diff --cached --quiet; then
            echo "Automatic series changes are already applied."
            exit 0
          fi
          git commit -m "Populate series automatically from metadata"
          git push origin HEAD:${{ github.ref_name }}
