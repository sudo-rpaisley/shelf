name: Finish automatic series metadata

on:
  push:

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.ref_name == 'feature/rebuild-connected-items'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Wire provider series metadata into memberships
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              assert actual == expected, f"{path}: expected {expected} occurrence(s), found {actual}: {old[:80]!r}"
              p.write_text(text.replace(old, new, expected))

          # Shared membership reconciliation: delete a stale old primary when
          # the compatibility field changes, while retaining genuine secondary
          # memberships.
          replace(
              "app/services/series_memberships.py",
              '''    db.execute("UPDATE item_series SET is_primary = 0 WHERE item_id = ?", (item_id,))
              name = str(item["series_name"] or "").strip()
              if not name:
                  return False
          ''',
              '''    name = str(item["series_name"] or "").strip()
              if name:
                  db.execute(
                      "DELETE FROM item_series WHERE item_id = ? AND is_primary = 1 "
                      "AND series_name != ? COLLATE NOCASE",
                      (item_id, name),
                  )
              else:
                  db.execute(
                      "DELETE FROM item_series WHERE item_id = ? AND is_primary = 1",
                      (item_id,),
                  )
                  return False

              db.execute("UPDATE item_series SET is_primary = 0 WHERE item_id = ?", (item_id,))
          ''',
          )
          replace(
              "app/services/series_memberships.py",
              '''    # The item row is authoritative for *which* membership is primary. Keep
              # secondary memberships intact, clear old primary flags, then upsert every
              # current legacy pair in one set-based pass.
              db.execute("UPDATE item_series SET is_primary = 0")
          ''',
              '''    # The item row is authoritative for *which* membership is primary. Drop
              # a stale former primary when that compatibility field changed, preserve true
              # secondary memberships, then upsert every current legacy pair.
              db.execute(
                  "DELETE FROM item_series WHERE is_primary = 1 AND NOT EXISTS ("
                  "SELECT 1 FROM items i WHERE i.id = item_series.item_id "
                  "AND i.series_name IS NOT NULL AND TRIM(i.series_name) != '' "
                  "AND TRIM(i.series_name) = item_series.series_name COLLATE NOCASE"
                  ")"
              )
              db.execute("UPDATE item_series SET is_primary = 0")
          ''',
          )

          # Hardcover already returns every book_series row. Preserve all of
          # them instead of discarding everything after the first.
          replace(
              "app/services/hardcover.py",
              '''async def _rate_limit():
              await outbound.acquire("api.hardcover.app")
          ''',
              '''async def _rate_limit():
              await outbound.acquire("api.hardcover.app")


          def _book_series_memberships(book: dict) -> list[dict]:
              """Return every explicit Hardcover series membership in API order."""
              rows = []
              seen = set()
              for entry in book.get("book_series") or []:
                  if not isinstance(entry, dict):
                      continue
                  series = entry.get("series") or {}
                  name = str(series.get("name") or "").strip() if isinstance(series, dict) else ""
                  key = name.casefold()
                  if not name or key in seen:
                      continue
                  seen.add(key)
                  rows.append({"name": name, "position": entry.get("position")})
              return rows
          ''',
          )
          replace(
              "app/services/hardcover.py",
              '''        # Extract series
              series_name = None
              series_position = None
              book_series = book.get("book_series", [])
              if book_series:
                  s = book_series[0]
                  series_name = s.get("series", {}).get("name")
                  series_position = s.get("position")
          ''',
              '''        # Extract every explicit series; the first remains the legacy primary.
              series_memberships = _book_series_memberships(book)
              series_name = series_memberships[0]["name"] if series_memberships else None
              series_position = series_memberships[0]["position"] if series_memberships else None
          ''',
              expected=2,
          )
          replace(
              "app/services/hardcover.py",
              '''        "series_position": series_position,
              "isbn10": edition.get("isbn_10"),
          ''',
              '''        "series_position": series_position,
              "series_memberships": series_memberships,
              "isbn10": edition.get("isbn_10"),
          ''',
          )
          replace(
              "app/services/hardcover.py",
              '''            "series_position": series_position,
              "isbn": isbn13,
          ''',
              '''            "series_position": series_position,
              "series_memberships": series_memberships,
              "isbn": isbn13,
          ''',
          )
          replace(
              "app/services/hardcover.py",
              '''        # Series
              series = doc.get("featured_series")
              series_name = None
              series_position = None
              if isinstance(series, dict):
                  series_name = series.get("name")
                  series_position = series.get("position")
              elif doc.get("series_names"):
                  sn = doc["series_names"]
                  series_name = sn[0] if isinstance(sn, list) and sn else None
          ''',
              '''        # Search documents may expose a featured series plus a list of other
              # series names. Keep every explicit name; only the featured series has a
              # reliable position in this response shape.
              series = doc.get("featured_series")
              series_memberships = []
              seen_series = set()
              if isinstance(series, dict) and series.get("name"):
                  name = str(series["name"]).strip()
                  if name:
                      series_memberships.append({"name": name, "position": series.get("position")})
                      seen_series.add(name.casefold())
              names = doc.get("series_names") or []
              if isinstance(names, str):
                  names = [names]
              if isinstance(names, list):
                  for raw_name in names:
                      name = str(raw_name or "").strip()
                      if name and name.casefold() not in seen_series:
                          series_memberships.append({"name": name, "position": None})
                          seen_series.add(name.casefold())
              series_name = series_memberships[0]["name"] if series_memberships else None
              series_position = series_memberships[0]["position"] if series_memberships else None
          ''',
          )
          replace(
              "app/services/hardcover.py",
              '''            "series_position": series_position,
              "isbn": isbn,
          ''',
              '''            "series_position": series_position,
              "series_memberships": series_memberships,
              "isbn": isbn,
          ''',
          )

          # Open Library edition records can carry an explicit `series` field.
          # Accept that label, but only parse an order when the provider string
          # ends in an unambiguous '#N' or ', N'. No title inference.
          replace(
              "app/services/openlibrary.py",
              '''async def _rate_limit():
              await outbound.acquire("openlibrary.org")
          ''',
              '''async def _rate_limit():
              await outbound.acquire("openlibrary.org")


          def _series_memberships(data: dict) -> list[dict]:
              import re

              raw_series = data.get("series") or []
              if isinstance(raw_series, str):
                  raw_series = [raw_series]
              if not isinstance(raw_series, list):
                  return []
              rows = []
              seen = set()
              for raw in raw_series:
                  value = str(raw or "").strip()
                  if not value:
                      continue
                  name = value
                  position = None
                  match = re.match(r"^(.*?)(?:\\s*#\\s*|,\\s*)(\\d+(?:\\.\\d+)?)$", value)
                  if match and match.group(1).strip():
                      name = match.group(1).strip()
                      position = float(match.group(2))
                      if position.is_integer():
                          position = int(position)
                  key = name.casefold()
                  if key in seen:
                      continue
                  seen.add(key)
                  rows.append({"name": name, "position": position})
              return rows
          ''',
          )
          replace(
              "app/services/openlibrary.py",
              '''        result = {
                  "title": title,
                  "subtitle": data.get("subtitle"),
                  "publisher": data.get("publishers", [None])[0],
                  "page_count": data.get("number_of_pages"),
                  "isbn10": data.get("isbn_10", [None])[0] if data.get("isbn_10") else None,
              }

              # Extract publish year
          ''',
              '''        result = {
                  "title": title,
                  "subtitle": data.get("subtitle"),
                  "publisher": data.get("publishers", [None])[0],
                  "page_count": data.get("number_of_pages"),
                  "isbn10": data.get("isbn_10", [None])[0] if data.get("isbn_10") else None,
              }

              series_memberships = _series_memberships(data)
              if series_memberships:
                  result["series_memberships"] = series_memberships
                  result["series_name"] = series_memberships[0]["name"]
                  result["series_position"] = series_memberships[0]["position"]

              # Extract publish year
          ''',
          )

          # ISBN cascade: when Hardcover enriches another source, retain all
          # explicit memberships; save them through insert_item's pseudo-field.
          replace(
              "app/routers/items_common.py",
              '''                if hc_data.get("series_name") and not metadata.get("series_name"):
                          metadata["series_name"] = hc_data["series_name"]
                          metadata["series_position"] = hc_data.get("series_position")
                      if hc_data.get("description") and not metadata.get("description"):
          ''',
              '''                if hc_data.get("series_name") and not metadata.get("series_name"):
                          metadata["series_name"] = hc_data["series_name"]
                          metadata["series_position"] = hc_data.get("series_position")
                      if hc_data.get("series_memberships"):
                          metadata["series_memberships"] = hc_data["series_memberships"]
                      if hc_data.get("description") and not metadata.get("description"):
          ''',
          )
          replace(
              "app/routers/items_common.py",
              '''            series_name=metadata.get("series_name"),
                  series_position=metadata.get("series_position"),
                  location_id=loc_id,
          ''',
              '''            series_name=metadata.get("series_name"),
                  series_position=metadata.get("series_position"),
                  series_memberships=metadata.get("series_memberships"),
                  location_id=loc_id,
          ''',
          )

          # Hardcover import/search-add: store all memberships on both new and
          # already-existing Shelf items.
          replace(
              "app/routers/hardcover.py",
              '''from app.services import hardcover, covers
          ''',
              '''from app.services import hardcover, covers
          from app.services import series_memberships as series_memberships_svc
          ''',
          )
          replace(
              "app/routers/hardcover.py",
              '''    series_position = data.get("series_position")
              if series_position is not None and (
                  isinstance(series_position, bool) or not isinstance(series_position, (int, float))
              ):
                  return {"ok": False, "message": "Invalid request body"}

              title = (raw_title or "").strip()
          ''',
              '''    series_position = data.get("series_position")
              if series_position is not None and (
                  isinstance(series_position, bool) or not isinstance(series_position, (int, float))
              ):
                  return {"ok": False, "message": "Invalid request body"}
              series_memberships = data.get("series_memberships")
              if series_memberships is not None and not isinstance(series_memberships, list):
                  return {"ok": False, "message": "Invalid request body"}

              title = (raw_title or "").strip()
          ''',
          )
          replace(
              "app/routers/hardcover.py",
              '''            series_name=data.get("series_name"),
                  series_position=data.get("series_position"),
                  reading_status="want_to_read",
          ''',
              '''            series_name=data.get("series_name"),
                  series_position=data.get("series_position"),
                  series_memberships=series_memberships,
                  reading_status="want_to_read",
          ''',
          )
          replace(
              "app/routers/hardcover.py",
              '''                _apply_updates(db, existing["id"], updates)
                      cover_job = None if existing["cover_path"] else _cover_job(existing["id"], book)
                      return ("updated" if updates else "skipped", cover_job)
          ''',
              '''                _apply_updates(db, existing["id"], updates)
                      series_added = series_memberships_svc.add_metadata_memberships(
                          db, existing["id"], book.get("series_memberships")
                      )
                      cover_job = None if existing["cover_path"] else _cover_job(existing["id"], book)
                      return ("updated" if updates or series_added else "skipped", cover_job)
          ''',
          )
          replace(
              "app/routers/hardcover.py",
              '''                _apply_updates(db, existing["id"], updates)
                      return ("updated", _cover_job(existing["id"], book))
          ''',
              '''                _apply_updates(db, existing["id"], updates)
                      series_memberships_svc.add_metadata_memberships(
                          db, existing["id"], book.get("series_memberships")
                      )
                      return ("updated", _cover_job(existing["id"], book))
          ''',
          )
          replace(
              "app/routers/hardcover.py",
              '''            series_name=book.get("series_name"),
                  series_position=book.get("series_position"),
                  reading_status=book.get("reading_status"),
          ''',
              '''            series_name=book.get("series_name"),
                  series_position=book.get("series_position"),
                  series_memberships=book.get("series_memberships"),
                  reading_status=book.get("reading_status"),
          ''',
          )

          # Audiobookshelf: its canonical metadata may expose multiple series
          # with sequence values. Preserve them all and keep the first as the
          # compatibility primary.
          replace(
              "app/services/audiobookshelf.py",
              '''from app.services import covers
          ''',
              '''from app.services import covers
          from app.services import series_memberships as series_memberships_svc
          ''',
          )
          replace(
              "app/services/audiobookshelf.py",
              '''def _normalise_publish_year(value):
              """Match SQLite's usual INTEGER coercion so an unchanged year stays unchanged."""
              if value in (None, ""):
                  return None
              try:
                  return int(value)
              except (TypeError, ValueError):
                  return value
          ''',
              '''def _normalise_publish_year(value):
              """Match SQLite's usual INTEGER coercion so an unchanged year stays unchanged."""
              if value in (None, ""):
                  return None
              try:
                  return int(value)
              except (TypeError, ValueError):
                  return value


          def _series_memberships(metadata: dict) -> list[dict]:
              rows = series_memberships_svc.normalise(metadata.get("series"))
              if not rows and metadata.get("seriesName"):
                  rows = series_memberships_svc.normalise(metadata.get("seriesName"))
              return rows
          ''',
          )
          replace(
              "app/services/audiobookshelf.py",
              '''                series_name = metadata.get("seriesName")
                  publisher = metadata.get("publisher")
          ''',
              '''                series_memberships = _series_memberships(metadata)
                  series_name = series_memberships[0]["name"] if series_memberships else None
                  series_position = series_memberships[0]["position"] if series_memberships else None
                  publisher = metadata.get("publisher")
          ''',
          )
          replace(
              "app/services/audiobookshelf.py",
              '''SELECT id, title, authors, narrator, isbn, series_name,
          ''',
              '''SELECT id, title, authors, narrator, isbn, series_name, series_position,
          ''',
              expected=2,
          )
          replace(
              "app/services/audiobookshelf.py",
              '''                            "series_name": series_name,
                              "publisher": publisher,
          ''',
              '''                            "series_name": series_name,
                              "series_position": series_position,
                              "publisher": publisher,
          ''',
          )
          replace(
              "app/services/audiobookshelf.py",
              '''                            db.execute(
                                  """UPDATE items SET title=?, authors=?, narrator=?,
                                     isbn=?, series_name=?, publisher=?, publish_year=?,
                                     description=?, duration_mins=?, media_type=?,
                                     abs_id=?, abs_library_id=?,
                                     updated_at=datetime('now')
                                     WHERE id=?""",
                                  (title, authors, narrator, isbn, series_name,
                                   publisher, pub_year, description, duration_mins,
                                   media_type, abs_id, lib_id, existing["id"]),
                              )
          ''',
              '''                            db.execute(
                                  """UPDATE items SET title=?, authors=?, narrator=?,
                                     isbn=?, series_name=?, series_position=?, publisher=?, publish_year=?,
                                     description=?, duration_mins=?, media_type=?,
                                     abs_id=?, abs_library_id=?,
                                     updated_at=datetime('now')
                                     WHERE id=?""",
                                  (title, authors, narrator, isbn, series_name, series_position,
                                   publisher, pub_year, description, duration_mins,
                                   media_type, abs_id, lib_id, existing["id"]),
                              )
          ''',
          )
          replace(
              "app/services/audiobookshelf.py",
              '''                        item_id = existing["id"]
                          fetch_cover = changed or not existing["cover_path"]
          ''',
              '''                        item_id = existing["id"]
                          series_memberships_svc.add_metadata_memberships(
                              db, item_id, series_memberships
                          )
                          fetch_cover = changed or not existing["cover_path"]
          ''',
          )
          replace(
              "app/services/audiobookshelf.py",
              '''                            series_name=series_name,
                              narrator=narrator,
          ''',
              '''                            series_name=series_name,
                              series_position=series_position,
                              series_memberships=series_memberships,
                              narrator=narrator,
          ''',
          )

          # Komga supplies one explicit series + number. Reconcile that
          # immediately on updates too, rather than waiting for a later page
          # load to backfill the compatibility field.
          replace(
              "app/services/komga.py",
              '''from app.services import covers
          ''',
              '''from app.services import covers
          from app.services import series_memberships as series_memberships_svc
          ''',
          )
          replace(
              "app/services/komga.py",
              '''                        stats["added"] += 1
                          status = "added"
                          fetch_cover = True

                  # Metadata progress is independent of cover I/O.
          ''',
              '''                        stats["added"] += 1
                          status = "added"
                          fetch_cover = True

                      series_memberships_svc.add_metadata_memberships(
                          db,
                          item_id,
                          [{"name": series_name, "position": series_position}] if series_name else [],
                      )

                  # Metadata progress is independent of cover I/O.
          ''',
          )

          # IGDB can return multiple franchises. All of them are legitimate
          # explicit series memberships; ordering falls back to release year
          # when IGDB has no per-franchise sequence.
          replace(
              "app/services/igdb.py",
              '''    # Series / franchise
              series_name = None
              franchises = game.get("franchises", [])
              if franchises:
                  series_name = franchises[0].get("name")

              return {
          ''',
              '''    # Series / franchise
              series_memberships = []
              seen_franchises = set()
              for franchise in game.get("franchises", []) or []:
                  name = str(franchise.get("name") or "").strip() if isinstance(franchise, dict) else ""
                  if name and name.casefold() not in seen_franchises:
                      series_memberships.append({"name": name, "position": None})
                      seen_franchises.add(name.casefold())
              series_name = series_memberships[0]["name"] if series_memberships else None

              return {
          ''',
          )
          replace(
              "app/services/igdb.py",
              '''        "series_name": series_name,
              }
          ''',
              '''        "series_name": series_name,
                  "series_memberships": series_memberships,
              }
          ''',
          )
          replace(
              "app/routers/items_catalog.py",
              '''            series_name=metadata.get("series_name"),
                  platform=platform_val,
          ''',
              '''            series_name=metadata.get("series_name"),
                  series_memberships=metadata.get("series_memberships"),
                  platform=platform_val,
          ''',
          )

          # TMDb movie detail exposes belongs_to_collection. Fetch that explicit
          # collection when adding a film so Film & TV series rows can appear
          # automatically. Search results alone do not include this field.
          replace(
              "app/services/tmdb.py",
              '''TMDB_SEARCH_URL = "https://api.themoviedb.org/3/search/movie"
          ''',
              '''TMDB_SEARCH_URL = "https://api.themoviedb.org/3/search/movie"
          TMDB_MOVIE_URL = "https://api.themoviedb.org/3/movie"
          ''',
          )
          replace(
              "app/services/tmdb.py",
              '''async def search_movies(
          ''',
              '''async def lookup_movie(
              tmdb_id: int, api_key: str, client: httpx.AsyncClient,
          ) -> provider_result.ProviderResult:
              """Fetch one movie including its explicit TMDb collection membership."""
              extra_params, headers = _auth(api_key)
              try:
                  resp = await outbound.fetch(
                      client, "GET", f"{TMDB_MOVIE_URL}/{int(tmdb_id)}",
                      params=extra_params, headers=headers, timeout=10,
                  )
              except Exception:
                  return provider_result.transport_failed("tmdb")

              classified = provider_result.classify_response(
                  "tmdb", resp, auth_statuses=_AUTH_STATUSES
              )
              if classified is not None:
                  return classified
              try:
                  movie = resp.json()
                  title = movie.get("title")
                  if not title:
                      return provider_result.no_match("tmdb", status=resp.status_code)
                  year = str(movie.get("release_date") or "")[:4]
                  collection = movie.get("belongs_to_collection") or {}
                  series_name = (
                      str(collection.get("name") or "").strip()
                      if isinstance(collection, dict) else ""
                  ) or None
                  return provider_result.found("tmdb", {
                      "tmdb_id": movie.get("id"),
                      "title": title,
                      "description": movie.get("overview"),
                      "publish_year": int(year) if year.isdigit() else None,
                      "cover_url": image_url(movie["poster_path"]) if movie.get("poster_path") else None,
                      "series_name": series_name,
                      "series_memberships": (
                          [{"name": series_name, "position": None}] if series_name else []
                      ),
                  }, status=resp.status_code)
              except Exception:
                  return provider_result.no_match("tmdb", status=resp.status_code)


          async def search_movies(
          ''',
          )
          replace(
              "app/routers/items_catalog.py",
              '''    with get_db() as db:
                  item_id = insert_item(
                      db,
                      title=title,
                      description=description or None,
                      media_type="dvd",
                      publish_year=year,
                      location_id=loc_id,
                      source="tmdb",
                  )
          ''',
              '''    series_name = None
              series_memberships = None
              if tmdb_id:
                  with get_db() as db:
                      tmdb_key = get_setting(db, "tmdb_api_key")
                  if tmdb_key:
                      async with httpx.AsyncClient(timeout=HTTP_TIMEOUT) as client:
                          detail = await tmdb.lookup_movie(tmdb_id, tmdb_key, client)
                      if detail.found:
                          detail_meta = detail.payload or {}
                          series_name = detail_meta.get("series_name")
                          series_memberships = detail_meta.get("series_memberships")

              with get_db() as db:
                  item_id = insert_item(
                      db,
                      title=title,
                      description=description or None,
                      media_type="dvd",
                      publish_year=year,
                      series_name=series_name,
                      series_memberships=series_memberships,
                      location_id=loc_id,
                      source="tmdb",
                  )
          ''',
          )

          # Regression coverage for immediate persistence, multiple provider
          # series, existing-library reconciliation and the provider parsers.
          Path("tests/test_automatic_series_metadata.py").write_text(r'''import pytest

          from app.routers import items_catalog
          from app.services import audiobookshelf, hardcover, igdb, openlibrary, provider_result
          from app.services.item_write import insert_item
          from tests.conftest import _insert_item


          def test_insert_item_persists_scalar_series_immediately(db):
              item_id = insert_item(
                  db,
                  title="Series Book",
                  isbn="9780000011001",
                  media_type="book",
                  series_name="Example Saga",
                  series_position=2,
              )
              row = db.execute(
                  "SELECT series_name, position, is_primary FROM item_series WHERE item_id = ?",
                  (item_id,),
              ).fetchone()
              assert row["series_name"] == "Example Saga"
              assert row["position"] == 2
              assert row["is_primary"] == 1


          def test_insert_item_persists_multiple_explicit_series(db):
              item_id = insert_item(
                  db,
                  title="Crossover",
                  isbn="9780000011002",
                  media_type="book",
                  series_name="Main Saga",
                  series_position=3,
                  series_memberships=[
                      {"name": "Main Saga", "position": 3},
                      {"name": "Shared World", "position": 7},
                  ],
              )
              rows = db.execute(
                  "SELECT series_name, position, is_primary FROM item_series "
                  "WHERE item_id = ? ORDER BY series_name COLLATE NOCASE",
                  (item_id,),
              ).fetchall()
              assert {row["series_name"] for row in rows} == {"Main Saga", "Shared World"}
              assert sum(row["is_primary"] for row in rows) == 1
              assert next(row for row in rows if row["series_name"] == "Shared World")["position"] == 7


          def test_rebuild_reconciles_existing_legacy_series(admin_client, db):
              item_id = _insert_item(
                  db,
                  title="Existing Book",
                  isbn="9780000011003",
                  media_type="book",
                  series_name="Existing Saga",
                  series_position=4,
              )
              db.commit()
              assert db.execute(
                  "SELECT 1 FROM item_series WHERE item_id = ?", (item_id,)
              ).fetchone() is None

              response = admin_client.post("/api/items/connections/rebuild")

              assert response.status_code == 200
              assert 'data-testid="series-rebuild-result"' in response.text
              row = db.execute(
                  "SELECT series_name, position, is_primary FROM item_series WHERE item_id = ?",
                  (item_id,),
              ).fetchone()
              assert row["series_name"] == "Existing Saga"
              assert row["position"] == 4
              assert row["is_primary"] == 1


          def test_hardcover_preserves_multiple_book_series():
              rows = hardcover._book_series_memberships({
                  "book_series": [
                      {"series": {"name": "Main Saga"}, "position": 2},
                      {"series": {"name": "Shared World"}, "position": 8},
                  ]
              })
              assert rows == [
                  {"name": "Main Saga", "position": 2},
                  {"name": "Shared World", "position": 8},
              ]


          def test_audiobookshelf_preserves_series_sequences():
              rows = audiobookshelf._series_memberships({
                  "series": [
                      {"series": "Discworld", "sequence": "12"},
                      {"series": "Death", "sequence": "2"},
                  ]
              })
              assert rows == [
                  {"name": "Discworld", "position": 12.0},
                  {"name": "Death", "position": 2.0},
              ]


          def test_igdb_preserves_multiple_franchises_as_series():
              parsed = igdb._parse_game({
                  "id": 1,
                  "name": "Example Game",
                  "franchises": [{"name": "Main Franchise"}, {"name": "Shared Universe"}],
              })
              assert parsed["series_name"] == "Main Franchise"
              assert parsed["series_memberships"] == [
                  {"name": "Main Franchise", "position": None},
                  {"name": "Shared Universe", "position": None},
              ]


          def test_openlibrary_uses_only_explicit_series_metadata():
              rows = openlibrary._series_memberships({
                  "title": "Harry Potter and the Philosopher's Stone",
                  "series": ["Harry Potter #1", "Wizarding World"],
              })
              assert rows == [
                  {"name": "Harry Potter", "position": 1},
                  {"name": "Wizarding World", "position": None},
              ]
              assert openlibrary._series_memberships({"title": "Dune Messiah"}) == []


          def test_reconciliation_removes_stale_old_primary_but_keeps_secondary(db):
              item_id = insert_item(
                  db,
                  title="Changing Series",
                  isbn="9780000011004",
                  media_type="book",
                  series_name="Old Primary",
                  series_position=1,
                  series_memberships=[{"name": "Secondary", "position": 5}],
              )
              db.execute(
                  "UPDATE items SET series_name = 'New Primary', series_position = 2 WHERE id = ?",
                  (item_id,),
              )
              from app.services import series_memberships as series_svc
              series_svc.sync_legacy_item(db, item_id)
              rows = db.execute(
                  "SELECT series_name, is_primary FROM item_series WHERE item_id = ?",
                  (item_id,),
              ).fetchall()
              assert {row["series_name"] for row in rows} == {"New Primary", "Secondary"}
              assert next(row for row in rows if row["series_name"] == "New Primary")["is_primary"] == 1


          def test_dvd_add_uses_tmdb_collection_as_series(admin_client, db, monkeypatch):
              db.execute(
                  "INSERT INTO settings (key, value) VALUES ('tmdb_api_key', 'test-key')"
              )
