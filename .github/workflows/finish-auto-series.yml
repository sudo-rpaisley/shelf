name: Finish automatic series metadata

on:
  push:

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.ref_name == 'feature/rebuild-connected-items'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Apply provider series patch
        run: |
          if [ ! -f scripts/patch_auto_series.py ]; then
            echo "Patch script not present yet; waiting for the next branch push."
            exit 0
          fi
          python scripts/patch_auto_series.py
      - name: Run automatic-series regression tests
        if: hashFiles('tests/test_automatic_series_metadata.py') != ''
        run: python -m pytest tests/test_automatic_series_metadata.py tests/test_connection_rebuild.py tests/test_item_series_memberships.py -q --tb=short
      - name: Refresh test-count badges
        if: hashFiles('tests/test_automatic_series_metadata.py') != ''
        run: make badges
      - name: Commit automatic series support
        if: hashFiles('tests/test_automatic_series_metadata.py') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ tests/test_automatic_series_metadata.py README.md
          if git diff --cached --quiet; then
            echo "Automatic series changes are already applied."
            exit 0
          fi
          git commit -m "Populate series automatically from metadata"
          git push origin HEAD:${{ github.ref_name }}
