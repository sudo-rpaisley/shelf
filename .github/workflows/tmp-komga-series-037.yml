name: Temporary Komga series Browse 0.37 port

on:
  push:
    branches:
      - tmp/komga-series-037-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upstream/komga-series-browse-037
          fetch-depth: 0

      - name: Apply focused 0.36 feature delta
        run: |
          set -euo pipefail
          git fetch origin upstream/komga-series-browse-036
          git diff --binary 4cf280ba5a546215c4f09e8169d1617f368b60df 423238f720f97fdc7224e66e3848d8c293034514 -- . \
            ':(exclude)README.md' \
            ':(exclude)app/routers/pages.py' \
            ':(exclude)static/css/app.css' \
            ':(exclude)static/sw.js' > /tmp/komga-series.patch
          git apply --3way --index /tmp/komga-series.patch

          python - <<'PY'
          from pathlib import Path

          path = Path('app/routers/pages.py')
          text = path.read_text()

          import_anchor = 'from app.services.home_dashboard import dashboard_summary\n'
          assert import_anchor in text
          text = text.replace(
              import_anchor,
              import_anchor + 'from app.services import komga_series_browse\n',
              1,
          )

          old_query = '''        from app.routers.checkouts import OVERDUE_CONDITION, get_overdue_days
          items = db.execute(
              f"SELECT i.*, l.name as location_name, "
              f"(SELECT b.name FROM checkouts c JOIN borrowers b ON c.borrower_id = b.id "
              f" WHERE c.item_id = i.id AND c.checked_in IS NULL LIMIT 1) AS lent_to, "
              f"(SELECT 1 FROM checkouts c WHERE c.item_id = i.id AND {OVERDUE_CONDITION} LIMIT 1) AS lent_overdue "
              f"FROM items i "
              f"LEFT JOIN locations l ON i.location_id = l.id "
              f"{where} ORDER BY {order_clause} LIMIT ?",
              [get_overdue_days(db)] + params + [DEFAULT_PAGE_SIZE],
          ).fetchall()

          total_filtered = db.execute(
              f"SELECT COUNT(*) as c FROM items i {where}", params
          ).fetchone()["c"]
          '''
          new_query = '''        items, total_filtered, display_total = komga_series_browse.fetch_page(
              db,
              where,
              params,
              order_clause,
              limit=DEFAULT_PAGE_SIZE,
              offset=0,
              values=values,
          )
          '''
          assert old_query in text
          text = text.replace(old_query, new_query, 1)

          old_more = '        has_more = len(items) < total_filtered\n'
          assert old_more in text
          text = text.replace(old_more, '        has_more = len(items) < display_total\n', 1)

          marker = '\n\n@router.get("/discover")\n'
          assert marker in text
          route = '''

          @router.get("/series/komga/{series_id}")
          async def komga_series_detail(
              request: Request,
              series_id: str,
              _=Depends(require_role("viewer")),
          ):
              with get_db() as db:
                  series = komga_series_browse.series_detail(db, series_id)
              if series is None:
                  return RedirectResponse(url="/browse")
              return request.app.state.templates.TemplateResponse(
                  request,
                  "komga_series_detail.html",
                  {"series": series},
              )
          '''
          text = text.replace(marker, route + marker, 1)
          path.write_text(text)
          PY

          git add app/routers/pages.py
          git diff --check --cached

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate current-upstream behaviour
        run: |
          make badges
          make test
          make checks-fast

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: Rebuild committed frontend assets
        run: make css

      - name: Focused Komga product smoke
        run: |
          python -m playwright install --with-deps chromium
          python -m pytest tests/e2e/test_komga_series_browse.py -q --tb=short -m e2e

      - name: Commit clean port
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md app static tests
          git diff --check --cached
          git commit -m "KOMGA: group stable provider series in Browse"
          git push origin HEAD:upstream/komga-series-browse-037
