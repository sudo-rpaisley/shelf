name: Build location copy ordering
on:
  push:
    branches: [upstream/location-copy-ordering-036-helper]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upstream/location-copy-ordering-036-helper
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply location ordering slice
        run: python scripts/zz_build_location_order.py
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          npm install
      - name: Run focused tests
        run: pytest -q tests/test_location_order.py
      - name: Refresh generated projections
        run: |
          make badges
          make css
      - name: Run repository offline checks
        run: make checks-fast
      - name: Commit finished tree without helper machinery
        run: |
          rm -f scripts/zz_build_location_order.py .github/workflows/zz-build-location-order.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add physical shelf copy ordering'
          git push origin HEAD:upstream/location-copy-ordering-036-helper
