name: Build Komga series slice

on:
  push:
    branches:
      - upstream/komga-series-browse-036-helper

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply focused-series patch
        run: python tools/patch_komga_series.py

      - name: Rebuild committed frontend assets
        run: |
          npm ci
          make css

      - name: Syntax check changed Python
        run: |
          python -m compileall -q app/services/komga_series_browse.py app/routers/pages.py app/routers/items.py tests/test_komga_series_browse.py tests/e2e/test_komga_series_browse.py

      - name: Commit the finished slice without helper files
        run: |
          rm -f tools/patch_komga_series.py .github/workflows/zz-build-komga-series.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Group Komga series in Browse"
          git push
