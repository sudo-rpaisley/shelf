name: Patch 165

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/fix-discogs-165
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build clean #165 fix tree
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_discogs_036.py')
          text = path.read_text()
          old = '''def test_select_pressing_persists_exact_release(admin_client, db, monkeypatch):
              item_id = _music_item(db)
              monkeypatch.setenv("DISCOGS_TOKEN", "token")
          '''
          new = '''def test_select_pressing_persists_exact_release(admin_client, db, monkeypatch):
              item_id = _music_item(db)
              # TestClient handles the request on a separate DB connection, so the
              # catalogue row and its MusicBrainz release must be committed first.
              db.commit()
              monkeypatch.setenv("DISCOGS_TOKEN", "token")
          '''
          if old not in text:
              raise SystemExit('Discogs select test marker not found')
          path.write_text(text.replace(old, new, 1))
          PY

          npm ci
          make css

          git fetch origin upstream/discogs-036
          git show origin/upstream/discogs-036:.github/workflows/test.yml > .github/workflows/test.yml
          rm .github/workflows/patch165.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TEMP: build clean #165 fix tree"
          git push origin HEAD:tmp/fix-discogs-165
