name: Apply Digital Comic detection test update

on:
  push:
    branches: [feature/komga-sync]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/komga-sync
      - name: Update detection contract test
        run: python _tmp_digital_comic_test_fix.py
      - name: Remove temporary files and commit
        run: |
          rm _tmp_digital_comic_test_fix.py .github/workflows/digital-comic-test-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update media-family contract for Digital Comic'
          git push origin HEAD:feature/komga-sync
