name: Temporary asset rebuild

on:
  push:
    branches:
      - automation/rebuild-166-assets

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Tailwind
        run: npm ci
      - name: Rebuild generated assets
        run: make css
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/css/app.css static/sw.js
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Rebuild generated frontend assets"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
