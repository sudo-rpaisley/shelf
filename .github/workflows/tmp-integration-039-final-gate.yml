name: Final Shelf 0.39 integration gate

# Rerun after legacy copy write-funnel integration fix.
on:
  push:
    branches:
      - tmp/integration-039-final-gate

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/integration-039
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Focused 0.39 plus recovered-feature tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(
            tests/test_scan_modes.py
            tests/test_archive.py
            tests/test_item_copies.py
            tests/test_home_dashboard.py
            tests/test_schema_parity.py
            tests/test_collections_037.py
            tests/test_collections_assignment_037.py
            tests/test_collection_toolbar_permissions_037.py
            tests/test_collection_detail_polish_037.py
            tests/test_cover_review*.py
          )
          existing=()
          for t in "${tests[@]}"; do [ -f "$t" ] && existing+=("$t"); done
          pytest -q "${existing[@]}"
          make check-alpine

  unit-and-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/integration-039
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: make test
      - run: make checks-fast

  generated-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/integration-039
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: npm ci
      - run: make css
      - run: make badges
      - run: git diff --exit-code --stat README.md static/css/app.css static/sw.js

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/integration-039
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: make test-e2e
