name: Validate final manual cover URL changes

on:
  push:
    branches: [ui/manual-cover-url-final]

permissions:
  contents: write

jobs:
  validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          npm ci
      - name: Rebuild generated assets
        run: make css
      - name: Run focused cover regressions
        run: python -m pytest tests/test_covers.py tests/test_module_sizes.py -q --tb=short
      - name: Refresh badges
        run: make badges
      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md static/css/app.css static/sw.js
          if git diff --cached --quiet; then
            echo "Generated assets already current."
          else
            git commit -m "Refresh manual cover generated assets"
            git push origin HEAD:${{ github.ref_name }}
          fi
