name: Add Komga pagination regression

on:
  push:
    branches:
      - upstream/komga-series-pagination-helper

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Add pagination regression and refresh badges
        run: |
          python tools/add_komga_pagination_test.py
          python scripts/stamp_test_badges.py
      - name: Run focused tests and badge check
        run: |
          python -m pytest tests/test_komga_series_browse.py -q --tb=short --no-header
          python scripts/stamp_test_badges.py --check
      - name: Commit clean result
        run: |
          rm -f tools/add_komga_pagination_test.py .github/workflows/zz-add-komga-pagination-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Cover Komga grouping pagination"
          git push
