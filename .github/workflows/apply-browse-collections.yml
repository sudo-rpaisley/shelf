name: Apply Browse and Collections changes

on:
  push:
    branches: [ui/browse-collections-nav-search]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Tailwind
        run: npm ci

      - name: Apply Browse and Collections implementation
        run: |
          if [ -f app/routers/collections.py ]; then
            echo "Implementation already applied."
          else
            python scripts/patch_browse_collections.py
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_collections.py")
          text = path.read_text()
          old = '    assert ">Browse</a>" in html\n'
          new = '    assert "Browse" in html\n'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Build generated UI assets
        run: make css

      - name: Run focused tests
        run: |
          python -m pytest \
            tests/test_collections.py \
            tests/test_nav.py \
            tests/test_browse_filters.py \
            tests/test_item_series_memberships.py \
            -q --tb=short

      - name: Refresh test-count badges
        run: make badges

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app static/js/app.js static/css/app.css static/sw.js tests README.md
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "Add Browse and curated Collections"
          git push origin HEAD:${{ github.ref_name }}