    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/library-access-scope-037-spike
          fetch-depth: 0
      - name: Probe reviewed Browse-scope delta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin pull/127/head:pr127
          git cherry-pick pr127
          git diff --check HEAD^
