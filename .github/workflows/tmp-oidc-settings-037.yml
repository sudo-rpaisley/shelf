name: Temporary OIDC settings 0.37 validation

on:
  push:
    branches:
      - tmp/oidc-settings-037-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/oidc-login-037
          fetch-depth: 0

      - name: Apply OIDC settings payload
        run: |
          git fetch origin tmp/oidc-settings-037-payload
          git show origin/tmp/oidc-settings-037-payload:app/routers/oidc_settings.py > app/routers/oidc_settings.py
          git show origin/tmp/oidc-settings-037-payload:app/templates/fragments/settings/oidc.html > app/templates/fragments/settings/oidc.html
          git show origin/tmp/oidc-settings-037-payload:tests/test_oidc_settings_037.py > tests/test_oidc_settings_037.py
          git show origin/tmp/oidc-settings-037-payload:tmp/apply_oidc_settings_037.py > /tmp/apply_oidc_settings_037.py
          python /tmp/apply_oidc_settings_037.py
          git diff --check

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Focused OIDC settings regressions
        run: |
          python -m pytest \
            tests/test_oidc_settings_037.py \
            tests/test_oidc_login_037.py \
            tests/test_oidc_session_policy_037.py \
            tests/test_oidc_accounts_037.py \
            tests/test_oidc_core.py \
            tests/test_settings.py \
            tests/test_auth_routes.py \
            tests/test_schema_ownership.py \
            tests/test_module_sizes.py \
            -q --tb=short

      - name: Rebuild frontend assets and run full gates
        run: |
          make css
          make badges
          make test
          make checks-fast

      - name: Publish validated OIDC settings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/main.py \
            app/routers/pages.py \
            app/routers/oidc_settings.py \
            app/templates/settings.html \
            app/templates/fragments/settings/oidc.html \
            tests/test_oidc_settings_037.py \
            README.md \
            static/css/app.css \
            static/sw.js
          git diff --check --cached
          git commit -m "OIDC: add settings and recovery controls on Shelf 0.37" || true
          git push origin HEAD:rebuild/oidc-settings-037
