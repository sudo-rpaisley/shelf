name: Build Collections foundation on current upstream

on:
  push:
    branches:
      - tmp/collections-foundation-upstream-039-builder

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/collections-foundation-upstream-039-builder
          fetch-depth: 0
      - name: Preserve helpers and reset to live upstream
        shell: bash
        run: |
          cp scripts/tmp_build_collections_foundation_039.py /tmp/build_collections.py
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git show origin/tmp/library-permissions-upstream-039-builder:scripts/tmp_build_library_permissions_039.py > /tmp/build_library_permissions.py
          git reset --hard 78a946d199489da70b5b5a5215097ce12e287b38
          git config user.name "Robert J Paisley"
          git config user.email "56076332+sudo-rpaisley@users.noreply.github.com"
      - name: Build exact library prerequisite
        run: |
          python /tmp/build_library_permissions.py
          git add app/database.py app/services/libraries.py tests/test_library_permissions.py
          git commit -m 'LIBRARIES: add per-library permission foundation'
      - name: Rebuild Collections foundation integration points
        run: python /tmp/build_collections.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: npm ci
      - name: Regenerate committed outputs
        run: |
          make css
          make badges
          python scripts/stamp_sw_version.py
          git diff --check
      - name: Focused Collections foundation checks
        run: |
          pytest -q tests/test_library_permissions.py tests/test_collections.py tests/test_nav.py
          make check-alpine
      - name: Full unit and static checks
        run: |
          make test
          make checks-fast
      - name: Chromium E2E
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          playwright install --with-deps chromium
          make test-e2e
      - name: Publish synthetic tested stack for later restack
        shell: bash
        run: |
          git add README.md static/css/app.css static/sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Chore: regenerate Collections foundation assets'
          fi
          git push origin HEAD:tmp/collections-foundation-039-synthetic --force
