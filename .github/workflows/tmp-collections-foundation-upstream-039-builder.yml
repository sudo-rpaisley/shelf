name: Build Collections foundation on current upstream

on:
  push:
    branches:
      - tmp/collections-foundation-upstream-039-builder

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/upstream-current-039
          fetch-depth: 0
      - name: Build exact library prerequisite
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git show origin/tmp/library-permissions-upstream-039-builder:scripts/tmp_build_library_permissions_039.py > /tmp/build_library_permissions.py
          python /tmp/build_library_permissions.py
          git config user.name "Robert J Paisley"
          git config user.email "56076332+sudo-rpaisley@users.noreply.github.com"
          git add app/database.py app/services/libraries.py tests/test_library_permissions.py
          git commit -m 'LIBRARIES: add per-library permission foundation'
      - name: Rebuild Collections foundation integration points
        shell: bash
        run: |
          set -euo pipefail
          if git cherry-pick 5b5a3535b0b2d16650d4957ccefd366e74964dcd; then
            echo 'Unexpected clean cherry-pick; continuing'
          else
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n' README.md app/database.py app/main.py app/nav.py static/css/app.css static/sw.js tests/test_nav.py tests/test_navigation_polish_037.py | sort)"
            test "$conflicts" = "$expected"
            git checkout --ours README.md app/database.py app/main.py app/nav.py static/css/app.css static/sw.js tests/test_nav.py
            git rm tests/test_navigation_polish_037.py

            python - <<'PY'
          from pathlib import Path

          # Current upstream + library foundation uses migrations 1-40.
          p = Path('app/database.py')
          s = p.read_text()
          anchor = '''    (40, "Index catalogue items by library",
               "CREATE INDEX IF NOT EXISTS idx_library_items_library ON library_items(library_id)"),
          )'''
          if anchor not in s:
              anchor = '''    (40, "Index catalogue items by library",
               "CREATE INDEX IF NOT EXISTS idx_library_items_library ON library_items(library_id)"),
          )'''
          if anchor not in s:
              # Match the exact indentation produced by the helper.
              anchor = '''    (40, "Index catalogue items by library",
               "CREATE INDEX IF NOT EXISTS idx_library_items_library ON library_items(library_id)"),
          )'''
          # Use a narrower stable marker if formatting differs.
          marker = '''    (40, "Index catalogue items by library",
               "CREATE INDEX IF NOT EXISTS idx_library_items_library ON library_items(library_id)"),'''
          if marker not in s:
              marker = '''    (40, "Index catalogue items by library",
     "CREATE INDEX IF NOT EXISTS idx_library_items_library ON library_items(library_id)"),'''
          if marker not in s:
              raise SystemExit('migration 40 marker not found')
          addition = marker + '''
    (41, "Add library-scoped collections",
     """CREATE TABLE IF NOT EXISTS collections (
            id          INTEGER PRIMARY KEY AUTOINCREMENT,
            library_id  INTEGER NOT NULL REFERENCES libraries(id) ON DELETE CASCADE,
            name        TEXT NOT NULL COLLATE NOCASE,
            description TEXT,
            created_at  TEXT NOT NULL DEFAULT (datetime('now')),
            updated_at  TEXT NOT NULL DEFAULT (datetime('now')),
            UNIQUE(library_id, name)
        )"""),
    (42, "Add collection item memberships",
     """CREATE TABLE IF NOT EXISTS collection_items (
            collection_id INTEGER NOT NULL REFERENCES collections(id) ON DELETE CASCADE,
            item_id       INTEGER NOT NULL REFERENCES items(id) ON DELETE CASCADE,
            created_at    TEXT NOT NULL DEFAULT (datetime('now')),
            PRIMARY KEY (collection_id, item_id)
        )"""),
    (43, "Index collection memberships by item",
     "CREATE INDEX IF NOT EXISTS idx_collection_items_item ON collection_items(item_id)"),
    (44, "Index collections by library",
     "CREATE INDEX IF NOT EXISTS idx_collections_library ON collections(library_id, name COLLATE NOCASE)"),'''
          s = s.replace(marker, addition, 1)

          fresh = '''CREATE TABLE IF NOT EXISTS collections (
    id          INTEGER PRIMARY KEY AUTOINCREMENT,
    library_id  INTEGER NOT NULL REFERENCES libraries(id) ON DELETE CASCADE,
    name        TEXT NOT NULL COLLATE NOCASE,
    description TEXT,
    created_at  TEXT NOT NULL DEFAULT (datetime('now')),
    updated_at  TEXT NOT NULL DEFAULT (datetime('now')),
    UNIQUE(library_id, name)
);

CREATE TABLE IF NOT EXISTS collection_items (
    collection_id INTEGER NOT NULL REFERENCES collections(id) ON DELETE CASCADE,
    item_id       INTEGER NOT NULL REFERENCES items(id) ON DELETE CASCADE,
    created_at    TEXT NOT NULL DEFAULT (datetime('now')),
    PRIMARY KEY (collection_id, item_id)
);
CREATE INDEX IF NOT EXISTS idx_collection_items_item
    ON collection_items(item_id);
CREATE INDEX IF NOT EXISTS idx_collections_library
    ON collections(library_id, name COLLATE NOCASE);

'''
          fresh_anchor = 'CREATE TABLE IF NOT EXISTS game_platforms ('
          if fresh_anchor not in s:
              raise SystemExit('fresh schema anchor not found')
          s = s.replace(fresh_anchor, fresh + fresh_anchor, 1)
          p.write_text(s)

          p = Path('app/main.py')
          s = p.read_text()
          old = 'from app.routers import pages, items, items_covers, cover_review, cover_review_actions, items_csv, items_catalog, locations, location_order, platforms, settings, sync, checkouts, valuation, hardcover, store, series, share, tags, intake, archive, shelf_fill, romm, komga, periodicals, music'
          new = old + ', collections'
          if old not in s:
              raise SystemExit('router import anchor not found')
          s = s.replace(old, new, 1)
          include = 'app.include_router(series.router)\n'
          if include not in s:
              raise SystemExit('series router anchor not found')
          s = s.replace(include, include + 'app.include_router(collections.router)\n', 1)
          p.write_text(s)

          p = Path('app/nav.py')
          s = p.read_text()
          browse = '    {"key": "browse", "label": "Browse", "path": "/browse"},\n'
          collection = '    {"key": "collections", "label": "Collections", "path": "/collections", "roles": ("admin", "editor", "viewer")},\n'
          if browse not in s:
              raise SystemExit('Browse nav anchor not found')
          s = s.replace(browse, browse + collection, 1)
          p.write_text(s)

          p = Path('tests/test_nav.py')
          s = p.read_text()
          s = s.replace('def test_registry_covers_the_twelve_tabs():', 'def test_registry_covers_the_registered_tabs():', 1)
          old = '        "browse", "scan", "intake", "shelf-fill", "store", "series",\n'
          new = '        "browse", "collections", "scan", "intake", "shelf-fill", "store", "series",\n'
          if old not in s:
              raise SystemExit('nav registry expectation anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY

            git mv tests/test_collections_037.py tests/test_collections.py
            sed -i 's/0\.37 library-scoped Collections foundation/Library-scoped Collections foundation/' tests/test_collections.py
            git add README.md app/database.py app/main.py app/nav.py static/css/app.css static/sw.js tests/test_nav.py tests/test_collections.py app/routers/collections.py app/services/collections.py app/templates/collections.html app/templates/collection_detail.html
            git cherry-pick --continue
          fi
          git diff --check
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: npm ci
      - name: Regenerate committed outputs
        run: |
          make css
          make badges
          python scripts/stamp_sw_version.py
          git diff --check
      - name: Focused Collections foundation checks
        run: |
          pytest -q tests/test_library_permissions.py tests/test_collections.py tests/test_nav.py
          make check-alpine
      - name: Full unit and static checks
        run: |
          make test
          make checks-fast
      - name: Chromium E2E
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          playwright install --with-deps chromium
          make test-e2e
      - name: Publish synthetic tested stack for later restack
        shell: bash
        run: |
          git add README.md static/css/app.css static/sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Chore: regenerate Collections foundation assets'
          fi
          git push origin HEAD:tmp/collections-foundation-039-synthetic --force
