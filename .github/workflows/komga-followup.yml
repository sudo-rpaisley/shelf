name: Build Komga follow-up

on:
  push:
    branches: [feature/komga-sync]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/komga-sync
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply Komga follow-up fixes
        run: python _tmp_komga_followup.py
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          npm ci
      - name: Refresh generated files
        run: |
          make badges
          make css
      - name: Remove temporary files and commit
        run: |
          rm _tmp_komga_followup.py .github/workflows/komga-followup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden Komga digital comic sync and public URLs'
          git push origin HEAD:feature/komga-sync
