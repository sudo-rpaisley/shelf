name: Temporary library item edit 0.37 validation

on:
  push:
    branches:
      - tmp/library-item-edit-037-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/library-item-edit-037
          fetch-depth: 0

      - name: Load validation payload
        run: |
          git fetch origin tmp/library-item-edit-037-build
          git show origin/tmp/library-item-edit-037-build:tests/test_library_item_edit_037.py > tests/test_library_item_edit_037.py
          git show origin/tmp/library-item-edit-037-build:tmp/apply_library_item_edit_037.py > /tmp/apply_library_item_edit_037.py
          python /tmp/apply_library_item_edit_037.py
          git diff --check

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Focused item ACL regressions
        run: |
          python -m pytest \
            tests/test_library_item_edit_037.py \
            tests/test_library_item_access_037.py \
            tests/test_related_media_ui.py \
            tests/test_tags.py \
            -q --tb=short

      - name: Full unit regression and checks
        run: |
          make badges
          make test
          make checks-fast

      - name: Publish validated item mutation ACL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/auth.py \
            app/routers/pages.py \
            app/routers/items.py \
            app/routers/items_covers.py \
            app/routers/tags.py \
            app/routers/related_media.py \
            app/routers/hardcover.py \
            app/services/media_groups.py \
            tests/test_library_item_edit_037.py \
            README.md
          git diff --check --cached
          git commit -m "LIBRARIES: enforce item-level edit permissions" || true
          git push origin HEAD:rebuild/library-item-edit-037
