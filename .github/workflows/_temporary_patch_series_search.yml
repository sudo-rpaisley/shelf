name: Temporary grouped Browse search patch

on:
  push:
    branches:
      - work/general-series-experience-046
    paths:
      - .github/workflows/_temporary_patch_series_search.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/general-series-experience-046
      - name: Patch app/routers/items.py
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/routers/items.py")
          text = path.read_text()

          old_import = "from app.services import browse_counts\nfrom app.services import lists\n"
          new_import = "from app.services import browse_counts\nfrom app.services import lists\nfrom app.services import series_browse\n"
          if old_import not in text:
              raise SystemExit("expected browse_counts/lists import marker not found")
          text = text.replace(old_import, new_import, 1)

          start_marker = '@router.get("/search")\nasync def search_items('
          end_marker = '\n\n@router.post("/items/bulk-update")'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("expected /api/search route markers not found")

          replacement = '''@router.get("/search")
          async def search_items(
              request: Request,
              page: int = 1,
              per_page: int = DEFAULT_PAGE_SIZE,
              _=Depends(require_role("viewer")),
          ):
              """Search/filter Browse units and return the HTMX result fragment.

              Filter semantics and dropdown counts remain item-based, exactly as
              `/browse`'s first paint.  Presentation is series-aware: matching
              items are collapsed into provider-neutral series units before
              pagination, using the same service as `/browse`, so first paint and
              live filtering cannot diverge.
              """
              templates = request.app.state.templates

              values = browse_filters.values_from(request.query_params)
              values["q"] = values["q"][:200]
              sort = values["sort"]
              view = values["view"]
              where, params = browse_filters.build_where(values)

              page = max(page, 1)
              page_size = max(1, min(per_page, 200))
              offset = (page - 1) * page_size

              with get_db() as db:
                  from app.routers.checkouts import get_overdue_days
                  items, browse_total = series_browse.fetch_units(
                      db,
                      where=where,
                      params=params,
                      sort=sort,
                      limit=page_size,
                      offset=offset,
                      overdue_days=get_overdue_days(db),
                  )

                  # Dropdown counts remain raw-item counts.  They answer how many
                  # items a filter would match; browse_total answers how many
                  # collapsed units are actually displayed and paginated.
                  total_filtered = db.execute(
                      f"SELECT COUNT(*) as c FROM items_live i {where}", params
                  ).fetchone()["c"]
                  counts = (
                      browse_counts.filter_counts(db, values, total_filtered)
                      if page <= 1 else None
                  )

              has_more = (offset + page_size) < browse_total
              load_more_url = "/api/search?" + browse_filters.querystring(
                  values, extra=[f"page={page + 1}"]
              )

              if page <= 1:
                  template = "fragments/item_grid.html"
              elif view == "list":
                  template = "fragments/item_rows_page.html"
              else:
                  template = "fragments/item_cards_page.html"

              from datetime import datetime, timedelta
              ctx = {
                  "items": items,
                  "media_types": MEDIA_TYPES,
                  "has_more": has_more,
                  "load_more_url": load_more_url,
                  "page": page,
                  "browse_total": browse_total,
                  "total": browse_total,
                  "has_filters": browse_filters.has_active_filters(values),
                  "seven_days_ago": (datetime.now(tz=None) - timedelta(days=7)).strftime("%Y-%m-%d"),
              }
              if counts:
                  ctx.update(counts)
                  ctx["render_oob_counts"] = True

              return templates.TemplateResponse(request, template, ctx)
          '''
          # The triple-quoted literal is indented only because it lives in this
          # workflow's Python block.  Dedent it before writing real module code.
          import textwrap
          replacement = textwrap.dedent(replacement)
          text = text[:start] + replacement.rstrip() + text[end:]
          path.write_text(text)
      - name: Commit guarded patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routers/items.py
          git diff --cached --check
          git commit -m "Group live Browse search results by series"
          git push origin HEAD:work/general-series-experience-046
