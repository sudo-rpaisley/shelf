name: Build Collections assignment 0.37

on:
  push:
    branches:
      - rebuild/collections-assignment-browse-037-v2
    paths:
      - .github/workflows/tmp-build-collections-assignment-037.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python .github/tmp_build_collections_assignment_037.py
      - name: Commit clean integration slice
        run: |
          git config user.name "Robert J Paisley"
          git config user.email "56076332+sudo-rpaisley@users.noreply.github.com"
          git add -A
          git commit -m "Feature: integrate Collections with items and Browse"
          git push origin HEAD:rebuild/collections-assignment-browse-037-v2
