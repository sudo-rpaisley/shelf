name: Temporary Library ACL foundation 0.37

on:
  push:
    branches:
      - tmp/library-permissions-037-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATA_DIR: /tmp/shelf-library-ci
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/library-permissions-037
          fetch-depth: 0

      - name: Fetch temporary patch helper
        run: git show origin/tmp/library-permissions-037-build:.github/tmp_patch_library_037.py > /tmp/patch_library_037.py

      - name: Align library schema with Shelf 0.37 ownership rules
        run: |
          python /tmp/patch_library_037.py
          python -m py_compile app/database.py app/services/libraries.py
          git diff --check

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify central migration registration and ownership
        run: |
          python - <<'PY'
          from app import database
          versions = {v for v, _d, _s in database.MIGRATIONS}
          assert set(range(41, 49)) <= versions, versions
          assert 'CREATE TABLE IF NOT EXISTS libraries (' in database.MIGRATION_TABLES
          PY
          python -m pytest tests/test_router_registration.py tests/test_schema_ownership.py -q --tb=short

      - name: Focused library and fork-upgrade tests
        run: python -m pytest tests/test_library_permissions_037.py tests/test_fork_upgrade_037.py tests/test_fork_upgrade_startup_037.py -q --tb=short

      - name: Full regression and checks
        run: |
          make badges
          make test
          make checks-fast

      - name: Publish validated foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/database.py app/services/libraries.py app/routers/__init__.py tests/test_library_permissions_037.py README.md
          git diff --check --cached
          git commit -m "LIBRARIES: align permission schema with Shelf 0.37"
          git push origin HEAD:rebuild/library-permissions-037
