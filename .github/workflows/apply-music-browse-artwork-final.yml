name: Apply final music browse artwork changes

on:
  push:
    branches: [feature/music-browse-artwork-final]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          npm ci
      - name: Apply implementation
        run: |
          if [ ! -f app/services/music_artwork.py ]; then
            python scripts/apply_music_browse_artwork_final.py
          fi
      - name: Build generated assets
        run: make css
      - name: Run focused regressions
        run: |
          python -m pytest \
            tests/test_music.py \
            tests/test_music_enrich.py \
            tests/test_music_detection.py \
            tests/test_music_artwork.py \
            tests/test_scan_upc_enrichment.py \
            tests/test_back_nav.py \
            tests/test_nav.py \
            tests/test_module_sizes.py \
            -q --tb=short
      - name: Refresh badges
        run: make badges
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests README.md static/css/app.css static/sw.js
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
          else
            git commit -m "Browse music first and repair missing artwork"
            git push origin HEAD:${{ github.ref_name }}
          fi
