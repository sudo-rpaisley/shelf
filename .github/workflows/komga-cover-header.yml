name: Apply Komga cover header fix

on:
  push:
    branches: [feature/komga-sync]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/komga-sync
      - name: Apply cover request fix
        run: python _tmp_komga_cover_header.py
      - name: Remove temporary files and commit
        run: |
          rm _tmp_komga_cover_header.py .github/workflows/komga-cover-header.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Request Komga thumbnails as JPEG images'
          git push origin HEAD:feature/komga-sync
