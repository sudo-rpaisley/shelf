name: Narrow Komga upstream changes

on:
  push:
    branches: [upstream/komga-integration]
    paths: [.github/workflows/narrow-komga-upstream.yml]

permissions:
  contents: write

jobs:
  narrow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upstream/komga-integration
          fetch-depth: 0
      - name: Restore existing Audiobookshelf scheduling semantics
        shell: bash
        run: |
          set -euo pipefail
          base=556386f8952be82741f01ebad3488466fae4f4b7
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show "$base":app/main.py > /tmp/base-main.py

          python - <<'PY'
          from pathlib import Path

          def section(text, start, end):
              a = text.index(start)
              b = text.index(end, a)
              return text[a:b]

          p = Path('app/main.py')
          current = p.read_text()
          base = Path('/tmp/base-main.py').read_text()
          start = 'async def _periodic_abs_sync():'
          end = 'async def _periodic_hardcover_sync():'
          current_abs = section(current, start, end)
          base_abs = section(base, start, end)
          current = current.replace(current_abs, base_abs + '\n\nasync def _periodic_komga_sync():\n' + current.split('async def _periodic_komga_sync():\n',1)[1].split(end,1)[0] + end, 1)
          # The replacement above may duplicate the Komga section if the shape
          # changes, so assert exactly one function before writing.
          if current.count('async def _periodic_komga_sync():') != 1:
              raise SystemExit('unexpected Komga periodic function count')
          p.write_text(current)

          # The Settings page only needs a Komga job snapshot for this feature.
          p = Path('app/routers/pages.py')
          text = p.read_text()
          text = text.replace('    abs_sync_job = sync_jobs.get_status("audiobookshelf")\n', '')
          text = text.replace('         "missing_covers": missing_covers, "cover_queue_stats": cover_queue_stats,\n         "abs_sync_job": abs_sync_job, "komga_sync_job": komga_sync_job},',
                              '         "missing_covers": missing_covers, "cover_queue_stats": cover_queue_stats,\n         "komga_sync_job": komga_sync_job},')
          p.write_text(text)
          PY

          git rm -f .github/workflows/narrow-komga-upstream.yml
          git add -A
          git diff --cached --check
          git commit -m "Keep existing Audiobookshelf scheduling unchanged"
          git push origin HEAD:upstream/komga-integration
