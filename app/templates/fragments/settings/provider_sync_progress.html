{# Used within the fork's single background-job component per connector. #}
<div class="border-t border-shelf-border pt-4 mt-4">
    {% if feature_on(provider_key) %}<button type="button" @click="startSync" :disabled="syncing || !syncReady" :aria-busy="syncing" id="{{ provider_key }}-sync" class="px-4 py-2 bg-shelf-hover rounded-lg text-sm disabled:opacity-50"><span x-show="!syncing" x-text="syncLabel"></span><span x-show="syncing" x-cloak>{{ _('Syncing in background...') }}</span></button>{% endif %}
    <div x-show="syncing" x-cloak class="mt-3" data-testid="{{ provider_key }}-sync-progress"><div class="flex justify-between text-xs text-shelf-muted mb-1"><span x-show="syncTotal > 0" x-text="syncProgress"></span><span x-show="syncTotal === 0">{{ _('Discovering library…') }}</span><span x-show="syncTotal > 0" x-text="syncPct"></span></div><div class="w-full bg-shelf-bg rounded-full h-2 overflow-hidden"><div x-show="syncTotal > 0" class="bg-shelf-accent rounded-full h-2" :style="syncWidth"></div><div x-show="syncTotal === 0" class="bg-shelf-accent rounded-full h-2 w-1/3 animate-pulse" data-testid="{{ provider_key }}-sync-indeterminate"></div></div><p x-show="syncLastTitle" class="text-xs text-shelf-muted mt-1 truncate" x-text="syncLastTitle"></p></div>
    <div x-show="result" class="mt-3 text-sm"><template x-if="result && result.error"><p class="text-shelf-error" x-text="result.error"></p></template><template x-if="result && !result.error"><div><p class="text-shelf-success">{{ _('Added:') }} <span x-text="result.added"></span>, {{ _('Updated:') }} <span x-text="result.updated"></span>, {{ _('Unchanged:') }} <span x-text="result.unchanged"></span>, {{ _('Skipped:') }} <span x-text="result.skipped"></span></p><p class="text-xs text-shelf-muted mt-1">{{ _('Covers imported:') }} <span x-text="result.covers"></span> · {{ _('Cover errors:') }} <span x-text="result.cover_errors"></span></p>{% if provider_key == 'romm' %}<p class="text-xs text-shelf-muted">{{ _('Errors:') }} <span x-text="result.errors"></span></p><p x-show="result.incomplete_platforms" class="text-xs text-shelf-warning">{{ _('Incomplete RomM platforms:') }} <span x-text="result.incomplete_platforms"></span>. {{ _('Re-run sync to retry the missing pages.') }}</p>{% endif %}<template x-if="result.in_trash"><p class="text-xs text-shelf-muted">{{ _('In Trash:') }} <span x-text="result.in_trash"></span></p></template></div></template></div>
    <div x-show="syncLog.length > 0" class="mt-2"><button type="button" @click="showSyncLog = !showSyncLog" class="text-xs text-shelf-accent2"><span x-text="syncLogLabel"></span></button><div x-show="showSyncLog" x-cloak class="mt-2 max-h-48 overflow-y-auto bg-shelf-bg rounded-lg p-2 text-xs font-mono"><template x-for="entry in syncLog" :key="entry.i"><div class="flex gap-2"><span :class="entry.statusClass" x-text="entry.s" class="w-20 shrink-0"></span><span class="truncate" x-text="entry.t"></span></div></template></div></div>
    <form action="/api/sync/{{ provider_key }}/schedule" method="post" class="mt-3 flex flex-wrap items-center gap-2"><label class="text-sm text-shelf-muted">{{ _('Auto-sync:') }} <select name="interval" class="bg-shelf-bg border border-shelf-border rounded-lg px-2 py-1 text-sm">{% for value, label in [('off', 'Off'), ('daily', 'Daily'), ('weekly', 'Weekly')] %}<option value="{{ value }}" {% if settings.get(provider_key ~ '_sync_interval', 'off') == value %}selected{% endif %}>{{ _(label) }}</option>{% endfor %}</select></label><button type="submit" class="px-3 py-1 bg-shelf-hover rounded-lg text-xs">{{ _('Save') }}</button></form>
</div>
