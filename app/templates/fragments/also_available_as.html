<div id="also-available-as"{% if also_available_as_oob %} hx-swap-oob="outerHTML"{% endif %}>
    {% if linked_items %}
    <div class="mb-4">
        <p class="text-xs text-shelf-muted mb-1">Also available as:</p>
        <div class="flex flex-wrap gap-2">
            {% for li in linked_items %}
            <a href="/item/{{ li.id }}{% if back is defined and back and back.key %}?from={{ back.key }}{% endif %}"
               class="px-2 py-1 bg-shelf-hover rounded text-xs text-shelf-text hover:bg-shelf-border transition-colors">
                {{ media_types.get(li.media_type, li.media_type) }}
            </a>
            {% endfor %}
        </div>
    </div>
    {% endif %}
</div>
