{% set ids = item.unit_item_ids %}
{% set series_url = '/series/' ~ (item.unit_label|urlencode) %}
<div class="relative">
<a href="{{ series_url }}" class="group relative block" data-item-ids="{{ ids }}"
   @click.prevent="openGroupOrToggle('{{ ids }}', '{{ series_url }}', $event)">
    <div class="cover-card bg-shelf-card rounded-lg overflow-hidden border border-shelf-border group-hover:border-shelf-accent/50 transition-colors shadow-lg"
         :class="allSelected('{{ ids }}') ? 'ring-2 ring-shelf-accent' : ''">
        <div class="absolute top-2 right-2 z-10 px-1.5 py-0.5 rounded text-[10px] font-medium bg-shelf-accent/90 text-white shadow">
            {{ item.member_count }} item{{ '' if item.member_count == 1 else 's' }}
        </div>
        {% if item.cover_path %}
        <img src="/{{ item.cover_path }}" alt="" class="w-full aspect-[2/3] object-cover" loading="lazy">
        {% else %}
        <div class="w-full aspect-[2/3] bg-shelf-hover flex items-center justify-center p-4">
            <svg class="w-10 h-10 text-shelf-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        </div>
        {% endif %}
        <div class="p-3">
            <p class="font-medium text-sm truncate" title="{{ item.unit_label }}">{{ item.unit_label }}</p>
            <p class="text-xs text-shelf-muted truncate mt-0.5">Series · {{ item.member_count }} catalogued</p>
        </div>
        <div x-show="selectMode" class="absolute inset-0 bg-black/20 flex items-start p-2">
            <div class="w-5 h-5 rounded border-2 flex items-center justify-center text-xs"
                 :class="allSelected('{{ ids }}') ? 'bg-shelf-accent border-shelf-accent text-white' : 'border-white bg-black/40'">
                <span x-show="allSelected('{{ ids }}')">&#10003;</span>
            </div>
        </div>
    </div>
</a>
</div>
