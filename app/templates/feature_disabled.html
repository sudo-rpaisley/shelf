{% extends "base.html" %}
{% block title %}{{ feature.label }} — Shelf{% endblock %}
{% block content %}
<div class="page-layout">
    <div class="bg-shelf-card border border-shelf-border rounded-xl p-6">
        <h1 class="text-2xl font-bold" data-testid="feature-disabled">{{ feature.label }}</h1>
        <p class="text-sm text-shelf-muted mt-2">{{ feature.label }} is turned off on this Shelf.</p>
        <p class="text-sm text-shelf-muted mt-1">{{ feature.description }}</p>
        {% if is_admin %}
        <form method="post" action="/api/settings/features/{{ feature.key }}/enable" class="mt-4" data-testid="feature-enable-form">
            <button type="submit" class="px-4 py-2 bg-shelf-accent text-white rounded-lg text-sm hover:bg-shelf-accent2 transition-colors">Turn on {{ feature.label }}</button>
        </form>
        {% else %}
        <p class="text-sm mt-4">Ask your administrator to turn it on.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
