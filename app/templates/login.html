<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Shelf</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-shelf-accent2 tracking-tight">Shelf</h1>
            <p class="text-shelf-muted text-sm mt-1">Sign in to your library</p>
        </div>

        <div class="bg-shelf-card border border-shelf-border rounded-xl p-6 space-y-4">
            {% if error %}
            <div class="bg-shelf-error/10 border border-shelf-error/30 text-shelf-error text-sm rounded-lg px-4 py-2" role="alert">
                {{ error }}
            </div>
            {% endif %}

            {% if oidc_enabled %}
            <a href="/login?oidc=1"
               class="block w-full text-center bg-shelf-accent hover:bg-shelf-accent2 text-white font-medium rounded-lg px-4 py-2 transition-colors"
               data-testid="oidc-login">
                Sign in with {{ oidc_provider_name }}
            </a>

            <div class="flex items-center gap-3 py-1" aria-hidden="true">
                <div class="h-px flex-1 bg-shelf-border"></div>
                <span class="text-xs text-shelf-muted uppercase tracking-wide">or use a local account</span>
                <div class="h-px flex-1 bg-shelf-border"></div>
            </div>
            {% endif %}

            <form method="POST" action="/login" class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-shelf-muted mb-1">Username</label>
                    <input type="text" id="username" name="username" required autofocus autocomplete="username"
                        class="w-full bg-shelf-bg border border-shelf-border rounded-lg px-3 py-2 text-shelf-text focus:outline-none focus:border-shelf-accent focus:ring-1 focus:ring-shelf-accent">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-shelf-muted mb-1">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        class="w-full bg-shelf-bg border border-shelf-border rounded-lg px-3 py-2 text-shelf-text focus:outline-none focus:border-shelf-accent focus:ring-1 focus:ring-shelf-accent">
                </div>

                <button type="submit"
                    class="w-full bg-shelf-hover hover:bg-shelf-border text-shelf-text font-medium rounded-lg px-4 py-2 transition-colors border border-shelf-border">
                    Sign in locally
                </button>
            </form>
        </div>
    </div>
</body>
</html>
